  <script>
/* js/player.js */
/* Quiz player. Same answer rules and timing as V121:
 *  - Correct: magic sound, the answer blinks green, next question after 2 s.
 *  - Wrong (Práctica): buzzer, blinks red, then the correct answer blinks green, next after 2 s more.
 *  - Wrong (Evaluación): buzzer, blinks red, next question after 2 s (correct answer is not shown).
 */
window.LL = window.LL || {};
(function () {
  const { el, $, speak, playAudio, stopSound, feedbackTone, shuffle, confetti } = LL.ui;
  const PASTELS = ['#F8DDE3', '#FBE4D0', '#FFF1BD', '#DDF2D7', '#D8F0EC', '#DCE8FC'];

  let quiz = null, questions = [], index = 0, opts = {}, timer = null, run = 0, answered = false, selected = new Set();

  const root = () => $('#player');
  const body = () => $('#playerBody');

  function open(entry, options = {}) {
    quiz = entry;
    opts = options;
    questions = LL.store.clone(entry.config?.questions || []);
    if (entry.config?.questionOrder === 'random' && !options.preview) questions = shuffle(questions);
    index = Math.max(0, Math.min(options.startIndex || 0, questions.length - 1));
    root().hidden = false;
    root().classList.toggle('is-preview', !!options.preview);
    document.body.style.overflow = 'hidden';
    render();
  }

  function close() {
    clearTimer();
    stopSound();
    root().hidden = true;
    document.body.style.overflow = '';
    const cb = opts.onClose;
    quiz = null;
    cb && cb();
  }

  function clearTimer() { if (timer) clearTimeout(timer); timer = null; run++; }

  function promptSpeech(q) { return q.readTextEnabled && q.readText ? q.readText : q.text; }
  function hasPromptSound(q) {
    return (q.audioMode === 'file' && q.audio) || (q.audioMode === 'voice' && String(promptSpeech(q) || '').trim());
  }
  /** Natural ElevenLabs voice when it was prepared, otherwise the device voice. */
  async function sayItem(item, fallbackText) {
    if (LL.tts && (await LL.tts.play(item))) return;
    speak(fallbackText, quiz && quiz.config?.lang);
  }
  function playPrompt(q) {
    if (q.audioMode === 'file' && q.audio) playAudio(q.audio);
    else if (q.audioMode === 'voice') sayItem(q, promptSpeech(q));
  }

  function renderProgress() {
    const p = $('#playerProgress');
    p.replaceChildren();
    if (opts.preview) p.append(el('span.preview-banner', 'Vista previa del maestro'));
    if (questions.length <= 20) {
      questions.forEach((_, i) => p.append(el('span.dot' + (i < index ? '.done' : i === index ? '.now' : ''))));
    } else {
      p.append(el('span.progress-text', `${index + 1} / ${questions.length}`));
    }
  }

  function render() {
    clearTimer();
    stopSound();
    answered = false;
    selected = new Set();
    const q = questions[index];
    const b = body();
    b.replaceChildren();
    if (!q) {
      renderProgress();
      b.append(el('div.finish', el('div.stars', '🤔'), el('h1', 'Esta actividad todavía no tiene preguntas.')));
      $('#playerSpeak').disabled = true;
      return;
    }
    renderProgress();

    // Question
    const hasImg = q.image && String(q.image).startsWith('data:image/');
    const qa = el('div.question.enter' + (hasImg ? '.has-image' : ''));
    if (q.text) qa.append(el('div.question-text', q.text));
    if (hasImg) qa.append(el('img.question-image', { src: q.image, alt: 'Imagen de la pregunta' }));
    if (!q.text && !hasImg && q.emoji) qa.append(el('div.question-text', q.emoji));
    b.append(qa);

    const speakBtn = $('#playerSpeak');
    speakBtn.disabled = !hasPromptSound(q);
    speakBtn.onclick = () => playPrompt(q);

    // Answers
    let list = (q.options || []).map((o, i) => ({ ...o, _i: i }));
    if (quiz.config?.answerOrder === 'random') list = shuffle(list);
    const n = list.length;
    const grid = el('div.options.enter');
    if (n === 5) grid.classList.add('five');
    if (n === 2) grid.classList.add('two');
    grid.style.setProperty('--cols', String(n <= 4 ? n : 3));
    grid.style.setProperty('--rows', String(n <= 4 ? 1 : 2));
    grid.style.setProperty('--rows-portrait', String(Math.ceil(n / 2)));
    const correctNeeded = Math.max(1, q.options.filter((o) => o.correct).length || Number(q.correctCount) || 1);

    list.forEach((o, i) => {
      const img = o.image && String(o.image).startsWith('data:image/');
      const btn = el('button.option' + (img ? '.has-image' : ''), { type: 'button', dataset: { index: String(o._i) }, 'aria-label': o.text || 'Respuesta ' + (i + 1) });
      btn.style.setProperty('--pastel', PASTELS[i % PASTELS.length]);
      btn.style.setProperty('--i', String(i));
      if (img) btn.append(el('img', { src: o.image, alt: o.text || '' }));
      if (o.text) btn.append(el('span.label', o.text));
      if ((o.audioMode === 'file' && o.audio) || (o.audioMode === 'voice' && (o.text || o.readText))) {
        const s = el('span.icon-btn.answer-sound', { role: 'button', tabindex: '0', 'aria-label': 'Escuchar esta respuesta' }, '🔊');
        const play = (e) => {
          e.preventDefault(); e.stopPropagation();
          if (answered) return;
          if (o.audioMode === 'file' && o.audio) playAudio(o.audio);
          else sayItem(o, o.readTextEnabled && o.readText ? o.readText : o.text);
        };
        s.addEventListener('click', play);
        s.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') play(e); });
        btn.append(s);
      }
      btn.addEventListener('click', () => choose(o._i, btn, q, grid, correctNeeded));
      grid.append(btn);
    });
    b.append(grid);
    setTimeout(() => { qa.classList.remove('enter'); grid.classList.remove('enter'); }, 120 + n * 70 + 450);
    requestAnimationFrame(() => { fitLabels(grid); requestAnimationFrame(() => fitLabels(grid)); });

    if (LL.tts) LL.tts.prefetch([q, ...(q.options || [])]);
    // Read the question aloud automatically (needs a tap first, which the child just did).
    const myRun = run;
    timer = setTimeout(() => { if (myRun === run && !root().hidden) playPrompt(q); }, 250);
  }

  /** Shrink only the answer texts that don't fit their box. */
  function fitLabels(grid) {
    grid.querySelectorAll('.option .label').forEach((tx) => {
      tx.style.fontSize = '';
      const box = tx.parentElement;
      let size = parseFloat(getComputedStyle(tx).fontSize) || 32;
      let guard = 0;
      while (size > 12 && guard++ < 120 && (tx.scrollWidth > box.clientWidth - 8 || box.scrollHeight > box.clientHeight + 1)) {
        size -= 2; tx.style.fontSize = size + 'px';
      }
    });
  }

  function choose(i, btn, q, grid, correctNeeded) {
    if (answered) return;
    if (selected.has(i)) return;
    selected.add(i);
    btn.classList.add('selected');
    if (selected.size < correctNeeded) return;

    answered = true;
    clearTimer();
    stopSound();
    const myRun = run;
    const buttons = [...grid.querySelectorAll('.option')];
    buttons.forEach((b) => { b.disabled = true; });
    const chosen = buttons.filter((b) => selected.has(Number(b.dataset.index)));
    const correctIdx = q.options.map((o, k) => (o.correct ? k : -1)).filter((k) => k >= 0);
    const isCorrect = selected.size === correctIdx.length && [...selected].every((k) => q.options[k] && q.options[k].correct);
    const flash = (b, good) => { b.classList.remove('selected'); b.classList.add(good ? 'flash-correct' : 'flash-incorrect'); };

    if (isCorrect) {
      feedbackTone(true);
      chosen.forEach((b) => flash(b, true));
      const r = chosen[0].getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2);
      next(2000, myRun);
      return;
    }
    feedbackTone(false);
    chosen.forEach((b) => flash(b, !!q.options[Number(b.dataset.index)].correct));
    if (quiz.config?.mode === 'assessment') { next(2000, myRun); return; }
    timer = setTimeout(() => {
      if (myRun !== run || root().hidden) return;
      buttons.filter((b) => q.options[Number(b.dataset.index)].correct).forEach((b) => { b.classList.remove('flash-correct', 'flash-incorrect'); void b.offsetWidth; flash(b, true); });
      next(2000, myRun);
    }, 2000);
  }

  function next(ms, myRun) {
    timer = setTimeout(() => {
      if (myRun !== run || root().hidden) return;
      if (index < questions.length - 1) { index++; render(); } else finish();
    }, ms);
  }

  function finish() {
    clearTimer();
    index = questions.length;
    renderProgress();
    $('#playerSpeak').disabled = true;
    feedbackTone(true);
    setTimeout(() => confetti(null, innerHeight * 0.35, 40), 150);
    const who = LL.app.state.student;
    body().replaceChildren(el('div.finish',
      el('div.stars', '⭐🌟⭐'),
      el('h1', who ? `¡Muy bien, ${who.name}!` : '¡Muy bien!'),
      el('p.lead', 'Terminaste «' + quiz.name + '».'),
      el('div', { style: { display: 'flex', gap: '12px', flexWrap: 'wrap', justifyContent: 'center' } },
        el('button.btn.ghost.big', { type: 'button', onclick: () => { index = 0; render(); } }, '🔁 Otra vez'),
        el('button.btn.primary.big', { type: 'button', onclick: close }, opts.preview ? 'Cerrar vista previa' : '📚 Mis actividades')),
    ));
  }

  // Wire fixed controls once.
  document.addEventListener('DOMContentLoaded', () => {
    $('#playerExit').addEventListener('click', close);
    document.addEventListener('keydown', (e) => {
      if (root().hidden) return;
      if (e.key === 'Escape') { close(); return; }
      if (!opts.preview) return; // arrow-key navigation is for the teacher's preview only
      if (['ArrowRight', 'ArrowDown'].includes(e.key) && index < questions.length - 1) { e.preventDefault(); index++; render(); }
      if (['ArrowLeft', 'ArrowUp'].includes(e.key) && index > 0) { e.preventDefault(); index--; render(); }
    });
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { const g = $('#playerBody .options'); if (g && !root().hidden) fitLabels(g); }, 120);
    });
  });

  LL.player = { open, close, isOpen: () => !root().hidden };
})();

  <script>
/* js/library.js */
/* Activity library. One library, two views:
 *  - Teacher: everything, plus tools to create, edit, move, duplicate and delete.
 *  - Student: only quizzes marked "Visible" that have questions; folders with nothing
 *    ready are hidden; tapping a quiz opens it straight away; nothing can be changed.
 */
window.LL = window.LL || {};
(function () {
  const { el, $, toast, dialog, confirmDialog, download } = LL.ui;
  const S = LL.store;
  let currentFolder = null;

  const isStudent = () => LL.app.state.mode === 'student';

  function setFolder(id) { currentFolder = id || null; render(); }
  function resetToRoot() { currentFolder = null; }

  function render() {
    const student = isStudent();
    const folders = S.folders();
    const all = S.quizzes();
    const entries = student ? all.filter(S.isReady) : all;
    if (currentFolder && !folders.some((f) => f.id === currentFolder)) currentFolder = null;

    renderCrumbs(folders);

    const grid = $('#cardGrid');
    grid.replaceChildren();
    const here = (x) => (x || null) === currentFolder;

    const subFolders = folders
      .filter((f) => here(f.parentId) && (!student || S.folderHas(f.id, folders, entries)))
      .sort(S.byName);
    const items = entries.filter((t) => here(t.folderId));

    if (currentFolder) grid.append(upCard(folders));
    for (const f of subFolders) grid.append(folderCard(f, folders, entries, student));
    for (const t of items) grid.append(quizCard(t, student));

    // The original "Sonidos iniciales" activity, when the teacher turns it on for students.
    const son = S.sonidos();
    if (!currentFolder && (!student || son.showToStudents)) grid.append(sonidosCard(son, student));

    LL.ui.stagger(grid);
    const empty = $('#libraryEmpty');
    const nothing = !subFolders.length && !items.length;
    empty.hidden = !nothing;
    if (nothing) {
      empty.replaceChildren(
        el('div.big-emoji', student ? '🌱' : '📂'),
        el('div', student ? 'Todavía no hay actividades aquí.' : currentFolder ? 'Esta carpeta está vacía.' : 'Todavía no tienes quizzes.'),
        student ? null : el('div.muted.small', 'Usa «＋ Nuevo quiz» o «📁 Nueva carpeta» para agregar algo aquí.'),
      );
    }
  }

  function renderCrumbs(folders) {
    const c = $('#crumbs');
    c.replaceChildren();
    const trail = S.folderTrail(currentFolder);
    if (currentFolder) {
      const parent = trail.length > 1 ? trail[trail.length - 2].id : null;
      c.append(el('button.icon-btn.back-btn' + (isStudent() ? '.big' : ''), { type: 'button', 'aria-label': 'Volver a la carpeta anterior', onclick: () => setFolder(parent) }, '⬅️'));
    }
    const rootLabel = isStudent() ? '📚 Actividades' : '📚 Mis actividades';
    if (!trail.length) { c.append(el('span.here', rootLabel)); return; }
    c.append(el('button', { type: 'button', onclick: () => setFolder(null) }, rootLabel));
    trail.forEach((f, i) => {
      c.append(el('span.sep', '›'));
      if (i === trail.length - 1) c.append(el('span.here', f.name));
      else c.append(el('button', { type: 'button', onclick: () => setFolder(f.id) }, f.name));
    });
  }

  function upCard(folders) {
    const f = folders.find((x) => x.id === currentFolder);
    return el('div.card.up',
      el('button.card-main', { type: 'button', onclick: () => setFolder(f ? f.parentId : null), 'aria-label': 'Carpeta anterior' },
        el('span.folder-icon', '⬆️'),
        el('span.name', 'Carpeta anterior'),
        el('span.meta', 'Volver a la carpeta superior')));
  }

  function folderCard(f, folders, entries, student) {
    const subCount = folders.filter((x) => x.parentId === f.id && (!student || S.folderHas(x.id, folders, entries))).length;
    const actCount = entries.filter((t) => t.folderId === f.id).length;
    const meta = [subCount ? subCount + (subCount === 1 ? ' carpeta' : ' carpetas') : '', actCount + (actCount === 1 ? ' actividad' : ' actividades')].filter(Boolean).join(' · ');
    const card = el('div.card.folder',
      el('button.card-main', { type: 'button', onclick: (e) => { const c = e.currentTarget.closest('.card'); c.classList.add('opening'); setTimeout(() => setFolder(f.id), 180); } },
        el('span.folder-icon', '📁'),
        el('span.name', f.name),
        el('span.meta', meta)));
    card.style.setProperty('--folder', f.color || '#F8EDB8');
    if (!student) {
      card.append(el('div.card-tools',
        el('button.btn.sm.ghost', { type: 'button', onclick: () => editFolder(f) }, '✏️ Editar'),
        el('button.icon-btn', { type: 'button', 'aria-label': 'Más opciones de la carpeta', onclick: (e) => folderMenu(e, f) }, '⋯')));
      card.addEventListener('contextmenu', (e) => { e.preventDefault(); folderMenu(e, f); });
    }
    return card;
  }

  function quizCard(t, student) {
    const cover = t.config?.coverImage || '';
    const n = t.config?.questions?.length || 0;
    const main = el('button.card-main', { type: 'button', onclick: () => play(t) },
      cover.startsWith('data:image/') ? el('img.cover', { src: cover, alt: '' }) : el('span.cover-placeholder', { 'aria-hidden': 'true' }, '❓'),
      el('span.name', t.name),
      el('span.meta', 'Quiz · ' + n + (n === 1 ? ' pregunta' : ' preguntas')));
    const card = el('div.card.quiz', { dataset: { quizId: t.id } }, main);
    if (!student) {
      const ready = S.isReady(t);
      main.append(el('span.badge.' + (ready ? 'visible' : 'hidden'), ready ? '👀 Visible para estudiantes' : '🛠️ En preparación'));
      card.append(el('div.card-tools',
        el('button.btn.sm.soft', { type: 'button', onclick: () => LL.editor.open(t.id) }, '✏️ Editar'),
        el('button.icon-btn', { type: 'button', 'aria-label': 'Más opciones del quiz', onclick: (e) => quizMenu(e, t) }, '⋯')));
      card.addEventListener('contextmenu', (e) => { e.preventDefault(); quizMenu(e, t); });
    }
    return card;
  }

  function sonidosCard(son, student) {
    const main = el('button.card-main', { type: 'button', onclick: () => LL.app.openSonidos() },
      el('span.cover-placeholder', { style: { background: '#FFE7EC' }, 'aria-hidden': 'true' }, '🔤'),
      el('span.name', 'Sonidos iniciales'),
      el('span.meta', 'Arrastra cada dibujo a su letra · ' + son.letters.join(', ')));
    if (!student) main.append(el('span.badge.' + (son.showToStudents ? 'visible' : 'hidden'), son.showToStudents ? '👀 Visible para estudiantes' : '🛠️ Solo para el maestro'));
    const card = el('div.card.quiz', main);
    if (!student) card.append(el('div.card-tools', el('button.btn.sm.soft', { type: 'button', onclick: () => LL.app.go('sonidos-admin') }, '⚙️ Configurar')));
    return card;
  }

  function play(t) {
    if (isStudent()) LL.player.open(t, { onClose: render });
    else LL.player.open(t, { preview: true, onClose: render });
  }

  /* ---------- Teacher menus ---------- */
  function popMenu(e, items) {
    document.querySelectorAll('.menu').forEach((m) => m.remove());
    const menu = el('div.menu', { role: 'menu' });
    for (const it of items) {
      menu.append(el('button' + (it.danger ? '.danger' : ''), { type: 'button', role: 'menuitem', onclick: () => { menu.remove(); it.run(); } }, it.label));
    }
    document.body.append(menu);
    const r = menu.getBoundingClientRect();
    const x = e.clientX || (e.target.getBoundingClientRect().left), y = e.clientY || (e.target.getBoundingClientRect().bottom);
    menu.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
    menu.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
    setTimeout(() => {
      const off = (ev) => { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('pointerdown', off); } };
      document.addEventListener('pointerdown', off);
    }, 0);
    const opener = document.activeElement;
    menu.addEventListener('keydown', (ev) => {
      const items = [...menu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
      if (ev.key === 'ArrowDown') { ev.preventDefault(); items[(i + 1) % items.length].focus(); }
      if (ev.key === 'ArrowUp') { ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      if (ev.key === 'Escape' || ev.key === 'Tab') { ev.preventDefault(); menu.remove(); opener && opener.focus(); }
    });
    menu.firstChild && menu.firstChild.focus();
  }

  function quizMenu(e, t) {
    popMenu(e, [
      { label: '▶️ Probar como estudiante', run: () => play(t) },
      { label: '✏️ Editar', run: () => LL.editor.open(t.id) },
      { label: '📂 Mover a otra carpeta', run: () => moveDialog(t) },
      { label: '📄 Duplicar', run: () => { const id = S.duplicateQuiz(t.id); if (id) { toast('Copia creada (queda «En preparación»).', 'success'); render(); } } },
      { label: '🗑️ Eliminar', danger: true, run: async () => {
        if (await confirmDialog('¿Eliminar este quiz?', '«' + t.name + '» se borrará de este navegador. Esto no se puede deshacer. (Consejo: haz un respaldo antes.)', 'Eliminar', true)) {
          S.deleteQuiz(t.id); toast('Quiz eliminado.'); render();
        }
      } },
    ]);
  }

  function folderMenu(e, f) {
    popMenu(e, [
      { label: '📂 Abrir', run: () => setFolder(f.id) },
      { label: '✏️ Cambiar nombre o color', run: () => editFolder(f) },
      { label: '📂 Mover a otra carpeta', run: () => moveFolderDialog(f) },
      { label: '📤 Compartir (descargar archivo)', run: () => {
        download('little-learners-' + slug(f.name) + '.json', JSON.stringify(S.exportBackup(f.id)));
        toast('Archivo descargado. Otro maestro puede abrirlo en «Respaldo» → «Importar».', 'success');
      } },
      { label: '🗑️ Eliminar carpeta', danger: true, run: async () => {
        if (await confirmDialog('¿Eliminar la carpeta «' + f.name + '»?', 'Lo que haya dentro no se borra: se moverá a la carpeta superior.', 'Eliminar carpeta', true)) {
          S.deleteFolder(f.id); toast('Carpeta eliminada.'); render();
        }
      } },
    ]);
  }

  const slug = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'carpeta';

  function folderOptions(excludeId) {
    const sel = el('select');
    sel.append(new Option('📚 Mis actividades (sin carpeta)', ''));
    const all = S.folders();
    const isInside = (id) => { let p = id; while (p) { if (p === excludeId) return true; p = (all.find((x) => x.id === p) || {}).parentId; } return false; };
    all.filter((f) => !excludeId || !isInside(f.id))
      .map((f) => ({ f, label: S.folderPathLabel(f) }))
      .sort((a, b) => a.label.localeCompare(b.label, 'es', { sensitivity: 'base' }))
      .forEach(({ f, label }) => sel.append(new Option('📁 ' + label, f.id)));
    return sel;
  }

  async function moveDialog(t) {
    const sel = folderOptions();
    sel.value = t.folderId || '';
    const ok = await dialog({ title: 'Mover «' + t.name + '»', body: el('label.field', 'Carpeta de destino', sel), actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: 'Mover', kind: 'primary', value: true }] });
    if (ok) { S.moveQuiz(t.id, sel.value || null); toast('Quiz movido.', 'success'); render(); }
  }

  async function moveFolderDialog(f) {
    const sel = folderOptions(f.id);
    sel.value = f.parentId || '';
    const ok = await dialog({ title: 'Mover la carpeta «' + f.name + '»', body: el('label.field', 'Mover dentro de', sel), actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: 'Mover', kind: 'primary', value: true }] });
    if (ok) { if (S.moveFolder(f.id, sel.value || null)) { toast('Carpeta movida.', 'success'); render(); } }
  }

  async function editFolder(f) {
    const isNew = !f;
    let color = f ? f.color : S.FOLDER_COLORS[0][1];
    const name = el('input', { type: 'text', maxlength: '90', placeholder: 'Ej. Español', value: f ? f.name : '' });
    const pal = el('div.palette');
    for (const [label, c] of S.FOLDER_COLORS) {
      const b = el('button.swatch', { type: 'button', 'aria-label': label, title: label, 'aria-pressed': String(c === color), style: { background: c } });
      b.addEventListener('click', () => { color = c; pal.querySelectorAll('.swatch').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); });
      pal.append(b);
    }
    const ok = await dialog({
      title: isNew ? 'Nueva carpeta' : 'Editar carpeta',
      body: el('div', { style: { display: 'grid', gap: '14px' } }, el('label.field', 'Nombre', name), el('div.field', 'Color', pal)),
      actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: isNew ? 'Crear carpeta' : 'Guardar', kind: 'primary', value: () => (name.value.trim() ? true : (name.focus(), undefined)) }],
    });
    if (!ok) return;
    S.saveFolder({ id: f && f.id, name: name.value.trim(), color, parentId: currentFolder });
    toast(isNew ? 'Carpeta creada.' : 'Carpeta guardada.', 'success');
    render();
  }

  document.addEventListener('DOMContentLoaded', () => {
    $('#newFolderBtn').addEventListener('click', () => editFolder(null));
    $('#newQuizBtn').addEventListener('click', () => LL.editor.open(null, currentFolder));
  });

  LL.library = { render, setFolder, resetToRoot, current: () => currentFolder };
})();

  <script>
/* js/editor.js */
/* Quiz editor (teacher). One page: settings on the left, questions in the middle.
 * Saves in the same format as V121. Unsaved work is also kept as a draft so it can
 * be recovered if the page is closed by accident. */
window.LL = window.LL || {};
(function () {
  const { el, $, toast, dialog, confirmDialog, imageFileToDataURL, audioFileToDataURL, pickFile, speak, playAudio, stopSound } = LL.ui;
  const S = LL.store;
  // Dark enough for white letters (WCAG AA contrast).
  const LETTER_COLORS = ['#B83250', '#B5531A', '#8A6A00', '#2C7A47', '#1D7268', '#2F5BD3'];

  let quiz = null, snapshot = '', qIndex = 0;

  const root = () => $('#screen-editor');
  const isDirty = () => quiz && JSON.stringify(quiz) !== snapshot;

  async function open(id, folderId) {
    if (id) {
      const q = S.getQuiz(id);
      if (!q) { toast('No se encontró ese quiz.', 'error'); return; }
      quiz = { id: q.id, name: q.name, folderId: q.folderId || null, config: S.clone(q.config) };
      if (!Array.isArray(quiz.config.questions)) quiz.config.questions = [];
      quiz.config = { lang: 'es', mode: 'practice', questionOrder: 'fixed', answerOrder: 'fixed', visibility: 'hidden', coverImage: '', ...quiz.config };
    } else {
      quiz = S.newQuiz(folderId);
    }
    snapshot = JSON.stringify(quiz);
    qIndex = 0;

    const draft = S.readDraft();
    if (draft && draft.quizId === (id || 'new') && draft.quiz && JSON.stringify(draft.quiz) !== snapshot) {
      const when = draft.at ? new Date(draft.at).toLocaleString('es-US') : '';
      if (await confirmDialog('¿Recuperar cambios sin guardar?', 'Encontramos cambios de este quiz que no se guardaron' + (when ? ' (' + when + ')' : '') + '. ¿Quieres recuperarlos?', 'Recuperar')) {
        quiz = draft.quiz;
      } else S.clearDraft();
    }
    if (!quiz.config.questions.length) quiz.config.questions.push(S.newQuestion());
    await LL.app.go('editor');
    renderAll();
    if (!id) setTimeout(() => $('#edName') && $('#edName').focus(), 50);
  }

  function changed() {
    if (isDirty()) S.writeDraft({ quizId: quiz.id || 'new', quiz, at: new Date().toISOString() });
    const st = $('#edState');
    if (st) {
      st.textContent = isDirty() ? '● Cambios sin guardar' : '✓ Guardado';
      st.style.color = isDirty() ? '#8A5B08' : '#13753A';
    }
    renderQList();
  }

  /* ---------- Layout ---------- */
  function renderAll() {
    const r = root();
    r.replaceChildren();
    const name = el('input.name-input#edName', { type: 'text', maxlength: '90', placeholder: 'Nombre del quiz (ej. Animales)', value: quiz.name, 'aria-label': 'Nombre del quiz' });
    name.addEventListener('input', () => { quiz.name = name.value; changed(); });

    r.append(el('div.editor-top',
      el('button.btn.ghost', { type: 'button', onclick: () => LL.app.go('library') }, '⬅️ Mis actividades'),
      name,
      el('button.btn.soft', { type: 'button', onclick: preview }, '▶️ Probar'),
      el('button.btn.primary', { type: 'button', onclick: save }, '💾 Guardar')));
    r.append(el('p.small#edState', { style: { margin: '-8px 0 12px', fontWeight: '800' } }));

    const side = el('aside.editor-side', settingsPanel(), el('div.panel', { style: { display: 'grid', gap: '10px' } },
      el('h3#edQCount'),
      el('div.q-list#edQList'),
      el('button.btn.soft#edAddQ', { type: 'button', onclick: addQuestion }, '＋ Nueva pregunta')));
    r.append(el('div.editor-layout', side, el('div.panel.q-editor#edQuestion')));
    renderQuestion();
    changed();
  }

  function settingsPanel() {
    const c = quiz.config;
    const p = el('div.panel.settings-grid');
    p.append(el('h3', '⚙️ Ajustes'));

    const vis = el('input', { type: 'checkbox', checked: c.visibility === 'visible' });
    vis.addEventListener('change', () => { c.visibility = vis.checked ? 'visible' : 'hidden'; changed(); });
    p.append(el('div.field', el('label.switch', vis, 'Visible para estudiantes'), el('span.hint', 'Déjalo apagado mientras lo preparas. Los estudiantes solo ven los quizzes visibles.')));

    const modeHint = el('span.hint');
    const setModeHint = () => { modeHint.textContent = c.mode === 'assessment' ? 'Evaluación: si se equivoca, no se muestra la respuesta correcta.' : 'Práctica: si se equivoca, se le muestra la respuesta correcta.'; };
    setModeHint();
    p.append(el('div.field', 'Modalidad', segmented([['practice', 'Práctica'], ['assessment', 'Evaluación']], c.mode, (v) => { c.mode = v; setModeHint(); changed(); }), modeHint));
    p.append(el('div.field', 'Idioma de la voz', segmented([['es', 'Español'], ['en', 'English']], c.lang, (v) => { c.lang = v; changed(); })));

    const qr = el('input', { type: 'checkbox', checked: c.questionOrder === 'random' });
    qr.addEventListener('change', () => { c.questionOrder = qr.checked ? 'random' : 'fixed'; changed(); });
    const ar = el('input', { type: 'checkbox', checked: c.answerOrder === 'random' });
    ar.addEventListener('change', () => { c.answerOrder = ar.checked ? 'random' : 'fixed'; changed(); });
    p.append(el('div.field', 'Orden', el('label.switch', qr, 'Mezclar preguntas'), el('label.switch', ar, 'Mezclar respuestas')));

    const coverBox = el('div.media-row');
    const drawCover = () => {
      coverBox.replaceChildren();
      if (c.coverImage) coverBox.append(el('img.thumb', { src: c.coverImage, alt: 'Portada' }));
      coverBox.append(el('button.btn.sm.ghost', { type: 'button', onclick: async () => {
        const f = await pickFile('image/*'); if (!f) return;
        try { c.coverImage = await imageFileToDataURL(f, 480, 0.76); drawCover(); changed(); } catch (e) { toast(e.message, 'error'); }
      } }, c.coverImage ? '🖼️ Cambiar' : '🖼️ Elegir imagen'));
      if (c.coverImage) coverBox.append(el('button.btn.sm.danger-ghost', { type: 'button', onclick: () => { c.coverImage = ''; drawCover(); changed(); } }, 'Quitar'));
    };
    drawCover();
    p.append(el('div.field', 'Imagen de la tarjeta', el('span.hint', 'Opcional. Se ve en la tarjeta de la actividad.'), coverBox));
    return p;
  }

  function segmented(options, value, onChange) {
    const wrap = el('div.segmented', { role: 'group' });
    for (const [v, label] of options) {
      const b = el('button', { type: 'button', 'aria-pressed': String(v === value) }, label);
      b.addEventListener('click', () => { wrap.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); onChange(v); });
      wrap.append(b);
    }
    return wrap;
  }

  function questionLabel(q) {
    return String(q.text || '').trim() || (q.image ? '🖼️ (imagen)' : q.readText ? '🔊 ' + q.readText : q.audio ? '🔊 (audio)' : 'Pregunta sin texto');
  }

  function renderQList() {
    const list = $('#edQList');
    if (!list) return;
    const qs = quiz.config.questions;
    $('#edQCount').textContent = '❓ Preguntas (' + qs.length + ' / 50)';
    $('#edAddQ').disabled = qs.length >= 50;
    list.replaceChildren();
    qs.forEach((q, i) => {
      const bad = !!S.questionProblem(q);
      list.append(el('button.q-item' + (bad ? '.problem' : ''), { type: 'button', 'aria-current': String(i === qIndex), title: bad ? S.questionProblem(q) : '', onclick: () => { qIndex = i; renderQuestion(); renderQList(); } },
        el('span.num', String(i + 1)), el('span.txt', questionLabel(q))));
    });
  }

  /* ---------- One question ---------- */
  function renderQuestion() {
    const box = $('#edQuestion');
    const qs = quiz.config.questions;
    qIndex = Math.max(0, Math.min(qIndex, qs.length - 1));
    const q = qs[qIndex];
    box.replaceChildren();

    const problem = el('div');
    const refreshProblem = () => {
      const msg = S.questionProblem(q);
      problem.className = msg ? 'problem-box' : 'ok-box';
      problem.textContent = msg ? '⚠️ ' + msg : '✓ Pregunta lista';
    };

    box.append(el('div.q-editor-head',
      el('h2', 'Pregunta ' + (qIndex + 1) + ' de ' + qs.length),
      el('div.q-tools',
        el('button.icon-btn', { type: 'button', 'aria-label': 'Mover arriba', title: 'Mover arriba', disabled: qIndex === 0, onclick: () => moveQuestion(-1) }, '⬆️'),
        el('button.icon-btn', { type: 'button', 'aria-label': 'Mover abajo', title: 'Mover abajo', disabled: qIndex === qs.length - 1, onclick: () => moveQuestion(1) }, '⬇️'),
        el('button.btn.sm.ghost', { type: 'button', disabled: qs.length >= 50, onclick: duplicateQuestion }, '📄 Duplicar'),
        el('button.btn.sm.danger-ghost', { type: 'button', onclick: deleteQuestion }, '🗑️ Eliminar'))));
    box.append(problem);

    const onEdit = () => { refreshProblem(); changed(); };

    // Prompt
    const prompt = el('textarea', { rows: '2', placeholder: 'Ej. ¿Cuál es el perro?' });
    prompt.value = q.text || '';
    prompt.addEventListener('input', () => { q.text = prompt.value; onEdit(); });
    box.append(el('label.field', 'Pregunta', el('span.hint', 'Puede quedar vacía si usas una imagen o un audio.'), prompt));

    // Prompt image
    const imgRow = el('div.media-row');
    const drawImg = () => {
      imgRow.replaceChildren();
      if (q.image) imgRow.append(el('img.thumb', { src: q.image, alt: 'Imagen de la pregunta' }));
      imgRow.append(el('button.btn.sm.ghost', { type: 'button', onclick: async () => {
        const f = await pickFile('image/*'); if (!f) return;
        try { q.image = await imageFileToDataURL(f, 1200, 0.82); drawImg(); onEdit(); } catch (e) { toast(e.message, 'error'); }
      } }, q.image ? '🖼️ Cambiar imagen' : '🖼️ Agregar imagen'));
      if (q.image) imgRow.append(el('button.btn.sm.danger-ghost', { type: 'button', onclick: () => { q.image = ''; drawImg(); onEdit(); } }, 'Quitar'));
    };
    drawImg();
    box.append(el('div.field', 'Imagen (opcional)', imgRow));

    // Prompt sound
    box.append(soundEditor(q, 'pregunta', onEdit, [['none', 'Sin sonido'], ['voice', 'Voz automática'], ['file', 'Archivo de audio']], q.audioMode || 'voice'));

    // Answers
    const correctCount = q.options.filter((o) => o.correct).length;
    box.append(el('div', el('h3', 'Respuestas'), el('p.small.muted', 'Toca «✓ Correcta» en la respuesta buena. Puedes marcar hasta 2 (si hay 3 o más respuestas). Llevas ' + correctCount + ' marcada(s).')));
    const answers = el('div.answers');
    q.options.forEach((o, i) => answers.append(answerEditor(q, o, i, onEdit)));
    box.append(answers);
    const addRow = el('div.media-row');
    if (q.options.length < 6) addRow.append(el('button.btn.soft', { type: 'button', onclick: () => { q.options.push(S.newOption()); renderQuestion(); changed(); } }, '＋ Agregar respuesta'));
    addRow.append(el('span.small.muted', q.options.length + ' de 6 respuestas (mínimo 2)'));
    box.append(addRow);

    refreshProblem();
  }

  function soundEditor(item, what, onEdit, modes, current) {
    const wrap = el('div.field', what === 'pregunta' ? 'Sonido de la pregunta' : 'Sonido');
    const detail = el('div.sub');
    const draw = () => {
      detail.replaceChildren();
      const mode = item.audioMode || current;
      detail.hidden = mode === 'none';
      if (mode === 'voice') {
        const alt = el('input', { type: 'checkbox', checked: !!item.readTextEnabled });
        const altText = el('textarea', { rows: '2', placeholder: 'Lo que debe escuchar el estudiante…' });
        altText.value = item.readText || '';
        altText.hidden = !item.readTextEnabled;
        alt.addEventListener('change', () => { item.readTextEnabled = alt.checked; altText.hidden = !alt.checked; onEdit(); });
        altText.addEventListener('input', () => { item.readText = altText.value; onEdit(); });
        detail.append(
          el('label.check', alt, 'Leer en voz alta un texto diferente'),
          altText,
          el('button.btn.sm.ghost', { type: 'button', style: { justifySelf: 'start' }, onclick: () => {
            const t = item.readTextEnabled && item.readText ? item.readText : item.text;
            if (!String(t || '').trim()) { toast('Escribe primero el texto.', 'error'); return; }
            speak(t, quiz.config.lang);
          } }, '🔊 Escuchar'));
      } else if (mode === 'file') {
        const row = el('div.media-row');
        if (item.audio) row.append(el('audio', { controls: true, src: item.audio, preload: 'metadata', style: { maxWidth: '100%' } }));
        row.append(el('button.btn.sm.ghost', { type: 'button', onclick: async () => {
          const f = await pickFile('audio/*'); if (!f) return;
          try { item.audio = await audioFileToDataURL(f); draw(); onEdit(); } catch (e) { toast(e.message, 'error'); }
        } }, item.audio ? '🎵 Cambiar audio' : '🎵 Elegir archivo de audio'));
        if (item.audio) row.append(el('button.btn.sm.danger-ghost', { type: 'button', onclick: () => { stopSound(); item.audio = ''; draw(); onEdit(); } }, 'Quitar'));
        detail.append(row);
      }
    };
    wrap.append(segmented(modes, item.audioMode || current, (v) => { item.audioMode = v; draw(); onEdit(); }), detail);
    draw();
    return wrap;
  }

  function answerEditor(q, o, i, onEdit) {
    const letter = String.fromCharCode(65 + i);
    const card = el('div.answer' + (o.correct ? '.is-correct' : ''));
    const toggle = el('button.correct-toggle', { type: 'button', 'aria-pressed': String(!!o.correct) }, o.correct ? '✓ Correcta' : 'Marcar correcta');
    toggle.addEventListener('click', () => {
      if (!o.correct) {
        const n = q.options.filter((x) => x.correct).length;
        const max = q.options.length === 2 ? 1 : 2;
        if (n >= max) {
          if (max === 1) q.options.forEach((x) => { x.correct = false; });
          else { toast('Puedes marcar como máximo 2 respuestas correctas.', 'error'); return; }
        }
      }
      o.correct = !o.correct;
      renderQuestion(); changed();
    });
    const remove = el('button.icon-btn', { type: 'button', 'aria-label': 'Quitar respuesta ' + letter, title: 'Quitar respuesta', disabled: q.options.length <= 2, onclick: () => { q.options.splice(i, 1); renderQuestion(); changed(); } }, '✕');
    card.append(el('div.answer-head', el('span.answer-letter', { style: { background: LETTER_COLORS[i % 6] } }, letter), toggle, remove));

    const text = el('input', { type: 'text', placeholder: 'Texto o emoji (ej. 🐶)', value: o.text || '', 'aria-label': 'Texto de la respuesta ' + letter });
    text.addEventListener('input', () => { o.text = text.value; onEdit(); });
    card.append(text);

    const imgRow = el('div.media-row');
    const drawImg = () => {
      imgRow.replaceChildren();
      if (o.image) imgRow.append(el('img.thumb', { src: o.image, alt: '' }));
      imgRow.append(el('button.btn.sm.ghost', { type: 'button', onclick: async () => {
        const f = await pickFile('image/*'); if (!f) return;
        try { o.image = await imageFileToDataURL(f, 600, 0.82); drawImg(); onEdit(); } catch (e) { toast(e.message, 'error'); }
      } }, o.image ? '🖼️ Cambiar' : '🖼️ Imagen'));
      if (o.image) imgRow.append(el('button.btn.sm.danger-ghost', { type: 'button', onclick: () => { o.image = ''; drawImg(); onEdit(); } }, 'Quitar'));
    };
    drawImg();
    card.append(imgRow);
    card.append(soundEditor(o, 'respuesta', onEdit, [['none', 'Sin sonido'], ['voice', 'Voz'], ['file', 'Archivo']], o.audioMode || 'none'));
    return card;
  }

  /* ---------- Question actions ---------- */
  function addQuestion() {
    const qs = quiz.config.questions;
    if (qs.length >= 50) return;
    // New questions copy the sound setting and answer count of the current one.
    const cur = qs[qIndex];
    const nq = S.newQuestion(cur ? cur.options.length : 4);
    if (cur) nq.audioMode = cur.audioMode || 'voice';
    qs.splice(qIndex + 1, 0, nq);
    qIndex++;
    renderQuestion(); changed();
    const t = $('#edQuestion textarea'); t && t.focus();
  }
  function duplicateQuestion() {
    const qs = quiz.config.questions;
    const copy = S.clone(qs[qIndex]);
    copy.id = S.uid('quiz');
    copy.options.forEach((o) => { o.id = S.uid('quiz'); });
    qs.splice(qIndex + 1, 0, copy);
    qIndex++;
    renderQuestion(); changed();
  }
  async function deleteQuestion() {
    const qs = quiz.config.questions;
    if (!(await confirmDialog('¿Eliminar la pregunta ' + (qIndex + 1) + '?', 'Se quitará de este quiz cuando pulses «Guardar».', 'Eliminar', true))) return;
    qs.splice(qIndex, 1);
    if (!qs.length) qs.push(S.newQuestion());
    qIndex = Math.min(qIndex, qs.length - 1);
    renderQuestion(); changed();
  }
  function moveQuestion(d) {
    const qs = quiz.config.questions, j = qIndex + d;
    if (j < 0 || j >= qs.length) return;
    [qs[qIndex], qs[j]] = [qs[j], qs[qIndex]];
    qIndex = j;
    renderQuestion(); changed();
  }

  /* ---------- Save / preview / leave ---------- */
  function save() {
    quiz.name = (quiz.name || '').trim();
    if (!quiz.name) { toast('Escribe un nombre para el quiz.', 'error'); $('#edName').focus(); return false; }
    // A question that was never touched is simply dropped.
    const blank = (q) => !String(q.text || '').trim() && !q.image && !q.audio && !String(q.readText || '').trim() && q.options.every((o) => !String(o.text || '').trim() && !o.image && !o.audio && !o.correct);
    const qs = quiz.config.questions;
    if (qs.length > 1) quiz.config.questions = qs.filter((q) => !blank(q));
    if (!quiz.config.questions.length) quiz.config.questions = [S.newQuestion()];
    quiz.config.questions.forEach((q) => { q.correctCount = Math.max(1, q.options.filter((o) => o.correct).length); });

    const problems = quiz.config.questions.map((q, i) => ({ i, msg: S.questionProblem(q) })).filter((p) => p.msg);
    if (problems.length && quiz.config.visibility === 'visible') {
      qIndex = problems[0].i;
      renderAll();
      toast('Para que los estudiantes lo vean, completa la pregunta ' + (problems[0].i + 1) + ': ' + problems[0].msg, 'error');
      return false;
    }
    const id = S.saveQuiz(quiz);
    if (!id) return false;
    quiz.id = id;
    snapshot = JSON.stringify(quiz);
    S.clearDraft();
    renderAll();
    if (problems.length) toast('Guardado como «En preparación». Faltan ' + problems.length + ' pregunta(s) por completar.', 'success');
    else toast(quiz.config.visibility === 'visible' ? '✓ Guardado. Los estudiantes ya pueden verlo.' : '✓ Guardado (en preparación).', 'success');
    prepareVoices(id);
    return true;
  }

  /** Copy ElevenLabs file info from `source` into `target`, matching questions/answers by id and text. */
  function applyTts(target, source) {
    const map = new Map();
    for (const q of source.questions || []) for (const it of [q, ...(q.options || [])]) if (it.tts) map.set(it.id, it.tts);
    for (const q of target.questions || []) for (const it of [q, ...(q.options || [])]) {
      const t = map.get(it.id);
      if (t && LL.tts.speechText(it) === t.text) it.tts = t;
    }
  }

  /** After saving: make natural-voice audio for new or changed text (runs in the background). */
  async function prepareVoices(id) {
    if (!LL.tts || !LL.tts.active()) return;
    const stored = S.getQuiz(id);
    if (!stored) return;
    const work = { ...stored, config: S.clone(stored.config) };
    const st = () => (quiz && quiz.id === id ? $('#edState') : null);
    const r = await LL.tts.prepareQuiz(work, (i, n) => { const s = st(); if (s) s.textContent = '🗣️ Preparando voces naturales… ' + i + ' de ' + n; });
    if (r.made) {
      const latest = S.getQuiz(id);
      if (latest) { applyTts(latest.config, work.config); S.saveQuiz({ id, name: latest.name, folderId: latest.folderId, config: latest.config }); }
      if (quiz && quiz.id === id) { const wasClean = !isDirty(); applyTts(quiz.config, work.config); if (wasClean) snapshot = JSON.stringify(quiz); }
      toast('🗣️ Voz natural lista para ' + r.made + (r.made === 1 ? ' texto.' : ' textos.'), 'success');
    }
    if (quiz && quiz.id === id) changed();
  }

  function preview() {
    LL.player.open({ name: quiz.name || 'Vista previa', config: S.clone(quiz.config) }, { preview: true, startIndex: qIndex, onClose: () => {} });
  }

  async function canLeave() {
    if (!isDirty()) return true;
    const v = await dialog({
      title: '¿Guardar los cambios?',
      body: 'Este quiz tiene cambios sin guardar.',
      actions: [{ label: 'Seguir editando', kind: 'ghost', value: 'stay' }, { label: 'Salir sin guardar', kind: 'danger-ghost', value: 'discard' }, { label: 'Guardar y salir', kind: 'primary', value: 'save' }],
    });
    if (v === 'save') return save();
    if (v === 'discard') { S.clearDraft(); quiz = null; snapshot = ''; return true; }
    return false;
  }

  window.addEventListener('beforeunload', (e) => {
    if (LL.app && LL.app.state.screen === 'editor' && isDirty()) { e.preventDefault(); e.returnValue = ''; }
  });

  LL.editor = { open, canLeave };
})();

</script>
  <script>
/* js/teacher.js */
/* Teacher tools: students, backup / sharing, and Sonidos iniciales settings. */
window.LL = window.LL || {};
(function () {
  const { el, $, toast, dialog, confirmDialog, pickFile, download, formatBytes } = LL.ui;
  const S = LL.store;

  /* ---------- Students ---------- */
  function animalPicker(selected, onPick) {
    const grid = el('div.animal-pick');
    for (const a of S.ANIMALS) {
      const b = el('button', { type: 'button', 'aria-pressed': String(a === selected), 'aria-label': a }, a);
      b.addEventListener('click', () => { grid.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); onPick(a); });
      grid.append(b);
    }
    return grid;
  }

  async function studentDialog(existing) {
    let animal = existing ? existing.animal : S.ANIMALS[0];
    const name = el('input', { type: 'text', maxlength: '22', placeholder: 'Nombre', value: existing ? existing.name : '' });
    const ok = await dialog({
      title: existing ? 'Editar estudiante' : 'Agregar estudiante',
      body: el('div', { style: { display: 'grid', gap: '14px' } }, el('label.field', 'Nombre', name), el('div.field', 'Animalito', animalPicker(animal, (a) => { animal = a; }))),
      actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: existing ? 'Guardar' : 'Agregar', kind: 'primary', value: () => (name.value.trim() ? true : (name.focus(), undefined)) }],
    });
    return ok ? { name: name.value.trim(), animal } : null;
  }

  function renderRoster() {
    const page = $('#screen-students-admin');
    const r = S.roster();
    const list = el('div.roster-list');
    r.forEach((s, i) => {
      list.append(el('div.roster-row',
        el('span.animal', s.animal), el('span.nm', s.name),
        el('button.icon-btn', { type: 'button', 'aria-label': 'Subir', disabled: i === 0, onclick: () => { [r[i - 1], r[i]] = [r[i], r[i - 1]]; S.saveRoster(r); renderRoster(); } }, '⬆️'),
        el('button.btn.sm.ghost', { type: 'button', onclick: async () => {
          const v = await studentDialog(s); if (!v) return;
          if (r.some((x, k) => k !== i && x.name.toLowerCase() === v.name.toLowerCase())) { toast('Ya hay un estudiante con ese nombre.', 'error'); return; }
          r[i] = v; S.saveRoster(r); renderRoster();
        } }, '✏️ Editar'),
        el('button.btn.sm.danger-ghost', { type: 'button', onclick: async () => {
          if (!(await confirmDialog('¿Quitar a ' + s.name + '?', 'Ya no aparecerá en «¿Quién eres?».', 'Quitar', true))) return;
          r.splice(i, 1); S.saveRoster(r); renderRoster();
        } }, 'Quitar')));
    });
    page.replaceChildren(el('div.tool-page',
      el('div', el('h1', '👧 Estudiantes'), el('p.lead', 'Ellos aparecen en la pantalla «¿Quién eres?».')),
      el('div.panel', { style: { display: 'grid', gap: '12px' } },
        r.length ? list : el('p.muted', 'Todavía no hay estudiantes.'),
        el('button.btn.primary', { type: 'button', style: { justifySelf: 'start' }, onclick: async () => {
          const v = await studentDialog(null); if (!v) return;
          if (r.some((x) => x.name.toLowerCase() === v.name.toLowerCase())) { toast('Ya hay un estudiante con ese nombre.', 'error'); return; }
          r.push(v); S.saveRoster(r); renderRoster(); toast(v.name + ' agregado.', 'success');
        } }, '＋ Agregar estudiante')),
      el('p.small.muted', 'Usa solo el primer nombre o un apodo. La lista se guarda solo en este navegador.')));
  }

  /* ---------- Backup ---------- */
  const box = (...kids) => el('div.panel', { style: { display: 'grid', gap: '12px' } }, ...kids);

  function accountPanel() {
    if (!LL.cloud.enabled()) return null;
    if (!LL.cloud.signedIn()) {
      return box(el('h2', '👤 Cuenta'),
        el('p', 'Estás usando Little Learners sin cuenta: todo se guarda solo en este navegador.'),
        el('p.small.muted', 'Con una cuenta, tus quizzes se guardan en la nube y aparecen en todas tus tabletas.'),
        el('button.btn.primary', { type: 'button', style: { justifySelf: 'start' }, onclick: () => { LL.auth.setLocalMode(false); LL.app.goHome(); } }, 'Iniciar sesión'));
    }
    const u = LL.cloud.user() || {};
    const line = el('p.small');
    const draw = (st) => {
      line.textContent = st.busy || st.pending ? '🔄 Guardando en la nube…'
        : st.error === 'offline' ? '📴 Sin internet. Los cambios se subirán al volver la conexión.'
        : st.error ? '⚠️ No se pudo sincronizar: ' + st.error
        : st.lastOk ? '☁️ Todo guardado en la nube · ' + new Date(st.lastOk).toLocaleString('es-US', { dateStyle: 'short', timeStyle: 'short' }) : '☁️ Conectado';
    };
    draw(LL.sync.status());
    const off = LL.sync.onChange((st) => { if (!line.isConnected) { off(); return; } draw(st); });
    return box(el('h2', '👤 Cuenta'),
      el('p', 'Sesión iniciada como ', el('strong', u.email || '')),
      line,
      el('div.media-row',
        el('button.btn.soft', { type: 'button', onclick: async () => { const ok = await LL.sync.run(); toast(ok ? '✓ Sincronizado.' : 'No se pudo sincronizar ahora.', ok ? 'success' : 'error'); } }, '🔄 Sincronizar ahora'),
        el('button.btn.ghost', { type: 'button', onclick: () => LL.auth.signOut() }, 'Cerrar sesión')),
      el('p.small.muted', 'En cada tableta: abre la página, entra una vez con tu cuenta y la tableta queda lista. Los niños solo tocan su animalito.'));
  }

  function pinPanel() {
    const has = !!S.pinHash();
    return box(el('h2', '🔒 PIN del maestro'),
      el('p', has ? 'Hay un PIN. Se pide al mantener presionado «Maestro».' : 'Para tabletas compartidas: además de mantener presionado «Maestro», pide un PIN de números.'),
      el('div.media-row',
        el('button.btn.soft', { type: 'button', onclick: async () => { await LL.auth.setPinFlow(); renderBackup(); } }, has ? 'Cambiar PIN' : 'Crear PIN'),
        has ? el('button.btn.danger-ghost', { type: 'button', onclick: async () => { if (await confirmDialog('¿Quitar el PIN?', 'Cualquiera que mantenga presionado «Maestro» podrá entrar.', 'Quitar PIN', true)) { S.savePinHash(null); renderBackup(); } } }, 'Quitar PIN') : null),
      el('p.small.muted', 'El PIN se guarda cifrado' + (LL.cloud.signedIn() ? ' y se usa en todos tus dispositivos.' : '.')));
  }

  function voicePanel() {
    if (!LL.cloud.signedIn()) return null;
    const v = S.voice();
    const on = el('input', { type: 'checkbox', checked: v.enabled });
    on.addEventListener('change', () => { S.saveVoice({ ...S.voice(), enabled: on.checked }); renderBackup(); });
    const sel = el('select', { 'aria-label': 'Voz', disabled: !v.enabled });
    sel.append(new Option('Cargando voces…', v.voiceId || ''));
    const usage = el('div', { style: { display: 'grid', gap: '6px' } });
    const panel = box(el('h2', '🗣️ Voz natural (ElevenLabs)'),
      el('label.switch', on, 'Usar voz natural en los quizzes'),
      el('p.small.muted', 'Al guardar un quiz, cada texto con «Voz automática» se convierte una vez en audio natural. Si no hay internet o se acaban los créditos, se usa la voz del dispositivo.'),
      el('label.field', 'Voz', sel),
      el('div.media-row',
        el('button.btn.ghost', { type: 'button', disabled: !v.enabled, onclick: testVoice }, '🔊 Probar voz'),
        el('button.btn.soft', { type: 'button', disabled: !v.enabled, onclick: prepareAll }, '🗣️ Preparar voces de todos los quizzes')),
      usage,
      el('p.small.muted', 'Voces creadas con ElevenLabs (elevenlabs.io). Con el plan gratuito: solo uso no comercial y se debe mencionar a ElevenLabs.'));
    if (v.enabled) {
      LL.tts.voices().then((r) => {
        sel.replaceChildren();
        if (!r || !r.voices) { sel.append(new Option(r && r.reason === 'no_api_key' ? 'Falta la clave de ElevenLabs en Supabase' : 'No se pudieron cargar las voces', '')); return; }
        const current = v.voiceId || r.defaultVoice;
        r.voices.sort((a, b) => a.name.localeCompare(b.name)).forEach((x) => sel.add(new Option(x.name + (x.gender ? ' · ' + (x.gender === 'female' ? 'mujer' : x.gender === 'male' ? 'hombre' : x.gender) : '') + (x.accent ? ' · ' + x.accent : ''), x.id, false, x.id === current)));
        sel.disabled = false;
      }).catch((e) => { sel.replaceChildren(new Option('Sin conexión', '')); console.warn(e); });
      sel.addEventListener('change', () => { S.saveVoice({ ...S.voice(), voiceId: sel.value }); toast('Voz cambiada. Usa «Preparar voces» para actualizar los quizzes.'); });
      LL.tts.usage().then((u) => {
        if (!u || u.used == null) return;
        const pct = Math.min(100, Math.round((u.used / Math.max(1, u.limit)) * 100));
        usage.replaceChildren(el('div.meter', el('div', { style: { width: pct + '%', background: pct > 85 ? 'var(--bad)' : 'var(--primary)' } })),
          el('p.small.muted', 'Créditos usados este mes: ' + u.used.toLocaleString('es-US') + ' de ' + u.limit.toLocaleString('es-US') + (u.resetsAt ? ' · se renuevan el ' + new Date(u.resetsAt * 1000).toLocaleDateString('es-US') : '')));
      }).catch(() => {});
    }
    return panel;
  }

  async function testVoice() {
    const text = S.voice().voiceId ? '¡Hola! Vamos a aprender juntos.' : '¡Hola! Vamos a aprender juntos.';
    try {
      const r = await LL.cloud.invoke('ll-tts', { action: 'speak', text, voiceId: S.voice().voiceId || '' });
      if (r && r.path) { await LL.tts.play({ audioMode: 'voice', text, tts: { path: r.path, text } }); return; }
      toast('Voz natural no disponible (' + (r && r.reason) + '). Se usa la voz del dispositivo.', 'error');
      LL.ui.speak(text, 'es');
    } catch (e) { toast(LL.auth.friendly(e), 'error'); }
  }

  async function prepareAll() {
    const all = S.quizzes();
    let made = 0;
    for (let i = 0; i < all.length; i++) {
      const q = all[i];
      const work = { ...q, config: S.clone(q.config) };
      toast('🗣️ ' + (i + 1) + ' de ' + all.length + ': ' + q.name);
      const r = await LL.tts.prepareQuiz(work);
      if (r.made) { S.saveQuiz({ id: q.id, name: q.name, folderId: q.folderId, config: work.config }); made += r.made; }
      if (r.skipped && !r.made) break;
    }
    toast('Listo: ' + made + ' audio(s) nuevo(s).', 'success');
    renderBackup();
  }

  /* ---------- Settings: account, PIN, voice, backup, delete ---------- */
  function renderBackup() {
    const page = $('#screen-backup');
    const used = S.storageUsed();
    const quota = 5 * 1024 * 1024; // typical localStorage limit
    const pct = Math.min(100, Math.round((used / quota) * 100));
    const nQ = S.quizzes().length, nF = S.folders().length;
    const signed = LL.cloud.signedIn();
    page.replaceChildren(el('div.tool-page',
      el('div', el('h1', '⚙️ Ajustes'), el('p.lead', signed ? 'Tu cuenta, el PIN, la voz y los respaldos.' : 'El PIN, los respaldos y los datos de este dispositivo.')),
      accountPanel(),
      pinPanel(),
      voicePanel(),
      box(el('h2', '📥 Descargar respaldo'),
        el('p', 'Guarda en un archivo todos tus quizzes (' + nQ + '), carpetas (' + nF + ') y estudiantes.'),
        el('button.btn.primary', { type: 'button', style: { justifySelf: 'start' }, onclick: () => {
          download('little-learners-respaldo-' + S.todayChicago() + '.json', JSON.stringify(S.exportBackup()));
          toast('Respaldo descargado.', 'success');
        } }, '📥 Descargar respaldo')),
      box(el('h2', '📤 Importar'),
        el('p', 'Abre un archivo de respaldo, o una carpeta que otro maestro compartió contigo.'),
        el('button.btn.soft', { type: 'button', style: { justifySelf: 'start' }, onclick: importFlow }, '📤 Elegir archivo…'),
        el('p.small.muted', 'Para compartir solo una carpeta: en «Actividades», toca ⋯ en la carpeta → «Compartir».')),
      signed ? null : box(el('h2', '📲 Pasar las actividades a una tableta sin cuenta'),
        el('ol', { style: { margin: 0, paddingLeft: '22px', display: 'grid', gap: '6px', fontWeight: 700 } },
          el('li', 'En tu computadora: «📥 Descargar respaldo».'),
          el('li', 'Copia el archivo a la tableta (Google Drive, correo o memoria USB).'),
          el('li', 'En la tableta: mantén presionado «Maestro» → «Ajustes» → «📤 Elegir archivo».'),
          el('li', 'Elige «Agregar a lo que ya tengo». ¡Listo!'))),
      el('div.panel', { style: { display: 'grid', gap: '8px' } },
        el('h3', 'Espacio usado en este navegador'),
        el('div.meter', el('div', { style: { width: pct + '%', background: pct > 80 ? 'var(--bad)' : 'var(--primary)' } })),
        el('p.small.muted', 'Aproximadamente ' + formatBytes(used) + ' de ~5 MB. Las imágenes y los audios ocupan más espacio; las imágenes nuevas se reducen automáticamente.')),
      el('div.panel', { style: { display: 'grid', gap: '10px', borderColor: '#F3C3C3' } },
        el('h2', '🗑️ Borrar datos'),
        el('p', el('strong', 'Este dispositivo: '), 'borra de este navegador todos los quizzes, carpetas, estudiantes, ajustes y resultados' + (signed ? ', y cierra la sesión. Tu copia en la nube no se toca.' : '. No afecta a otros dispositivos ni a los respaldos descargados.')),
        el('button.btn.danger-ghost', { type: 'button', style: { justifySelf: 'start' }, onclick: deleteAll }, 'Borrar este dispositivo…'),
        signed ? el('p', el('strong', 'La nube: '), 'borra tus quizzes, carpetas, estudiantes y voces guardados en tu cuenta, y también de este dispositivo. Tus otras tabletas los quitarán en su siguiente sincronización.') : null,
        signed ? el('button.btn.danger-ghost', { type: 'button', style: { justifySelf: 'start' }, onclick: deleteCloud }, 'Borrar mis datos de la nube…') : null,
        signed ? el('p.small.muted', 'Para cerrar la cuenta por completo, pídeselo a quien administra esta página.') : null),
      el('p.small', el('button.link-btn', { type: 'button', onclick: () => LL.app.openInfo('privacidad') }, 'Política de privacidad'), ' · ', el('button.link-btn', { type: 'button', onclick: () => LL.app.openInfo('terminos') }, 'Términos de uso'))));
  }

  async function deleteCloud() {
    const typed = el('input', { type: 'text', placeholder: 'BORRAR', autocomplete: 'off', 'aria-label': 'Escribe BORRAR para confirmar' });
    const ok = await dialog({
      title: '¿Borrar tus datos de la nube?',
      body: el('div', { style: { display: 'grid', gap: '10px' } },
        el('p', 'Se borrarán de tu cuenta todos los quizzes, carpetas, estudiantes, ajustes y voces. Tus otras tabletas dejarán de recibirlos. Esto no se puede deshacer.'),
        el('label.field', 'Para confirmar, escribe BORRAR', typed)),
      actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: 'Borrar de la nube', kind: 'danger', value: () => (typed.value.trim().toUpperCase() === 'BORRAR' ? true : (toast('Escribe BORRAR para confirmar.', 'error'), typed.focus(), undefined)) }],
    });
    if (!ok) return;
    try { await LL.sync.deleteCloudData(); toast('Tus datos de la nube se borraron.', 'success'); renderBackup(); }
    catch (e) { toast('No se pudo borrar: ' + LL.auth.friendly(e), 'error'); }
  }

  async function deleteAll() {
    const typed = el('input', { type: 'text', placeholder: 'BORRAR', autocomplete: 'off', 'aria-label': 'Escribe BORRAR para confirmar' });
    const ok = await dialog({
      title: '¿Borrar todo?',
      body: el('div', { style: { display: 'grid', gap: '10px' } },
        el('p', 'Esto no se puede deshacer. Si quieres conservar tus actividades, primero descarga un respaldo.'),
        el('label.field', 'Para confirmar, escribe BORRAR', typed)),
      actions: [
        { label: 'Cancelar', kind: 'ghost', value: false },
        { label: '📥 Descargar respaldo primero', kind: 'soft', value: () => { download('little-learners-respaldo-' + S.todayChicago() + '.json', JSON.stringify(S.exportBackup())); toast('Respaldo descargado.', 'success'); } },
        { label: 'Borrar todo', kind: 'danger', value: () => (typed.value.trim().toUpperCase() === 'BORRAR' ? true : (toast('Escribe BORRAR para confirmar.', 'error'), typed.focus(), undefined)) },
      ],
    });
    if (!ok) return;
    S.deleteAllData();
    toast('Se borraron todos los datos de este dispositivo.', 'success');
    LL.app.goHome();
  }

  async function importFlow() {
    const f = await pickFile('application/json,.json');
    if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch { toast('No se pudo leer ese archivo.', 'error'); return; }
    if (!S.validateBackup(data)) { toast('Este archivo no es un respaldo de Little Learners Activities.', 'error'); return; }
    const lib = data.data[S.KEYS.library] || [], fol = data.data[S.KEYS.folders] || [];
    const nQ = lib.filter((x) => x.type === 'quiz').length;
    const isFolder = data.kind === 'folder';
    const actions = [{ label: 'Cancelar', kind: 'ghost', value: null }];
    if (!isFolder) actions.push({ label: 'Reemplazar todo', kind: 'danger-ghost', value: 'replace' });
    actions.push({ label: 'Agregar a lo que ya tengo', kind: 'primary', value: 'merge' });
    const mode = await dialog({
      title: isFolder ? 'Importar carpeta compartida' : 'Importar respaldo',
      body: el('div', { style: { display: 'grid', gap: '8px' } },
        el('p', 'El archivo tiene ' + nQ + ' quiz(zes) y ' + fol.length + ' carpeta(s).'),
        el('p.small.muted', '«Agregar» conserva todo lo que ya tienes. ' + (isFolder ? '' : '«Reemplazar todo» borra lo de este navegador y deja solo lo del archivo.'))),
      actions,
    });
    if (!mode) return;
    if (mode === 'replace' && !(await confirmDialog('¿Reemplazar todo?', 'Se borrarán los quizzes y carpetas de este navegador que no estén en el archivo.', 'Reemplazar', true))) return;
    try {
      const r = S.importBackup(data, mode);
      toast('Importado: ' + r.quizzes + ' quiz(zes) y ' + r.folders + ' carpeta(s).', 'success');
      renderBackup();
    } catch (e) { toast(e.message, 'error'); }
  }

  /* ---------- Sonidos iniciales ---------- */
  function syncImages(c, force) {
    const bank = LL.IMAGE_BANK[c.lang];
    const prev = !force && c.fixedImages && c.fixedImagesLang === c.lang ? c.fixedImages : {};
    const out = {};
    for (const letter of c.letters) {
      const options = bank[letter];
      const keep = [];
      for (const it of prev[letter] || []) if (options.some(([e, w]) => e === it[0] && w === it[1]) && !keep.some((k) => k[1] === it[1])) keep.push(it);
      const free = LL.ui.shuffle(options.filter(([, w]) => !keep.some((k) => k[1] === w)));
      out[letter] = [...keep.slice(0, c.per), ...free.slice(0, Math.max(0, c.per - keep.length))];
    }
    c.fixedImages = out;
    c.fixedImagesLang = c.lang;
  }

  function renderSonidos() {
    const page = $('#screen-sonidos-admin');
    const c = S.sonidos();
    if (!c.fixedImages) { syncImages(c); S.saveSonidos(c); }
    const commit = (redrawImages) => { if (redrawImages) syncImages(c); S.saveSonidos(c); renderSonidos(); };

    const show = el('input', { type: 'checkbox', checked: !!c.showToStudents });
    show.addEventListener('change', () => { c.showToStudents = show.checked; commit(false); toast(show.checked ? 'Los estudiantes ya ven «Sonidos iniciales».' : '«Sonidos iniciales» quedó oculto para los estudiantes.'); });

    const seg = (opts, val, fn) => {
      const w = el('div.segmented');
      for (const [v, label] of opts) w.append(el('button', { type: 'button', 'aria-pressed': String(String(v) === String(val)), onclick: () => fn(v) }, label));
      return w;
    };

    const letters = el('div.letters');
    for (const L of 'MPSLF') {
      const cb = el('input', { type: 'checkbox', checked: c.letters.includes(L) });
      cb.addEventListener('change', () => {
        const next = 'MPSLF'.split('').filter((x) => (x === L ? cb.checked : c.letters.includes(x)));
        if (!next.length) { cb.checked = true; toast('Elige al menos una letra.', 'error'); return; }
        c.letters = next; commit(true);
      });
      letters.append(el('label', cb, L));
    }

    const per = el('select', { style: { maxWidth: '140px' } });
    for (const n of [4, 5, 6, 7, 8]) per.append(new Option(String(n), String(n), false, n === c.per));
    per.addEventListener('change', () => { c.per = Number(per.value); commit(true); });

    const groups = el('div.image-groups');
    for (const L of c.letters) {
      const slots = el('div.image-slots');
      (c.fixedImages[L] || []).forEach(([emoji, word], idx) => {
        const sel = el('select', { 'aria-label': 'Letra ' + L + ', imagen ' + (idx + 1) });
        LL.IMAGE_BANK[c.lang][L].forEach(([e, w], k) => sel.add(new Option(e + ' ' + w, String(k), false, e === emoji && w === word)));
        sel.addEventListener('change', () => {
          const pick = LL.IMAGE_BANK[c.lang][L][Number(sel.value)];
          if (c.fixedImages[L].some((it, j) => j !== idx && it[1] === pick[1])) { toast('Esa imagen ya está elegida para esta letra.', 'error'); renderSonidos(); return; }
          c.fixedImages[L][idx] = [...pick]; commit(false);
        });
        slots.append(sel);
      });
      groups.append(el('div', el('h3', 'Letra ' + L), slots));
    }

    page.replaceChildren(el('div.tool-page',
      el('div', el('h1', '🔤 Sonidos iniciales'), el('p.lead', 'La actividad original de arrastrar dibujos a su letra. Los cambios se guardan solos.')),
      el('div.panel', { style: { display: 'grid', gap: '16px' } },
        el('div.field', el('label.switch', show, 'Mostrar a los estudiantes'), el('span.hint', 'Aparece como una tarjeta más en sus actividades.')),
        el('div.field', 'Letras', letters),
        el('div', { style: { display: 'flex', gap: '18px', flexWrap: 'wrap' } },
          el('div.field', 'Idioma', seg([['es', 'Español'], ['en', 'English']], c.lang, (v) => { c.lang = v; commit(true); })),
          el('div.field', 'Modalidad', seg([['practice', 'Práctica'], ['assessment', 'Evaluación']], c.mode, (v) => { c.mode = v; commit(false); })),
          el('div.field', 'Velocidad', seg([[28, 'Lenta'], [45, 'Normal'], [70, 'Rápida']], c.speed, (v) => { c.speed = Number(v); commit(false); })),
          el('label.field', 'Imágenes por letra', per)),
        el('button.btn.primary', { type: 'button', style: { justifySelf: 'start' }, onclick: () => LL.app.openSonidos() }, '▶️ Probar')),
      el('div.panel', { style: { display: 'grid', gap: '12px' } },
        el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px', flexWrap: 'wrap' } },
          el('h2', '🖼️ Imágenes'),
          el('button.btn.sm.ghost', { type: 'button', onclick: () => { syncImages(c, true); S.saveSonidos(c); renderSonidos(); } }, '🎲 Otra selección')),
        el('p.small.muted', 'Siempre salen estas mismas imágenes, aunque cambie su orden.'),
        groups)));
  }

  LL.teacher = { renderRoster, renderBackup, renderSonidos };
})();

</script>

(function () {

  function render(focusId) {

      sec('acerca', 'Acerca de',
        el('p', 'Little Learners Activities es una herramienta gratuita para que maestros de Pre-K creen quizzes con imágenes y sonido, y para que los niños los respondan en una tableta.'),
        c.owner ? el('p', 'Creado por ', el('strong', c.owner), ', maestro bilingüe de Pre-K.') : null,
        el('p', 'No tiene costo y no tiene anuncios. Los maestros pueden usarla con una cuenta (por invitación) para guardar sus actividades en la nube, o sin cuenta en un solo dispositivo.'),
        contactLine),

      sec('privacidad', 'Política de privacidad',
        el('p.small.muted', 'Última actualización: ' + c.policyUpdated),
        el('h3', 'En pocas palabras'),
        el('p', 'Little Learners no tiene anuncios, no rastrea a nadie y no vende datos. Si el maestro usa una cuenta, sus actividades se guardan en la nube (Supabase) para usarlas en sus tabletas; si no, todo se queda solo en el navegador del dispositivo.'),
        el('h3', 'Qué se guarda'),
        ul('Del maestro (solo si usa una cuenta): su correo electrónico y una contraseña protegida por Supabase.',
          'Los nombres (o apodos) y el animalito de cada estudiante que el maestro agrega.',
          'Los quizzes y carpetas que crea el maestro: textos, imágenes y audios.',
