  <script>
/* js/auth.js */
/* Teacher sign-in, set-password (invitation / reset links), first sign-in on a
 * device, and the teacher PIN used on shared classroom tablets. */
window.LL = window.LL || {};
(function () {
  const { el, $, toast, dialog, confirmDialog } = LL.ui;
  const S = LL.store;
  const LOCAL_MODE = 'll-v122-local-mode';

  const localMode = () => { try { return localStorage.getItem(LOCAL_MODE) === '1'; } catch { return false; } };
  const setLocalMode = (on) => { try { if (on) localStorage.setItem(LOCAL_MODE, '1'); else localStorage.removeItem(LOCAL_MODE); } catch { /* ignore */ } };

  /** Should the app ask the teacher to sign in before anything else? */
  function needsLogin() { return LL.cloud.enabled() && !LL.cloud.signedIn() && !localMode(); }

  function friendly(e) {
    const m = String(e && e.message || e || '');
    if (e && e.code === 'offline') return 'No hay conexión a internet. Revisa el Wi-Fi e inténtalo de nuevo.';
    if (/invalid login credentials|invalid_grant|invalid_credentials/i.test(m)) return 'El correo o la contraseña no son correctos.';
    if (/email not confirmed/i.test(m)) return 'Primero confirma tu correo con el enlace que te enviamos.';
    if (/rate limit|too many/i.test(m)) return 'Demasiados intentos. Espera un momento y vuelve a intentarlo.';
    if (/should be different/i.test(m)) return 'La nueva contraseña debe ser diferente a la anterior.';
    if (/weak|at least/i.test(m)) return 'La contraseña es muy débil. Usa al menos 8 caracteres.';
    return m || 'Algo salió mal. Inténtalo de nuevo.';
  }

  /* ---------- Sign-in screen ---------- */
  function renderLogin(message) {
    const page = $('#screen-login');
    const email = el('input', { type: 'email', autocomplete: 'username', placeholder: 'tu@escuela.org', required: true, 'aria-label': 'Correo electrónico' });
    const pass = el('input', { type: 'password', autocomplete: 'current-password', placeholder: 'Contraseña', required: true, 'aria-label': 'Contraseña' });
    const err = el('p.problem-box', { hidden: true, role: 'alert' });
    const btn = el('button.btn.primary.big', { type: 'submit' }, 'Entrar');
    const form = el('form.login-form', { novalidate: true },
      el('label.field', 'Correo electrónico', email),
      el('label.field', 'Contraseña', pass),
      err, btn);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      if (!email.value.trim() || !pass.value) { err.textContent = 'Escribe tu correo y tu contraseña.'; err.hidden = false; return; }
      btn.disabled = true; btn.textContent = 'Entrando…';
      try {
        await LL.cloud.signIn(email.value.trim(), pass.value);
        await afterSignIn();
      } catch (ex) {
        err.textContent = friendly(ex); err.hidden = false;
      } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
    });
    page.replaceChildren(el('div.login-wrap',
      el('div.login-card.panel',
        el('div.login-logo', { 'aria-hidden': 'true' }, '✨'),
        el('h1', 'Little Learners'),
        el('p.lead', 'Entra con tu cuenta de maestro.'),
        message ? el('p.ok-box', message) : null,
        form,
        el('button.link-btn', { type: 'button', onclick: () => resetDialog(email.value) }, '¿Olvidaste tu contraseña?'),
        el('p.small.muted', 'Las cuentas son por invitación. Si necesitas una, pídela a quien administra esta página.')),
      el('div.login-alt',
        el('button.btn.ghost', { type: 'button', onclick: () => { setLocalMode(true); LL.app.go('students'); } }, 'Usar sin cuenta, solo en este dispositivo'),
        el('p.small.muted', 'Sin cuenta, las actividades se guardan solo en este navegador.')),
      el('footer.site-footer',
        el('button', { type: 'button', onclick: () => LL.app.openInfo('privacidad') }, 'Privacidad'), el('span', { 'aria-hidden': 'true' }, '·'),
        el('button', { type: 'button', onclick: () => LL.app.openInfo('terminos') }, 'Términos'))));
    setTimeout(() => email.focus(), 50);
  }

  async function resetDialog(prefill) {
    const email = el('input', { type: 'email', autocomplete: 'username', value: prefill || '', placeholder: 'tu@escuela.org' });
    const ok = await dialog({
      title: 'Cambiar contraseña',
      body: el('div', { style: { display: 'grid', gap: '10px' } }, el('p', 'Te enviaremos un correo con un enlace para crear una contraseña nueva.'), el('label.field', 'Correo electrónico', email)),
      actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: 'Enviar enlace', kind: 'primary', value: () => (email.value.trim() ? true : (email.focus(), undefined)) }],
    });
    if (!ok) return;
    try { await LL.cloud.sendPasswordReset(email.value.trim()); toast('Listo. Revisa tu correo (y la carpeta de spam).', 'success'); }
    catch (e) { toast(friendly(e), 'error'); }
  }

  /* ---------- New password (from invitation or reset email) ---------- */
  function renderSetPassword(kind) {
    const page = $('#screen-set-password');
    const p1 = el('input', { type: 'password', autocomplete: 'new-password', minlength: '8', placeholder: 'Mínimo 8 caracteres' });
    const p2 = el('input', { type: 'password', autocomplete: 'new-password', minlength: '8', placeholder: 'Repite la contraseña' });
    const err = el('p.problem-box', { hidden: true, role: 'alert' });
    const btn = el('button.btn.primary.big', { type: 'submit' }, 'Guardar contraseña');
    const form = el('form.login-form', { novalidate: true }, el('label.field', 'Contraseña nueva', p1), el('label.field', 'Repite la contraseña', p2), err, btn);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      if (p1.value.length < 8) { err.textContent = 'Usa al menos 8 caracteres.'; err.hidden = false; return; }
      if (p1.value !== p2.value) { err.textContent = 'Las contraseñas no coinciden.'; err.hidden = false; return; }
      btn.disabled = true;
      try {
        await LL.cloud.setPassword(p1.value);
        toast('Contraseña guardada.', 'success');
        await afterSignIn();
      } catch (ex) { err.textContent = friendly(ex); err.hidden = false; }
      finally { btn.disabled = false; }
    });
    const u = LL.cloud.user();
    page.replaceChildren(el('div.login-wrap', el('div.login-card.panel',
      el('div.login-logo', { 'aria-hidden': 'true' }, '🔑'),
      el('h1', kind === 'invite' ? '¡Bienvenido!' : 'Contraseña nueva'),
      el('p.lead', kind === 'invite' ? 'Crea una contraseña para tu cuenta de maestro.' : 'Escribe tu contraseña nueva.'),
      u && u.email ? el('p.muted', u.email) : null,
      form)));
    setTimeout(() => p1.focus(), 50);
  }

  /* ---------- First sign-in on this device ---------- */
  async function afterSignIn() {
    setLocalMode(false);
    const me = LL.cloud.user();
    const prev = LL.sync.owner();
    if (me && prev && prev !== me.id) {
      // Another teacher's activities are on this device: remove them before syncing.
      const ok = await confirmDialog('Este dispositivo tiene actividades de otra cuenta',
        'Para proteger su privacidad, se quitarán de este dispositivo (esa cuenta las conserva en la nube). Después se descargarán las tuyas.', 'Continuar');
      if (!ok) { await LL.cloud.signOut(); renderLogin(); LL.app.go('login'); return; }
      LL.sync.clearLocalLibrary();
      S.quietly(() => { S.saveRoster([]); S.savePinHash(null); });
      try { localStorage.removeItem(S.KEYS.settingsAt); } catch { /* ignore */ }
      LL.sync.reset(me.id);
    } else if (me && !prev) {
      if (LL.sync.localHasData()) {
        const nQ = S.quizzes().length, nF = S.folders().length;
        const ok = await dialog({
          title: '¿Subir tus actividades a tu cuenta?',
          body: 'En este dispositivo hay ' + nQ + ' quiz(zes) y ' + nF + ' carpeta(s). Se guardarán en tu cuenta para que aparezcan en tus otros dispositivos y tabletas.',
          actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: 'Subir a mi cuenta', kind: 'primary', value: true }],
        });
        if (!ok) { await LL.cloud.signOut(); renderLogin(); LL.app.go('login'); return; }
      }
      LL.sync.reset(me.id);
    }
    LL.app.go('students');
    toast('Sesión iniciada' + (me && me.email ? ': ' + me.email : '') + '. Sincronizando…');
    LL.sync.run().then((ok) => { if (ok) toast('✓ Actividades sincronizadas.', 'success'); });
  }

  async function signOut() {
    if (!(await confirmDialog('¿Cerrar sesión en este dispositivo?', 'Las actividades se quedan en este dispositivo, pero ya no se actualizarán hasta que vuelvas a entrar.', 'Cerrar sesión'))) return;
    await LL.sync.run().catch(() => {});
    await LL.cloud.signOut();
    toast('Sesión cerrada.');
    LL.app.goHome();
  }

  /* ---------- Teacher PIN ---------- */
  async function hashPin(pin) {
    const text = 'little-learners-pin|' + pin;
    try {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return 'sha256:' + [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
      }
    } catch { /* fall through */ }
    let h = 0x811c9dc5; // FNV-1a fallback for browsers without Web Crypto
    for (const ch of text) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
    return 'fnv:' + h.toString(16);
  }

  function pinPad(title, subtitle, extraActions = []) {
    return new Promise((resolve) => {
      let value = '';
      const dots = el('div.pin-dots', { 'aria-live': 'polite' });
      const draw = () => { dots.replaceChildren(...Array.from({ length: Math.max(4, value.length) }, (_, i) => el('span' + (i < value.length ? '.on' : '')))); dots.setAttribute('aria-label', value.length + ' dígitos'); };
      draw();
      const pad = el('div.pin-pad');
      const add = (d) => { if (value.length < 8) { value += d; draw(); } };
      for (const d of ['1', '2', '3', '4', '5', '6', '7', '8', '9']) pad.append(el('button', { type: 'button', onclick: () => add(d) }, d));
      pad.append(el('button', { type: 'button', 'aria-label': 'Borrar', onclick: () => { value = value.slice(0, -1); draw(); } }, '⌫'));
      pad.append(el('button', { type: 'button', onclick: () => add('0') }, '0'));
      pad.append(el('button.ok', { type: 'button', 'aria-label': 'Aceptar', onclick: () => finish() }, '✓'));
      const onKey = (e) => {
        if (/^[0-9]$/.test(e.key)) { add(e.key); e.preventDefault(); }
        else if (e.key === 'Backspace') { value = value.slice(0, -1); draw(); e.preventDefault(); }
        else if (e.key === 'Enter') { finish(); e.preventDefault(); }
      };
      document.addEventListener('keydown', onKey, true);
      let done;
      const p = dialog({ title, body: el('div.pin-box', subtitle ? el('p.muted', subtitle) : null, dots, pad), actions: [...extraActions, { label: 'Cancelar', kind: 'ghost', value: false }] });
      function finish() { done = value; document.querySelector('.modal-back')?.click(); }
      p.then((v) => { document.removeEventListener('keydown', onKey, true); resolve(v === 'forgot' ? 'forgot' : (done || null)); });
    });
  }

  let fails = 0, lockedUntil = 0;
  /** Ask for the PIN (if one is set). Resolves true when the teacher may enter. */
  async function checkPin() {
    const saved = S.pinHash();
    if (!saved) return true;
    if (Date.now() < lockedUntil) { toast('Demasiados intentos. Espera ' + Math.ceil((lockedUntil - Date.now()) / 1000) + ' segundos.', 'error'); return false; }
    const me = LL.cloud.user();
    const pin = await pinPad('🔒 PIN del maestro', null, me ? [{ label: '¿Olvidaste el PIN?', kind: 'ghost', value: 'forgot' }] : []);
    if (pin == null) return false;
    if (pin === 'forgot') return forgotPin(me);
    if ((await hashPin(pin)) === saved) { fails = 0; return true; }
    fails++;
    if (fails >= 5) { lockedUntil = Date.now() + 30000; fails = 0; }
    toast('PIN incorrecto.', 'error');
    return false;
  }

  /** Entering the account password also opens the teacher area (and lets you change the PIN there). */
  async function forgotPin(me) {
    const pass = el('input', { type: 'password', autocomplete: 'current-password', placeholder: 'Contraseña' });
    const ok = await dialog({
      title: 'Entrar con tu contraseña',
      body: el('div', { style: { display: 'grid', gap: '10px' } }, el('p', 'Escribe la contraseña de ' + me.email + '. Luego puedes cambiar el PIN en «Ajustes».'), el('label.field', 'Contraseña', pass)),
      actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: 'Entrar', kind: 'primary', value: () => (pass.value ? true : (pass.focus(), undefined)) }],
    });
    if (!ok) return false;
    try { await LL.cloud.signIn(me.email, pass.value); return true; }
    catch (e) { toast(friendly(e), 'error'); return false; }
  }

  async function setPinFlow() {
    const a = await pinPad('Nuevo PIN', 'Elige de 4 a 8 números.');
    if (a == null) return;
    if (a.length < 4) { toast('El PIN debe tener al menos 4 números.', 'error'); return; }
    const b = await pinPad('Repite el PIN', null);
    if (b == null) return;
    if (a !== b) { toast('Los PIN no coinciden.', 'error'); return; }
    S.savePinHash(await hashPin(a));
    toast('PIN guardado' + (LL.cloud.signedIn() ? '. Se usará en todos tus dispositivos.' : '.'), 'success');
  }

  LL.auth = { needsLogin, localMode, setLocalMode, renderLogin, renderSetPassword, afterSignIn, signOut, checkPin, setPinFlow, friendly };
})();

  <script>
/* js/app.js */
/* App shell: screens, top bar, student picker, teacher entry, Sonidos iniciales. */
window.LL = window.LL || {};
(function () {
  const { el, $, $$, toast } = LL.ui;
  const S = LL.store;

  const state = { screen: 'students', mode: null, student: null };
  const SCREENS = ['login', 'set-password', 'students', 'library', 'editor', 'students-admin', 'backup', 'sonidos-admin', 'sonidos', 'result', 'info'];
  let infoReturn = 'students';
  const TEACHER_TABS = [
    { id: 'library', icon: '📚', label: 'Actividades' },
    { id: 'students-admin', icon: '👧', label: 'Estudiantes' },
    { id: 'sonidos-admin', icon: '🔤', label: 'Sonidos iniciales' },
    { id: 'backup', icon: '⚙️', label: 'Ajustes' },
  ];

  async function go(screen) {
    if (state.screen === 'editor' && screen !== 'editor' && LL.editor && !(await LL.editor.canLeave())) return;
    state.screen = screen;
    for (const s of SCREENS) $('#screen-' + s).hidden = s !== screen;
    document.body.classList.toggle('mode-student', state.mode === 'student');
    document.body.classList.toggle('mode-teacher', state.mode === 'teacher');
    document.body.classList.toggle('mode-home', !state.mode);
    document.body.classList.toggle('mode-login', screen === 'login' || screen === 'set-password');
    if (screen === 'login') LL.auth.renderLogin(state.loginMessage);
    if (screen === 'set-password') LL.auth.renderSetPassword(state.passwordKind);
    if (screen === 'students') renderStudents();
    if (screen === 'library') LL.library.render();
    if (screen === 'students-admin') LL.teacher.renderRoster();
    if (screen === 'backup') LL.teacher.renderBackup();
    if (screen === 'sonidos-admin') LL.teacher.renderSonidos();
    if (screen === 'info') LL.info.render(state.infoSection);
    renderAppbar();
    window.scrollTo(0, 0);
    const h = $('#screen-' + screen + ' h1');
    if (h && document.activeElement && document.activeElement !== document.body && !$('#screen-' + screen).contains(document.activeElement)) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  }

  function renderAppbar() {
    const center = $('#appbarCenter'), right = $('#appbarRight');
    center.replaceChildren(); right.replaceChildren();
    if (state.mode === 'student' && state.student) {
      center.append(el('div.student-chip', el('span.animal', state.student.animal), el('span', state.student.name)));
      right.append(el('button.icon-btn.big', { type: 'button', 'aria-label': 'Volver a ¿Quién eres?', title: 'Volver a ¿Quién eres?', onclick: goHome }, '🏠'));
    } else if (state.mode === 'teacher') {
      const tabs = el('div.tabs', { role: 'tablist' });
      for (const t of TEACHER_TABS) {
        const active = state.screen === t.id || (t.id === 'library' && state.screen === 'editor');
        tabs.append(el('button.tab', { type: 'button', role: 'tab', 'aria-selected': String(active), onclick: () => go(t.id) }, t.icon + ' ', el('span.tab-label', t.label)));
      }
      center.append(tabs);
      if (LL.cloud.signedIn()) right.append(syncBadge());
      right.append(el('button.icon-btn', { type: 'button', 'aria-label': 'Información, privacidad y términos', title: 'Información', onclick: () => openInfo('acerca') }, 'ℹ️'));
      right.append(el('button.btn.ghost', { type: 'button', onclick: goHome }, 'Salir ↩'));
    } else if (state.screen === 'login' || state.screen === 'set-password') {
      // nothing in the bar while signing in
    } else if (state.screen === 'info') {
      right.append(el('button.btn.ghost', { type: 'button', onclick: () => go(infoReturn) }, '⬅️ Volver'));
    } else {
      right.append(teacherGate());
    }
  }

  /** Small cloud icon showing whether the teacher's changes are saved online. */
  function syncBadge() {
    const b = el('button.icon-btn.sync-badge', { type: 'button', onclick: () => { LL.sync.run(); } });
    const draw = (st) => {
      const icon = st.busy || st.pending ? '🔄' : st.error === 'offline' ? '📴' : st.error ? '⚠️' : '☁️';
      const label = st.busy || st.pending ? 'Guardando en la nube…' : st.error === 'offline' ? 'Sin internet: los cambios se subirán al volver la conexión' : st.error ? 'No se pudo sincronizar: ' + st.error : 'Todo guardado en la nube' + (st.lastOk ? ' (' + new Date(st.lastOk).toLocaleTimeString('es-US', { hour: 'numeric', minute: '2-digit' }) + ')' : '');
      b.textContent = icon; b.title = label; b.setAttribute('aria-label', label);
      b.classList.toggle('spin', !!(st.busy || st.pending));
    };
    draw(LL.sync.status());
    const off = LL.sync.onChange((st) => { if (!b.isConnected) { off(); return; } draw(st); });
    return b;
  }

  /** "Maestro" button that has to be held for one second, so children don't open it by accident. */
  function teacherGate() {
    const b = el('button.btn.ghost.teacher-gate', { type: 'button', title: 'Mantén presionado para entrar', 'aria-label': 'Maestro: mantén presionado para entrar' }, el('div.fill'), el('span', '🔒 Maestro'));
    let t = null;
    const start = (e) => { e.preventDefault(); b.classList.add('holding'); t = setTimeout(() => { b.classList.remove('holding'); enterTeacher(); }, 1000); };
    const cancel = () => { if (t) { clearTimeout(t); t = null; } if (b.classList.contains('holding')) { b.classList.remove('holding'); toast('Para entrar, mantén presionado el botón «Maestro».'); } };
    b.addEventListener('pointerdown', start);
    b.addEventListener('pointerup', cancel);
    b.addEventListener('pointerleave', cancel);
    b.addEventListener('pointercancel', cancel);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterTeacher(); } });
    return b;
  }

  async function enterTeacher() {
    if (!(await LL.auth.checkPin())) return;
    state.mode = 'teacher'; state.student = null;
    LL.sync.run();
    LL.library.resetToRoot();
    go('library');
  }

  async function goHome() {
    if (state.screen === 'editor' && !(await LL.editor.canLeave())) return;
    if (LL.player.isOpen()) LL.player.close();
    stopSonidos();
    state.mode = null; state.student = null; state.screen = 'editor-left';
    if (LL.auth.needsLogin()) { go('login'); return; }
    go('students');
    LL.sync.run();
  }

  function openInfo(section) {
    if (state.screen !== 'info') infoReturn = state.screen === 'editor' ? 'library' : state.screen;
    state.infoSection = section;
    go('info');
  }

  function renderStudents() {
    const grid = $('#studentGrid');
    grid.replaceChildren();
    const r = S.roster();
    if (!r.length) {
      grid.append(el('p.lead', { style: { gridColumn: '1 / -1', textAlign: 'center' } }, 'Todavía no hay estudiantes. El maestro puede agregarlos en «Estudiantes».'));
      return;
    }
    for (const s of r) {
      const card = el('button.student-card', { type: 'button' }, el('span.animal', s.animal), el('span', s.name));
      // Little wiggle, then go: the child sees their animal react to the tap.
      card.addEventListener('click', () => { card.classList.add('tapped'); setTimeout(() => selectStudent(s), 280); });
      grid.append(card);
    }
    LL.ui.stagger(grid);
    const credit = $('#voiceCredit');
    if (credit) credit.hidden = !LL.tts.active();
  }

  /** A student always starts at the top of the library. */
  function selectStudent(s) {
    state.mode = 'student'; state.student = s;
    LL.library.resetToRoot();
    go('library');
  }

  /* ---------- Sonidos iniciales (original activity) ---------- */
  let sonidosConfig = null;
  function openSonidos() {
    sonidosConfig = S.sonidos();
    if (!sonidosConfig.letters.length) { toast('Elige al menos una letra en «Sonidos iniciales».', 'error'); return; }
    go('sonidos');
    $('#sonidosTitle').textContent = '🔤 Sonidos iniciales' + (state.student ? ' · ' + state.student.name : ' · prueba del maestro');
    const f = $('#sonidosFrame');
    const cfg = { lang: sonidosConfig.lang, per: sonidosConfig.per, speed: sonidosConfig.speed, mode: sonidosConfig.mode, letters: sonidosConfig.letters, fixedImages: sonidosConfig.fixedImages || null };
    f.onload = () => f.contentWindow.postMessage({ type: 'll-start', config: cfg }, '*');
    f.srcdoc = LL.sonidosActivityHTML;
  }
  function stopSonidos() { const f = $('#sonidosFrame'); if (f) { f.onload = null; f.removeAttribute('srcdoc'); f.src = 'about:blank'; } }

  function sonidosFinished(result) {
    stopSonidos();
    const c = sonidosConfig;
    if (!state.student) {
      toast('Prueba terminada: ' + result.ok + ' de ' + result.total + ' correctas.', 'success');
      go('library');
      return;
    }
    const me = state.student;
    const scores = S.sonidosScores(c);
    const prev = scores[me.name];
    if (!prev || result.ok > prev.ok) scores[me.name] = { ok: result.ok, total: result.total, animal: me.animal };
    S.saveSonidosScores(c, scores);
    $('#resultName').textContent = me.name;
    $('#resultScore').textContent = result.ok + ' / ' + result.total;
    const ranking = Object.entries(scores).map(([name, d]) => ({ name, ...d })).sort((a, b) => b.ok - a.ok || a.name.localeCompare(b.name));
    $('#resultPlace').textContent = 'Puesto ' + (ranking.findIndex((x) => x.name === me.name) + 1) + ' de ' + ranking.length;
    $('#resultDate').textContent = 'Resultados de hoy (' + S.todayChicago() + ') con esta misma configuración';
    const list = $('#resultRanks');
    list.replaceChildren();
    ranking.forEach((r, i) => list.append(el('div.rank' + (r.name === me.name ? '.mine' : ''), el('span', (i + 1) + '.' + (i < 5 ? ' ⭐' : '')), el('span', r.animal || '🐾'), el('span', r.name), el('span', r.ok + '/' + r.total))));
    go('result');
  }

  window.addEventListener('message', (e) => {
    const f = $('#sonidosFrame');
    if (!f || e.source !== f.contentWindow || !e.data || e.data.type !== 'll-finished') return;
    sonidosFinished(e.data);
  });

  document.addEventListener('DOMContentLoaded', () => {
    $('#sonidosExit').addEventListener('click', () => { stopSonidos(); go('library'); });
    $('#resultOk').addEventListener('click', () => go('library'));
    document.querySelectorAll('[data-info]').forEach((b) => b.addEventListener('click', () => openInfo(b.dataset.info)));
    start();
  });

  async function start() {
    // Links from invitation / password-reset emails arrive with a token in the address.
    const r = LL.cloud.enabled() ? await LL.cloud.handleRedirect() : null;
    if (r && r.error) { state.loginMessage = null; go('login'); toast('El enlace no es válido o ya caducó. Pide uno nuevo.', 'error'); return; }
    if (r && (r.type === 'invite' || r.type === 'recovery')) { state.passwordKind = r.type; go('set-password'); return; }
    if (r) { LL.auth.afterSignIn(); return; }
    if (LL.auth.needsLogin()) { go('login'); return; }
    go('students');
    if (LL.cloud.signedIn()) LL.sync.run();
  }

  // Refresh what's on screen when new activities arrive from the cloud.
  document.addEventListener('ll-synced', () => {
    if (LL.player.isOpen()) return;
    if (state.screen === 'students') renderStudents();
    else if (state.screen === 'library') LL.library.render();
    else if (state.screen === 'students-admin') LL.teacher.renderRoster();
    else if (state.screen === 'sonidos-admin') LL.teacher.renderSonidos();
  });
  document.addEventListener('ll-signed-out', () => {
    if (LL.cloud.signedIn()) return;
    toast('Tu sesión terminó. Vuelve a entrar para seguir sincronizando.', 'error');
    if (!LL.player.isOpen() && state.screen !== 'editor' && !state.mode) go('login');
  });

  LL.app = { state, go, goHome, openSonidos, openInfo };
})();

</script>
</body>
</html>
