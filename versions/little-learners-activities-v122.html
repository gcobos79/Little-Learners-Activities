<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE">
  <title>Little Learners Activities</title>
  <style>
/* Little Learners Activities — V122 styles
 * Designed for the Lenovo 10e Chromebook tablets (10.1", touch, Chrome) and the
 * classroom display. Big touch targets, no hover-only actions. */

:root {
  --bg: #FBF6EE;
  --bg-dots: #F3EADB;
  --surface: #FFFFFF;
  --surface-2: #F7F3EC;
  --ink: #22304A;
  --muted: #4C576B;
  --line: #E6DED1;
  --primary: #2F5BD3;
  --primary-ink: #FFFFFF;
  --primary-soft: #E8EEFF;
  --sun: #FFC94D;
  --good: #22C55E;
  --good-soft: #DCF7E6;
  --bad: #EF4444;
  --bad-soft: #FDE4E4;
  --warn-soft: #FFF3D6;
  --radius: 22px;
  --radius-sm: 14px;
  --shadow: 0 2px 0 #E9DFCF, 0 8px 24px rgba(60, 45, 20, .08);
  --shadow-press: 0 1px 0 #E9DFCF;
  /* Only fonts already on the device: no outside font service is contacted.
     ui-rounded = the rounded system font on iPhone/iPad/Mac. */
  --font: ui-rounded, 'SF Pro Rounded', 'Nunito', 'Varela Round', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --appbar-h: 68px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dots) 1.2px, transparent 1.2px);
  background-size: 22px 22px;
  font-size: 17px;
  line-height: 1.35;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; line-height: 1.15; font-weight: 900; }
h1 { font-size: clamp(26px, 3.6vw, 40px); }
h2 { font-size: clamp(20px, 2.4vw, 26px); }
h3 { font-size: 18px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.lead { font-size: clamp(17px, 2vw, 22px); color: var(--muted); font-weight: 700; }

/* ---------- Buttons ---------- */
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 18px; border-radius: var(--radius-sm);
  border: 2px solid transparent; font-weight: 800; font-size: 16px; white-space: nowrap;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow-press);
  transition: transform .08s ease, filter .12s ease;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--primary); color: var(--primary-ink); box-shadow: 0 3px 0 #2146A8; }
.btn.primary:active { box-shadow: 0 1px 0 #2146A8; }
.btn.ghost { background: var(--surface); border-color: var(--line); }
.btn.soft { background: var(--primary-soft); color: var(--primary); }
.btn.danger { background: #DC2626; color: #fff; box-shadow: 0 3px 0 #A11D1D; }
.btn.danger-ghost { background: var(--surface); color: #B42318; border-color: #F3C3C3; }
.btn.big { min-height: 64px; font-size: 20px; padding: 12px 28px; border-radius: 18px; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; border-radius: 11px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 48px; height: 48px; padding: 0;
  border-radius: 14px; border: 2px solid var(--line); background: var(--surface);
  font-size: 22px; line-height: 1; box-shadow: var(--shadow-press);
}
.icon-btn.big { width: 64px; height: 64px; font-size: 32px; border-radius: 18px; }
.icon-btn:active { transform: translateY(1px); }
:focus-visible { outline: 4px solid #8DB0FF; outline-offset: 2px; }

/* ---------- App bar ---------- */
.appbar {
  position: sticky; top: 0; z-index: 20; height: var(--appbar-h);
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  padding: 0 clamp(12px, 2.5vw, 28px);
  background: rgba(251, 246, 238, .92); backdrop-filter: blur(6px);
  border-bottom: 2px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 20px; }
.brand-mark { font-size: 24px; }
.appbar-center { display: flex; justify-content: center; min-width: 0; }
.appbar-right { display: flex; align-items: center; gap: 10px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 16px; border: 2px solid var(--line); overflow-x: auto; max-width: 100%; }
.tab { border: 0; background: transparent; padding: 9px 14px; border-radius: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; min-height: 42px; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.student-chip { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 20px; padding: 6px 14px 6px 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; }
.student-chip .animal { font-size: 30px; line-height: 1; }

/* Hold-to-open teacher button (keeps little fingers out) */
.teacher-gate { position: relative; overflow: hidden; }
.teacher-gate .fill { position: absolute; inset: 0; background: var(--primary-soft); transform-origin: left; transform: scaleX(0); z-index: 0; }
.teacher-gate.holding .fill { transform: scaleX(1); transition: transform 1s linear; }
.teacher-gate span { position: relative; z-index: 1; }

/* ---------- Layout ---------- */
main { padding: clamp(14px, 2.5vw, 28px); max-width: 1240px; margin: 0 auto; }
.screen { animation: fadeIn .18s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 2px solid var(--line); padding: clamp(16px, 2.5vw, 28px); }
.hero { text-align: center; margin: clamp(4px, 2vh, 22px) 0 clamp(16px, 3vh, 30px); display: grid; gap: 8px; }

/* ---------- Student picker ---------- */
.student-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 230px)); justify-content: center; gap: clamp(12px, 2vw, 22px); }
.student-card {
  display: grid; justify-items: center; gap: 6px; padding: 22px 12px 18px;
  border-radius: var(--radius); border: 3px solid var(--line); background: var(--surface);
  box-shadow: 0 4px 0 var(--line); font-weight: 900; font-size: 22px;
  transition: transform .1s ease;
}
.student-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.student-card .animal { font-size: clamp(64px, 9vw, 92px); line-height: 1.05; }
.student-card:nth-child(6n+1) { background: #FFF0F3; border-color: #F6C9D4; box-shadow: 0 4px 0 #F6C9D4; }
.student-card:nth-child(6n+2) { background: #EEF8EF; border-color: #BFE3C6; box-shadow: 0 4px 0 #BFE3C6; }
.student-card:nth-child(6n+3) { background: #FFF7E0; border-color: #F1D88E; box-shadow: 0 4px 0 #F1D88E; }
.student-card:nth-child(6n+4) { background: #EDF4FF; border-color: #BCD2F7; box-shadow: 0 4px 0 #BCD2F7; }
.student-card:nth-child(6n+5) { background: #F6EFFF; border-color: #D6C4F3; box-shadow: 0 4px 0 #D6C4F3; }
.student-card:nth-child(6n+6) { background: #FFF1E6; border-color: #F5CBA7; box-shadow: 0 4px 0 #F5CBA7; }

/* ---------- Library ---------- */
.library-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.library-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 900; font-size: clamp(22px, 3vw, 32px); }
.crumbs button { border: 0; background: none; padding: 4px 6px; border-radius: 10px; font-weight: 900; color: var(--primary); }
.crumbs .sep { color: var(--muted); font-weight: 700; }
.crumbs .here { padding: 4px 6px; }
.back-btn { margin-right: 6px; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: clamp(12px, 1.8vw, 20px); }
.card {
  position: relative; display: flex; flex-direction: column; text-align: left;
  min-height: 210px; padding: 0; border-radius: var(--radius); overflow: hidden;
  border: 2px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
}
.card-main { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 16px; border: 0; background: transparent; text-align: left; width: 100%; }
.card-main:active { background: rgba(0,0,0,.03); }
/* The whole picture is shown (contain), never cropped; empty space gets a soft background. */
.card .cover { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; border-radius: 14px; background: #fff; border: 2px solid var(--line); padding: 4px; }
.card .cover-placeholder { width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; background: var(--primary-soft); display: grid; place-items: center; font-size: 46px; }
.card .name { font-size: 21px; font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; }
.card .meta { font-size: 14px; font-weight: 800; color: var(--muted); }
.card.folder { background: var(--folder, #F8EDB8); border-color: rgba(0, 0, 0, .1); }
.card.folder .folder-icon { font-size: 58px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(255,255,255,.6)); }
.card.up { background: var(--surface-2); border-style: dashed; }
.card.up .folder-icon { font-size: 44px; }
.badge { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 900; }
.badge.visible { background: var(--good-soft); color: #13753A; }
.badge.hidden { background: var(--warn-soft); color: #8A5B08; }
.card-tools { display: flex; gap: 6px; padding: 0 12px 12px; }
.card-tools .btn { flex: 1; }
.card-tools .icon-btn { width: 38px; height: 38px; font-size: 18px; border-radius: 11px; flex: 0 0 auto; }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); font-weight: 800; font-size: 20px; display: grid; gap: 14px; justify-items: center; }
.empty .big-emoji { font-size: 72px; }

/* Student mode: bigger, simpler cards */
.mode-student .card { min-height: 230px; border-width: 3px; }
.mode-student .card .name { font-size: 24px; }
.mode-student .teacher-only { display: none !important; }
.mode-teacher .student-only { display: none !important; }

/* ---------- Menus / modals / toasts ---------- */
.menu { position: fixed; z-index: 60; min-width: 200px; padding: 6px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px rgba(30, 30, 60, .2); display: grid; }
.menu button { border: 0; background: none; text-align: left; padding: 12px 14px; border-radius: 10px; font-weight: 800; min-height: 46px; }
.menu button:hover, .menu button:focus-visible { background: var(--primary-soft); }
.menu button.danger { color: #B42318; }
.modal-back { position: fixed; inset: 0; z-index: 70; background: rgba(28, 36, 56, .45); display: grid; place-items: center; padding: 16px; }
.modal { width: min(520px, 100%); max-height: 90vh; overflow: auto; background: var(--surface); border-radius: var(--radius); padding: 22px; display: grid; gap: 14px; box-shadow: 0 30px 80px rgba(20, 20, 50, .3); }
.modal.wide { width: min(720px, 100%); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 90; display: grid; gap: 8px; width: min(520px, calc(100% - 24px)); pointer-events: none; }
.toast { padding: 12px 16px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 800; box-shadow: 0 10px 30px rgba(0,0,0,.2); transition: opacity .4s, transform .4s; }
.toast.error { background: #B42318; }
.toast.success { background: #15803D; }
.toast.out { opacity: 0; transform: translateY(8px); }

/* ---------- Forms ---------- */
.field { display: grid; gap: 6px; font-weight: 800; }
.field > span.hint { font-weight: 600; color: var(--muted); font-size: 14px; }
input[type=text], input[type=search], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--surface); font-weight: 600;
}
textarea { resize: vertical; min-height: 80px; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
.check { display: flex; align-items: center; gap: 10px; font-weight: 700; min-height: 40px; }
.check input { width: 22px; height: 22px; accent-color: var(--primary); }
.segmented { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); border: 2px solid var(--line); }
.segmented button { border: 0; background: transparent; border-radius: 10px; padding: 8px 12px; font-weight: 800; color: var(--muted); min-height: 40px; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.switch { display: flex; align-items: center; gap: 12px; font-weight: 800; cursor: pointer; }
.switch input { appearance: none; width: 54px; height: 32px; border-radius: 999px; background: #D5D9E2; position: relative; transition: background .15s; cursor: pointer; flex: 0 0 auto; margin: 0; }
.switch input::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.switch input:checked { background: var(--good); }
.switch input:checked::after { left: 26px; }
.palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.swatch { height: 48px; border-radius: 12px; border: 3px solid transparent; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 3px #fff; }
.animal-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
.animal-pick button { font-size: 30px; height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); }
.animal-pick button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }

/* ---------- Editor ---------- */
.editor-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.editor-top .name-input { flex: 1 1 260px; font-size: 22px; font-weight: 900; min-height: 56px; }
.editor-layout { display: grid; grid-template-columns: 290px 1fr; gap: 18px; align-items: start; }
.editor-side { display: grid; gap: 14px; position: sticky; top: calc(var(--appbar-h) + 14px); max-height: calc(100vh - var(--appbar-h) - 28px); overflow: auto; padding-bottom: 6px; }
.settings-grid { display: grid; gap: 14px; }
.q-list { display: grid; gap: 8px; }
.q-item { display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); text-align: left; min-height: 56px; }
.q-item .num { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); font-weight: 900; }
.q-item .txt { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-item[aria-current="true"] { border-color: var(--primary); background: var(--primary-soft); }
.q-item[aria-current="true"] .num { background: var(--primary); color: #fff; }
.q-item.problem .num { background: var(--bad-soft); color: #B42318; }
.q-editor { display: grid; gap: 16px; }
.q-editor-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.q-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.media-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.thumb { width: 84px; height: 84px; object-fit: contain; border-radius: 12px; border: 2px solid var(--line); background: #fff; }
.answers { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.answer { display: grid; gap: 10px; padding: 14px; border-radius: 18px; border: 3px solid var(--line); background: var(--surface-2); }
.answer.is-correct { border-color: #15803D; background: #F1FBF4; }
.answer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.answer-letter { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; color: #fff; }
.correct-toggle { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 900; min-height: 40px; color: var(--muted); }
.answer.is-correct .correct-toggle { background: #15803D; border-color: #15803D; color: #fff; }
.problem-box { padding: 12px 14px; border-radius: 14px; background: var(--bad-soft); color: #9F1D1D; font-weight: 800; }
.ok-box { padding: 12px 14px; border-radius: 14px; background: var(--good-soft); color: #13753A; font-weight: 800; }
.sub { padding: 12px; border-radius: 14px; background: var(--surface); border: 2px dashed var(--line); display: grid; gap: 10px; }

/* ---------- Teacher tool pages ---------- */
.tool-page { display: grid; gap: 18px; max-width: 860px; margin: 0 auto; }
.roster-list { display: grid; gap: 8px; }
.roster-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); }
.roster-row .animal { font-size: 34px; }
.roster-row .nm { flex: 1; font-weight: 900; font-size: 19px; }
.meter { height: 12px; border-radius: 999px; background: var(--surface-2); border: 2px solid var(--line); overflow: hidden; }
.meter > div { height: 100%; background: var(--primary); }
.letters { display: flex; gap: 8px; flex-wrap: wrap; }
.letters label { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 900; font-size: 24px; cursor: pointer; }
.letters input { position: absolute; opacity: 0; pointer-events: none; }
.letters label:has(input:checked) { background: var(--primary); color: #fff; border-color: var(--primary); }
.image-groups { display: grid; gap: 12px; }
.image-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

/* ---------- Player ---------- */
.player { position: fixed; inset: 0; z-index: 50; background: var(--bg); padding: clamp(6px, 1.2vw, 14px); }
.player-shell { height: 100%; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(6px, 1vh, 12px); }
.player-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; flex: 0 0 auto; }
.player-progress { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.dot { width: 18px; height: 18px; border-radius: 50%; background: #E3DACB; border: 2px solid #D6CAB5; }
.dot.done { background: var(--sun); border-color: #E7AE24; }
.dot.now { background: var(--primary); border-color: #2146A8; transform: scale(1.25); }
.progress-text { font-weight: 900; color: var(--muted); font-size: 18px; }
.speaker:disabled { visibility: hidden; }
.player-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 16px); }
.question { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(6px, 1.2vh, 14px); background: var(--surface); border: 3px solid var(--line); border-radius: 28px; padding: clamp(8px, 1.6vh, 20px); box-shadow: var(--shadow); }
.question-text { font-weight: 900; text-align: center; font-size: clamp(24px, 6vh, 64px); line-height: 1.1; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; }
.question.has-image .question-text { font-size: clamp(20px, 4.2vh, 44px); }
.question-image { flex: 1 1 auto; min-height: 0; max-width: 100%; object-fit: contain; border-radius: 16px; }
.options { flex: 0 0 44%; min-height: 0; display: grid; gap: clamp(8px, 1.2vw, 14px); grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 1), minmax(0, 1fr)); }
.options.five { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.options.five .option:nth-child(-n+3) { grid-column: span 2; }
.options.five .option:nth-child(4) { grid-column: 2 / span 2; }
.options.five .option:nth-child(5) { grid-column: 4 / span 2; }
.option {
  position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: clamp(6px, 1vw, 12px); border-radius: 24px; border: 3px solid rgba(0,0,0,.08); background: var(--pastel, #F8FBFF);
  box-shadow: 0 5px 0 rgba(0,0,0,.08); font-weight: 900; color: var(--ink); container-type: size; overflow: hidden;
  transition: transform .08s ease;
}
.option:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.08); }
.option:disabled { cursor: default; }
.option img { flex: 1 1 auto; min-height: 0; max-width: 100%; max-height: 100%; object-fit: contain; }
.option .label { line-height: 1.05; text-align: center; overflow-wrap: anywhere; max-width: 100%; font-size: clamp(18px, min(60cqi, 60cqh), 120px); }
.option.has-image .label { font-size: clamp(14px, min(14cqi, 18cqh), 44px); flex: 0 0 auto; }
.option.selected { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft), 0 5px 0 rgba(0,0,0,.08); }
.option.flash-correct { animation: flashGood 1s steps(2, end) 2; border-color: #15803D; }
.option.flash-incorrect { animation: flashBad 1s steps(2, end) 2; border-color: #B91C1C; }
@keyframes flashGood { 0%, 49.999% { background: var(--good); } 50%, 100% { background: #fff; } }
@keyframes flashBad { 0%, 49.999% { background: var(--bad); } 50%, 100% { background: #fff; } }
/* The speaker scales with its answer box (cqmin) so it never covers the answer on small screens. */

  <script>
/* js/store.js */
/* Little Learners Activities — data layer.
 *
 * Everything is saved in this browser's localStorage, using the SAME keys and
 * the SAME object shapes as V121, so quizzes and folders made in earlier
 * versions open here unchanged.
 *
 *   ll-activities-v10-templates  quizzes (type:'quiz') and older quick_sort templates
 *   ll-activities-v90-folders    folders {id, name, parentId, color}
 *   ll-demo-v2:<date>:red:<cfg>  daily Sonidos iniciales scores (unchanged from V121)
 *
 * New in V122 (new keys only, nothing old is rewritten):
 *   ll-v122-roster               students shown on the "¿Quién eres?" screen
 *   ll-v122-sonidos              Sonidos iniciales settings
 *   ll-v122-editor-draft         unsaved quiz-editor work, for recovery
 */
window.LL = window.LL || {};
(function () {
  const KEYS = {
    library: 'll-activities-v10-templates',
    folders: 'll-activities-v90-folders',
    roster: 'll-v122-roster',
    sonidos: 'll-v122-sonidos',
    draft: 'll-v122-editor-draft',
    pin: 'll-v122-pin',               // hashed teacher PIN for shared tablets
    voice: 'll-v122-voice',           // { enabled, voiceId } for the ElevenLabs voice
    settingsAt: 'll-v122-settings-at',
  };
  // Keys that are copied to the teacher's cloud account when signed in.
  const SYNCED = new Set([KEYS.library, KEYS.folders, KEYS.roster, KEYS.sonidos, KEYS.pin, KEYS.voice]);
  const SETTINGS = new Set([KEYS.roster, KEYS.sonidos, KEYS.pin, KEYS.voice]);
  let applyingRemote = false;
  /** Run fn without telling the sync module (used when applying data downloaded from the cloud). */
  function quietly(fn) { applyingRemote = true; try { return fn(); } finally { applyingRemote = false; } }
  const nowISO = () => new Date().toISOString();

  const DEFAULT_ROSTER = [
    { name: 'Abigail', animal: '🐱' }, { name: 'Daniel', animal: '🦖' },
    { name: 'Camila', animal: '🦋' }, { name: 'Lucas', animal: '🦆' },
    { name: 'Emma', animal: '🐼' }, { name: 'Mateo', animal: '🐸' },
  ];

  const DEFAULT_SONIDOS = {
    lang: 'es', per: 8, speed: 45, mode: 'practice',
    letters: ['M', 'P', 'S', 'L', 'F'], fixedImages: null, showToStudents: false,
  };

  const FOLDER_COLORS = [
    ['Rosa', '#F6D6D6'], ['Melocotón', '#F9DEC9'], ['Amarillo', '#F8EDB8'],
    ['Verde menta', '#CDEBDD'], ['Verde suave', '#DCECCB'], ['Celeste', '#CFE8F7'],
    ['Azul lavanda', '#D9DDF7'], ['Lila', '#E9D5F5'], ['Lavanda rosada', '#F3D8E8'],
    ['Gris claro', '#E7E9ED'],
  ];

  const ANIMALS = ['🐱', '🐶', '🦖', '🦆', '🐸', '🐼', '🦋', '🦁', '🐰', '🐻', '🐨', '🐯', '🐵', '🐧', '🐢', '🐙', '🦄', '🐝', '🐞', '🦊', '🐮', '🐷', '🐳', '🦒'];

  function readJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw == null) return fallback;
      const v = JSON.parse(raw);
      return v == null ? fallback : v;
    } catch { return fallback; }
  }

  function writeJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      if (!applyingRemote && SYNCED.has(key)) {
        if (SETTINGS.has(key)) localStorage.setItem(KEYS.settingsAt, JSON.stringify(nowISO()));
        if (LL.sync) LL.sync.schedule();
      }
      return true;
    } catch (e) {
      LL.ui && LL.ui.toast('No se pudo guardar. El almacenamiento del navegador podría estar lleno.', 'error');
      console.warn('Save failed', key, e);
      return false;
    }
  }

  const clone = (x) => JSON.parse(JSON.stringify(x));
  const uid = (prefix) => prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'es', { sensitivity: 'base' });

  /* ---------- Library (quizzes) ---------- */
  function readLibrary() {
    const a = readJSON(KEYS.library, []);
    return Array.isArray(a) ? a : [];
  }
  function writeLibrary(a) { return writeJSON(KEYS.library, a); }

  /** Latest version of every quiz family (same rule as V121). */
  function quizzes() {
    const latest = new Map();
    for (const t of readLibrary()) {
      if (t.type !== 'quiz') continue;
      const fam = t.familyId || t.id;
      const old = latest.get(fam);
      if (!old || Number(t.version) > Number(old.version)) {
        latest.set(fam, old ? { ...t, folderId: t.folderId || old.folderId || null } : t);
      } else if (!old.folderId && t.folderId) {
        old.folderId = t.folderId;
      }
    }
    return [...latest.values()].sort(byName);
  }

  function getQuiz(id) { return quizzes().find((q) => q.id === id) || null; }

  /** A quiz is shown to students only when it is marked visible and has questions. */
  function isReady(q) {
    return q && q.config && q.config.visibility === 'visible' &&
      Array.isArray(q.config.questions) && q.config.questions.length > 0;
  }

  /** Create or update a quiz in place (V121 behavior: same id, same version). */
  function saveQuiz(quiz) {
    const all = readLibrary();
    const now = new Date().toISOString();
    const idx = quiz.id ? all.findIndex((x) => x.id === quiz.id && x.type === 'quiz') : -1;
    if (idx >= 0) {
      all[idx] = { ...all[idx], name: quiz.name, config: clone(quiz.config), updatedAt: now };
    } else {
      const id = uid('quiz');
      quiz.id = id;
      all.push({ id, familyId: id, type: 'quiz', name: quiz.name, version: 1, folderId: quiz.folderId || null, config: clone(quiz.config), createdAt: now, updatedAt: now });
    }
    return writeLibrary(all) ? quiz.id : null;
  }

  function duplicateQuiz(id) {
    const q = getQuiz(id);
    if (!q) return null;
    const names = new Set(quizzes().map((x) => x.name));
    let name = q.name + ' (copia)', n = 2;
    while (names.has(name)) name = q.name + ' (copia ' + (n++) + ')';
    const copy = { name, folderId: q.folderId || null, config: { ...clone(q.config), visibility: 'hidden' } };
    return saveQuiz(copy);
  }

  /** Deletes every saved version of the quiz, so an older one can't reappear. */
  function deleteQuiz(id) {
    const all = readLibrary();
    const t = all.find((x) => x.id === id);
    if (!t) return false;
    const fam = t.familyId || t.id;
    return writeLibrary(all.filter((x) => (x.familyId || x.id) !== fam));
  }

  function moveQuiz(id, folderId) {
    const all = readLibrary();
    const t = all.find((x) => x.id === id);
    if (!t) return false;
    const fam = t.familyId || t.id;
    const now = nowISO();
    all.forEach((x) => { if ((x.familyId || x.id) === fam) { x.folderId = folderId || null; x.updatedAt = now; } });
    return writeLibrary(all);
  }

  /* ---------- Folders ---------- */
  function folders() {
    const a = readJSON(KEYS.folders, []);
    return Array.isArray(a) ? a : [];
  }
  function writeFolders(a) { return writeJSON(KEYS.folders, a); }
  function getFolder(id) { return folders().find((f) => f.id === id) || null; }

  function saveFolder(folder) {
    const all = folders();
    const f = folder.id && all.find((x) => x.id === folder.id);
    if (f) { f.name = folder.name; f.color = folder.color; f.updatedAt = nowISO(); }
    else all.push({ id: 'folder-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), name: folder.name, parentId: folder.parentId || null, color: folder.color, updatedAt: nowISO() });
    return writeFolders(all);
  }

  /** Delete a folder; anything inside moves up to its parent so nothing is lost. */
  function deleteFolder(id) {
    const all = folders();
    const f = all.find((x) => x.id === id);
    if (!f) return false;
    const parent = f.parentId || null;
    const now = nowISO();
    all.forEach((x) => { if (x.parentId === id) { x.parentId = parent; x.updatedAt = now; } });
    const lib = readLibrary();
    lib.forEach((x) => { if (x.folderId === id) { x.folderId = parent; x.updatedAt = now; } });
    return writeLibrary(lib) && writeFolders(all.filter((x) => x.id !== id));
  }

  function moveFolder(id, parentId) {
    const all = folders();
    const f = all.find((x) => x.id === id);
    if (!f) return false;
    // Prevent moving a folder inside itself or one of its own subfolders.
    let p = parentId;
    while (p) { if (p === id) return false; p = (all.find((x) => x.id === p) || {}).parentId; }
    f.parentId = parentId || null;
    f.updatedAt = nowISO();
    return writeFolders(all);
  }

  /** ["Mis actividades", "Español", "Letras"] style trail for a folder id. */
  function folderTrail(id) {
    const all = folders(), trail = [];
    let cur = id, guard = 0;
    while (cur && guard++ < 50) {
      const f = all.find((x) => x.id === cur);
      if (!f) break;
      trail.unshift(f);
      cur = f.parentId;
    }
    return trail;
  }

  function folderPathLabel(f) { return folderTrail(f.id).map((x) => x.name).join(' / '); }

  /** True when the folder (or any subfolder) contains at least one of `entries`. */
  function folderHas(id, allFolders, entries) {
    return entries.some((t) => (t.folderId || null) === id) ||
      allFolders.some((f) => (f.parentId || null) === id && folderHas(f.id, allFolders, entries));
  }

  /* ---------- Roster ---------- */
  function roster() {
    const r = readJSON(KEYS.roster, null);
    return Array.isArray(r) ? r : clone(DEFAULT_ROSTER);
  }
  function saveRoster(r) { return writeJSON(KEYS.roster, r); }

  /* ---------- Sonidos iniciales ---------- */
  function sonidos() { return { ...DEFAULT_SONIDOS, ...readJSON(KEYS.sonidos, {}) }; }
  function saveSonidos(s) { return writeJSON(KEYS.sonidos, s); }

  function todayChicago() {
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    const v = Object.fromEntries(parts.map((p) => [p.type, p.value]));
    return `${v.year}-${v.month}-${v.day}`;
  }
  // Same key format as V121, so today's ranking keeps working.
  function sonidosScoreKey(c) {
    return 'll-demo-v2:' + todayChicago() + ':red:' + JSON.stringify([c.lang, c.per, c.letters.slice().sort(), c.mode]);
  }
  function sonidosScores(c) { return readJSON(sonidosScoreKey(c), {}); }
  function saveSonidosScores(c, data) { return writeJSON(sonidosScoreKey(c), data); }

  /* ---------- Teacher PIN and voice ---------- */
  function pinHash() { return readJSON(KEYS.pin, null); }
  function savePinHash(h) { return writeJSON(KEYS.pin, h || null); }
  function voice() { return { enabled: true, voiceId: '', ...readJSON(KEYS.voice, {}) }; }
  function saveVoice(v) { return writeJSON(KEYS.voice, v); }
  function settingsAt() { return readJSON(KEYS.settingsAt, null); }

  /* ---------- Draft (unsaved editor work) ---------- */
  function readDraft() { return readJSON(KEYS.draft, null); }
  function writeDraft(d) { try { localStorage.setItem(KEYS.draft, JSON.stringify(d)); } catch { /* best effort */ } }
  function clearDraft() { try { localStorage.removeItem(KEYS.draft); } catch { /* ignore */ } }

  /* ---------- Backup ---------- */
  const BACKUP_KEYS = [KEYS.library, KEYS.folders, KEYS.roster, KEYS.sonidos];

  function exportBackup(folderId) {
    let lib = readLibrary(), fol = folders();
    if (folderId) {
      // Export one folder (with its subfolders and quizzes) to share with another teacher.
      const ids = new Set([folderId]);
      let grew = true;
      while (grew) { grew = false; for (const f of fol) if (f.parentId && ids.has(f.parentId) && !ids.has(f.id)) { ids.add(f.id); grew = true; } }
      fol = fol.filter((f) => ids.has(f.id)).map((f) => (f.id === folderId ? { ...f, parentId: null } : f));
      lib = lib.filter((t) => t.type === 'quiz' && ids.has(t.folderId));
      return { app: 'little-learners-activities', format: 1, exportedAt: new Date().toISOString(), kind: 'folder', data: { [KEYS.library]: lib, [KEYS.folders]: fol } };
    }
    const data = {};
    for (const k of BACKUP_KEYS) { const v = readJSON(k, null); if (v != null) data[k] = v; }
    return { app: 'little-learners-activities', format: 1, exportedAt: new Date().toISOString(), kind: 'all', data };
  }

  function validateBackup(b) {
    return b && b.app === 'little-learners-activities' && b.data && typeof b.data === 'object';
  }

  /** mode 'merge' adds/updates by id; mode 'replace' overwrites everything in the file. */
  function importBackup(b, mode) {
    if (!validateBackup(b)) throw new Error('Este archivo no es un respaldo de Little Learners Activities.');
    const d = b.data;
    const mergeById = (current, incoming) => {
      const map = new Map(current.map((x) => [x.id, x]));
      for (const x of incoming) {
        const old = map.get(x.id);
        if (!old || !old.updatedAt || !x.updatedAt || x.updatedAt >= old.updatedAt) map.set(x.id, x);
      }
      return [...map.values()];
    };
    const counts = { quizzes: 0, folders: 0 };
    if (Array.isArray(d[KEYS.library])) {
      counts.quizzes = d[KEYS.library].filter((x) => x.type === 'quiz').length;
      writeLibrary(mode === 'replace' ? d[KEYS.library] : mergeById(readLibrary(), d[KEYS.library]));
    }
    if (Array.isArray(d[KEYS.folders])) {
      counts.folders = d[KEYS.folders].length;
      writeFolders(mode === 'replace' ? d[KEYS.folders] : mergeById(folders(), d[KEYS.folders]));
    }
    if (Array.isArray(d[KEYS.roster])) {
      if (mode === 'replace') saveRoster(d[KEYS.roster]);
      else {
        const r = roster();
        for (const s of d[KEYS.roster]) if (!r.some((x) => x.name.toLowerCase() === String(s.name).toLowerCase())) r.push(s);
        saveRoster(r);
      }
    }
    if (d[KEYS.sonidos] && mode === 'replace') saveSonidos(d[KEYS.sonidos]);
    return counts;
  }

  /** Approximate bytes used by this app in localStorage. */
  function storageUsed() {
    let n = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('ll-')) n += (k.length + (localStorage.getItem(k) || '').length) * 2;
      }
    } catch { /* ignore */ }
    return n;
  }

  /** Removes every Little Learners key (all versions) from this browser. */
  function deleteAllData() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('ll-')) keys.push(k); }
    keys.forEach((k) => localStorage.removeItem(k));
    // Keep the student list empty instead of falling back to the demo names.
    quietly(() => writeJSON(KEYS.roster, []));
    return keys.length;
  }

  /* ---------- Quiz helpers ---------- */
  function newOption() {
    return { id: uid('quiz'), text: '', readTextEnabled: false, readText: '', audioMode: 'none', image: '', audio: '', correct: false };
  }
  function newQuestion(optionCount = 4) {
    return { id: uid('quiz'), text: '', readTextEnabled: false, readText: '', audioMode: 'voice', emoji: '', image: '', audio: '', correctCount: 1, options: Array.from({ length: optionCount }, newOption) };
  }
  function newQuiz(folderId) {
    return { id: null, name: '', folderId: folderId || null, config: { lang: 'es', mode: 'practice', questionOrder: 'fixed', answerOrder: 'fixed', visibility: 'hidden', coverImage: '', questions: [newQuestion()] } };
  }

  /** Returns '' when the question is complete, otherwise a short message. Same rules as V121. */
  function questionProblem(q) {
    const visible = String(q.text || '').trim() || String(q.image || '').trim() || String(q.emoji || '').trim();
    const altVoice = q.readTextEnabled && String(q.readText || '').trim() && (q.audioMode || 'voice') === 'voice';
    const fileAudio = q.audioMode === 'file' && String(q.audio || '').startsWith('data:audio/');
    if (!(visible || altVoice || fileAudio)) return 'Escribe la pregunta, agrega una imagen o un audio.';
    if (q.options.length < 2 || q.options.length > 6) return 'Cada pregunta necesita de 2 a 6 respuestas.';
    const empty = q.options.map((o, i) => (!(String(o.text || '').trim() || o.image || o.audio) ? String.fromCharCode(65 + i) : null)).filter(Boolean);
    if (empty.length) return 'Completa la respuesta ' + empty.join(', ') + '.';
    const correct = q.options.filter((o) => o.correct).length;
    if (correct === 0) return 'Marca cuál es la respuesta correcta.';
    if (correct > 2) return 'Marca como máximo 2 respuestas correctas.';
    if (q.options.length === 2 && correct > 1) return 'Con 2 respuestas, solo una puede ser correcta.';
    return '';
  }

  LL.store = {
    KEYS, FOLDER_COLORS, ANIMALS, clone, uid, byName,
    readLibrary, quizzes, getQuiz, isReady, saveQuiz, duplicateQuiz, deleteQuiz, moveQuiz,
    folders, getFolder, saveFolder, deleteFolder, moveFolder, folderTrail, folderPathLabel, folderHas,
    roster, saveRoster, sonidos, saveSonidos, pinHash, savePinHash, voice, saveVoice, settingsAt, quietly, readJSON, writeJSON, writeLibrary, writeFolders, sonidosScores, saveSonidosScores, todayChicago,
    readDraft, writeDraft, clearDraft,
    exportBackup, importBackup, validateBackup, storageUsed, deleteAllData,
    newOption, newQuestion, newQuiz, questionProblem,
  };
})();

  <script>
/* js/ui.js */
/* Shared UI helpers: element builder, dialogs, toasts, media and sound. */
window.LL = window.LL || {};
(function () {
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  /** el('button.btn.primary', {onclick, type:'button'}, 'Texto', childNode) */
  function el(spec, props, ...children) {
    const [head, ...classes] = spec.split('.');
    let id = null;
    if (classes.length && classes[classes.length - 1].includes('#')) { const [c, i] = classes.pop().split('#'); classes.push(c); id = i; }
    const [tag, hid] = head.split('#');
    const node = document.createElement(tag || 'div');
    if (hid || id) node.id = hid || id;
    if (classes.length) node.className = classes.join(' ');
    if (props && (typeof props !== 'object' || props instanceof Node || Array.isArray(props))) { children.unshift(props); props = null; }
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else if (k === 'dataset') Object.assign(node.dataset, v);
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k in node && typeof v !== 'string') node[k] = v;
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat()) if (c != null && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return node;
  }

  /* ---------- Toasts ---------- */
  function toast(message, kind = 'info') {
    let host = $('#toasts');
    if (!host) { host = el('div', { id: 'toasts', 'aria-live': 'polite' }); document.body.append(host); }
    const t = el('div.toast.' + kind, { role: kind === 'error' ? 'alert' : 'status' }, message);
    host.append(t);
    setTimeout(() => t.classList.add('out'), 3200);
    setTimeout(() => t.remove(), 3700);
  }

  /* ---------- Dialogs ---------- */
  function dialog({ title, body, actions, wide }) {
    return new Promise((resolve) => {
      const back = el('div.modal-back');
      const box = el('div.modal' + (wide ? '.wide' : ''), { role: 'dialog', 'aria-modal': 'true', 'aria-label': title || 'Diálogo' });
      if (title) box.append(el('h2', title));
      if (body) box.append(body instanceof Node ? body : el('p.muted', body));
      const row = el('div.modal-actions');
      const opener = document.activeElement;
      const close = (v) => { back.remove(); document.removeEventListener('keydown', onKey, true); if (opener && opener.isConnected) opener.focus(); resolve(v); };
      for (const a of actions) row.append(el('button.btn' + (a.kind ? '.' + a.kind : ''), { type: 'button', onclick: () => { const v = a.value instanceof Function ? a.value() : a.value; if (v !== undefined) close(v); } }, a.label));
      box.append(row);
      back.append(box);
      back.addEventListener('click', (e) => { if (e.target === back) close(null); });
      // Escape closes; Tab stays inside the dialog (keyboard users don't get lost behind it).
      const onKey = (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); close(null); return; }
        if (e.key !== 'Tab') return;
        const f = [...box.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter((x) => !x.disabled && x.offsetParent !== null);
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      };
      document.addEventListener('keydown', onKey, true);
      document.body.append(back);
      setTimeout(() => { const f = box.querySelector('input,select,textarea') || row.lastChild; f && f.focus(); }, 30);
    });
  }

  const confirmDialog = (title, message, okLabel = 'Aceptar', danger = false) =>
    dialog({ title, body: message, actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: okLabel, kind: danger ? 'danger' : 'primary', value: true }] });

  /* ---------- Media ---------- */
  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result || ''));
      r.onerror = () => reject(new Error('No se pudo leer el archivo.'));
      r.readAsDataURL(file);
    });
  }

  /** Shrinks an image so it fits in `max` px and stores it as JPEG (saves browser space). */
  async function imageFileToDataURL(file, max = 1200, quality = 0.82) {
    if (!file || !file.type.startsWith('image/')) throw new Error('Elige un archivo de imagen.');
    if (file.size > 15 * 1024 * 1024) throw new Error('La imagen es muy grande (más de 15 MB).');
    const src = await readFileAsDataURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo abrir esa imagen.')); i.src = src; });
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * scale));
    c.height = Math.max(1, Math.round(img.height * scale));
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); // transparent PNGs get a white background
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', quality);
  }

  async function audioFileToDataURL(file) {
    if (!file || !file.type.startsWith('audio/')) throw new Error('Elige un archivo de audio.');
    if (file.size > 5 * 1024 * 1024) throw new Error('El audio debe pesar 5 MB o menos.');
    return readFileAsDataURL(file);
  }

  function pickFile(accept) {
    return new Promise((resolve) => {
      const input = el('input', { type: 'file', accept, style: { display: 'none' } });
      input.addEventListener('change', () => { resolve(input.files && input.files[0] || null); input.remove(); });
      document.body.append(input);
      input.click();
    });
  }

  function download(filename, text) {
    const a = el('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: filename });
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  /* ---------- Sound ---------- */
  function speak(text, lang) {
    if (!text || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = lang === 'en' ? 'en-US' : 'es-ES';
      u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch (e) { console.warn('speech failed', e); }
  }

  let currentAudio = null;
  function playAudio(src) {
    stopSound();
    if (!src) return;
    currentAudio = new Audio(src);
    currentAudio.play().catch(() => {});
  }
  function stopSound() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  }

  // One shared AudioContext (creating one per answer can fail on low-end tablets).
  let audioCtx = null;
  /** Correct = bright "magic wand" notes (V112). Wrong = game-show buzzer, ~1.5 s (V120). */
  function feedbackTone(isCorrect) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx || audioCtx.state === 'closed') audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      const now = audioCtx.currentTime;
      const notes = isCorrect
        ? [{ f: 783.99, t: 0, d: 0.12, level: 0.1125, type: 'sine' }, { f: 987.77, t: 0.075, d: 0.14, level: 0.1125, type: 'sine' }, { f: 1174.66, t: 0.15, d: 0.16, level: 0.1125, type: 'sine' }, { f: 1567.98, t: 0.22, d: 0.2, level: 0.09, type: 'sine' }, { f: 2349.32, t: 0.19, d: 0.12, level: 0.045, type: 'sine' }]
        : [{ f: 185, t: 0, d: 1.46, level: 0.16, type: 'square' }, { f: 155.56, t: 0.025, d: 1.42, level: 0.12, type: 'sawtooth' }];
      for (const n of notes) {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = n.type;
        osc.frequency.setValueAtTime(n.f, now + n.t);
        gain.gain.setValueAtTime(0.0001, now + n.t);
        gain.gain.exponentialRampToValueAtTime(n.level, now + n.t + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + n.t); osc.stop(now + n.t + n.d + 0.02);
      }
    } catch { /* sound is optional */ }
  }

  function shuffle(a) {
    const r = [...a];
    for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
    return r;
  }

  /* iPhone/iPad only allow sound after a tap. On the first tap anywhere we
   * "unlock" speech and Web Audio so later automatic reading works. */
  function unlockSound() {
    document.removeEventListener('pointerdown', unlockSound, true);
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx && !audioCtx) audioCtx = new Ctx();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    } catch { /* ignore */ }
    try { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch { /* ignore */ }
  }
  document.addEventListener('pointerdown', unlockSound, true);

  /** Small confetti burst from a point (or the screen center). DOM-only, ~1 s. */
  function confetti(x, y, count = 26) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['#FFC94D', '#2F5BD3', '#22C55E', '#F472B6', '#FB923C', '#38BDF8'];
    const box = el('div.confetti', { 'aria-hidden': 'true' });
    const cx = x != null ? x : innerWidth / 2, cy = y != null ? y : innerHeight / 2;
    for (let i = 0; i < count; i++) {
      const star = i % 6 === 0;
      const p = el('i' + (star ? '.star' : ''), star ? '⭐' : null);
      const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 220;
      p.style.left = cx + 'px'; p.style.top = cy + 'px';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist + 120 + 'px');
      p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      p.style.setProperty('--dur', (0.9 + Math.random() * 0.6) + 's');
      box.append(p);
    }
    document.body.append(box);
    setTimeout(() => box.remove(), 1700);
  }

  /** Give the children of a container a staggered "pop in". */
  function stagger(container) {
    container.classList.remove('animate-in');
    [...container.children].forEach((c, i) => c.style.setProperty('--i', String(Math.min(i, 14))));
    void container.offsetWidth;
    container.classList.add('animate-in');
  }

  LL.ui = { $, $$, el, toast, dialog, confirmDialog, readFileAsDataURL, imageFileToDataURL, audioFileToDataURL, pickFile, download, formatBytes, speak, playAudio, stopSound, feedbackTone, shuffle, confetti, stagger };
})();

  <script>
/* js/cloud.js */
/* Minimal Supabase client (sign-in, database, storage, functions) using plain fetch.
 * No outside script is loaded. The publishable key in config.js is meant to be
 * public; what each teacher can read or change is enforced by the database
 * (row-level security), not by this file. */
window.LL = window.LL || {};
(function () {
  const SESSION_KEY = 'll-v122-session';
  const cfg = () => LL.config || {};
  const enabled = () => !!(cfg().supabaseUrl && cfg().supabaseKey);
  const base = () => String(cfg().supabaseUrl).replace(/\/$/, '');

  function readSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch { return null; } }
  function writeSession(s) { try { if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); } catch { /* ignore */ } }

  class CloudError extends Error { constructor(msg, status, code) { super(msg); this.status = status; this.code = code; } }

  async function call(path, { method = 'GET', body, token, headers = {}, raw = false } = {}) {
    const h = { apikey: cfg().supabaseKey, ...headers };
    if (token) h.Authorization = 'Bearer ' + token;
    if (body !== undefined && !(body instanceof Blob)) h['Content-Type'] = 'application/json';
    let res;
    try {
      res = await fetch(base() + path, { method, headers: h, body: body === undefined ? undefined : (body instanceof Blob ? body : JSON.stringify(body)) });
    } catch (e) {
      throw new CloudError('Sin conexión a internet.', 0, 'offline');
    }
    if (raw) { if (!res.ok) throw new CloudError('Error ' + res.status, res.status); return res; }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    if (!res.ok) {
      const msg = (data && (data.error_description || data.msg || data.message || data.error)) || ('Error ' + res.status);
      throw new CloudError(String(msg), res.status, data && (data.error_code || data.code || data.error));
    }
    return data;
  }

  function storeTokens(d) {
    const s = {
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: d.expires_at || Math.floor(Date.now() / 1000) + Number(d.expires_in || 3600),
      user: d.user ? { id: d.user.id, email: d.user.email } : (readSession() || {}).user,
    };
    writeSession(s);
    return s;
  }

  /* ---------- Auth ---------- */
  async function signIn(email, password) {
    const d = await call('/auth/v1/token?grant_type=password', { method: 'POST', body: { email, password } });
    return storeTokens(d);
  }

  let refreshing = null;
  async function refresh() {
    const s = readSession();
    if (!s || !s.refresh_token) throw new CloudError('No hay sesión.', 401, 'no_session');
    if (!refreshing) {
      refreshing = call('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: s.refresh_token } })
        .then(storeTokens)
        .catch((e) => { if (e.status === 400 || e.status === 401) writeSession(null); throw e; })
        .finally(() => { refreshing = null; });
    }
    return refreshing;
  }

  /** A valid access token, refreshed when it is about to expire. */
  async function token() {
    const s = readSession();
    if (!s) throw new CloudError('No hay sesión.', 401, 'no_session');
    if (s.expires_at - 60 < Date.now() / 1000) return (await refresh()).access_token;
    return s.access_token;
  }

  async function signOut() {
    const s = readSession();
    writeSession(null);
    if (s) { try { await call('/auth/v1/logout', { method: 'POST', token: s.access_token }); } catch { /* already signed out */ } }
  }

  function redirectUrl() {
    if (/^https?:/.test(location.protocol)) return location.origin + location.pathname;
    return cfg().siteUrl || '';
  }

  async function sendPasswordReset(email) {
    const rt = redirectUrl();
    await call('/auth/v1/recover' + (rt ? '?redirect_to=' + encodeURIComponent(rt) : ''), { method: 'POST', body: { email } });
  }

  async function setPassword(password) {
    return call('/auth/v1/user', { method: 'PUT', token: await token(), body: { password } });
  }

  /** Handles links from invitation / password-reset emails (#access_token=…&type=invite). */
  async function handleRedirect() {
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));
    if (h.get('error') || h.get('error_description')) {
      history.replaceState(null, '', location.pathname + location.search);
      return { error: h.get('error_description') || h.get('error') };
    }
    if (!h.get('access_token')) return null;
    const s = storeTokens({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_in: h.get('expires_in'), expires_at: Number(h.get('expires_at')) || undefined });
    history.replaceState(null, '', location.pathname + location.search);
    try {
      const u = await call('/auth/v1/user', { token: s.access_token });
      s.user = { id: u.id, email: u.email };
      writeSession(s);
    } catch { /* keep tokens; user info fills in later */ }
    return { type: h.get('type') || 'signin' };
  }

  function user() { const s = readSession(); return s && s.user ? s.user : null; }
  function signedIn() { return enabled() && !!readSession(); }

  /* ---------- Database (PostgREST) ---------- */
  async function select(table, query) {
    return call('/rest/v1/' + table + '?' + query, { token: await token() });
  }
  async function upsert(table, rows, onConflict) {
    if (!rows.length) return [];
    return call('/rest/v1/' + table + '?on_conflict=' + onConflict, { method: 'POST', token: await token(), body: rows, headers: { Prefer: 'resolution=merge-duplicates,return=minimal' } });
  }
  async function patch(table, query, body) {
    return call('/rest/v1/' + table + '?' + query, { method: 'PATCH', token: await token(), body, headers: { Prefer: 'return=minimal' } });
  }
  async function remove(table, query) {
    return call('/rest/v1/' + table + '?' + query, { method: 'DELETE', token: await token(), headers: { Prefer: 'return=minimal' } });
  }

  /* ---------- Storage & functions ---------- */
  async function download(bucket, path) {
    const res = await call('/storage/v1/object/authenticated/' + bucket + '/' + path.split('/').map(encodeURIComponent).join('/'), { token: await token(), raw: true });
    return res.blob();
  }
  async function listFiles(bucket, prefix) {
    return call('/storage/v1/object/list/' + bucket, { method: 'POST', token: await token(), body: { prefix, limit: 1000, offset: 0 } });
  }
  async function removeFiles(bucket, paths) {
    if (!paths.length) return null;
    return call('/storage/v1/object/' + bucket, { method: 'DELETE', token: await token(), body: { prefixes: paths } });
  }
  async function invoke(name, body) {
    return call('/functions/v1/' + name, { method: 'POST', token: await token(), body });
  }

  LL.cloud = { enabled, signIn, signOut, refresh, token, sendPasswordReset, setPassword, handleRedirect, user, signedIn, select, upsert, patch, remove, download, listFiles, removeFiles, invoke, CloudError };
})();

  <script>
/* js/sync.js */
/* Cloud sync. The app keeps working from this browser's local copy (fast, works
 * offline); when a teacher is signed in, changes are uploaded in the background
 * and changes made on other devices are downloaded.
 *
 * Rules:
 *  - Each quiz / folder is one row. The newest `updatedAt` wins.
 *  - Deleting marks the row as deleted, so other tablets remove it too.
 *  - Downloads use the server's own clock (server_updated_at), so a tablet
 *    with a wrong clock still gets everything. */
window.LL = window.LL || {};
(function () {
  const S = LL.store;
  const STATE_KEY = 'll-v122-sync';
  const EPOCH = '1970-01-01T00:00:00Z';
  let timer = null, running = null, again = false;
  const listeners = new Set();

  const ts = (x) => { const n = Date.parse(x || ''); return Number.isFinite(n) ? n : 0; };
  const iso = (x) => (ts(x) ? new Date(ts(x)).toISOString() : null);

  function state() {
    const s = S.readJSON(STATE_KEY, null) || {};
    return { owner: s.owner || null, pulledQ: s.pulledQ || EPOCH, pulledF: s.pulledF || EPOCH, pulledS: s.pulledS || EPOCH, q: s.q || {}, f: s.f || {}, settings: s.settings || null, lastOk: s.lastOk || null, error: s.error || null };
  }
  function saveState(st) { try { localStorage.setItem(STATE_KEY, JSON.stringify(st)); } catch { /* ignore */ } }

  function status() {
    const st = state();
    return { signedIn: LL.cloud.signedIn(), lastOk: st.lastOk, error: st.error, busy: !!running, pending: !!timer };
  }
  function emit() { listeners.forEach((fn) => { try { fn(status()); } catch { /* ignore */ } }); }
  function onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  /** Called by the store after every local change. */
  function schedule(delay = 1500) {
    if (!LL.cloud.signedIn()) return;
    clearTimeout(timer);
    timer = setTimeout(() => { timer = null; run(); }, delay);
    emit();
  }

  function run() {
    if (!LL.cloud.signedIn()) return Promise.resolve(false);
    if (running) { again = true; return running; }
    running = (async () => {
      const st = state();
      const me = LL.cloud.user();
      if (!me) { await LL.cloud.refresh(); }
      st.owner = (LL.cloud.user() || {}).id || st.owner;
      try {
        const changed = await pull(st);
        await push(st);
        st.lastOk = new Date().toISOString();
        st.error = null;
        saveState(st);
        if (changed) document.dispatchEvent(new CustomEvent('ll-synced', { detail: { changed } }));
        return true;
      } catch (e) {
        st.error = e.code === 'offline' ? 'offline' : (e.message || 'error');
        saveState(st);
        console.warn('sync failed', e);
        if (e.status === 401) { /* session expired and could not refresh */ document.dispatchEvent(new Event('ll-signed-out')); }
        return false;
      }
    })().finally(() => {
      running = null;
      emit();
      if (again) { again = false; run(); }
    });
    emit();
    return running;
  }

  /* ---------- Download ---------- */
  async function pull(st) {
    let changed = 0;
    // Quizzes
    const qs = await LL.cloud.select('ll_quizzes', 'select=id,family_id,type,name,version,folder_id,config,created_at,updated_at,deleted_at,server_updated_at&server_updated_at=gt.' + encodeURIComponent(st.pulledQ) + '&order=server_updated_at.asc&limit=1000');
    if (qs && qs.length) {
      const lib = S.readLibrary();
      for (const r of qs) {
        const i = lib.findIndex((x) => x.id === r.id);
        if (r.deleted_at) {
          if (i >= 0 && ts(lib[i].updatedAt) <= ts(r.deleted_at)) { lib.splice(i, 1); changed++; }
          delete st.q[r.id];
        } else if (i < 0 || ts(r.updated_at) > ts(lib[i].updatedAt)) {
          const entry = { id: r.id, familyId: r.family_id || r.id, type: r.type, name: r.name, version: r.version, folderId: r.folder_id || null, config: r.config || {}, createdAt: iso(r.created_at), updatedAt: iso(r.updated_at) };
          if (i >= 0) lib[i] = entry; else lib.push(entry);
          st.q[r.id] = entry.updatedAt;
          changed++;
        }
        st.pulledQ = r.server_updated_at;
      }
      S.quietly(() => S.writeLibrary(lib));
    }
    // Folders
    const fs = await LL.cloud.select('ll_folders', 'select=id,name,parent_id,color,updated_at,deleted_at,server_updated_at&server_updated_at=gt.' + encodeURIComponent(st.pulledF) + '&order=server_updated_at.asc&limit=1000');
    if (fs && fs.length) {
      const all = S.folders();
      for (const r of fs) {
        const i = all.findIndex((x) => x.id === r.id);
        if (r.deleted_at) {
          if (i >= 0 && ts(all[i].updatedAt) <= ts(r.deleted_at)) { all.splice(i, 1); changed++; }
          delete st.f[r.id];
        } else if (i < 0 || ts(r.updated_at) > ts(all[i].updatedAt)) {
          const f = { id: r.id, name: r.name, parentId: r.parent_id || null, color: r.color, updatedAt: iso(r.updated_at) };
          if (i >= 0) all[i] = f; else all.push(f);
          st.f[r.id] = f.updatedAt;
          changed++;
        }
        st.pulledF = r.server_updated_at;
      }
      S.quietly(() => S.writeFolders(all));
    }
    // Settings (students, Sonidos iniciales, PIN, voice)
    const ss = await LL.cloud.select('ll_settings', 'select=roster,sonidos,pin_hash,voice_id,updated_at,server_updated_at&server_updated_at=gt.' + encodeURIComponent(st.pulledS));
    if (ss && ss.length) {
      const r = ss[0];
      if (ts(r.updated_at) > ts(S.settingsAt())) {
        S.quietly(() => {
          if (Array.isArray(r.roster)) S.saveRoster(r.roster);
          if (r.sonidos && typeof r.sonidos === 'object') S.saveSonidos(r.sonidos);
          S.savePinHash(r.pin_hash || null);
          const v = S.voice();
          if (r.voice_id === 'off') S.saveVoice({ ...v, enabled: false });
          else S.saveVoice({ ...v, enabled: true, voiceId: r.voice_id || '' });
          localStorage.setItem(S.KEYS.settingsAt, JSON.stringify(iso(r.updated_at)));
        });
        st.settings = iso(r.updated_at);
        changed++;
      }
      st.pulledS = r.server_updated_at;
    }
    saveState(st);
    return changed;
  }

  /* ---------- Upload ---------- */
  async function push(st) {
    const me = LL.cloud.user();
    if (!me) return;
    const now = new Date().toISOString();

    const lib = S.readLibrary();
    const qRows = [];
    for (const e of lib) {
      const stamp = e.updatedAt || e.createdAt || now;
      if (!e.updatedAt) e.updatedAt = stamp;
      if (st.q[e.id] === stamp) continue;
      qRows.push({ owner_id: me.id, id: e.id, family_id: e.familyId || e.id, type: e.type || 'quiz', name: String(e.name || ''), version: Number(e.version) || 1, folder_id: e.folderId || null, config: e.config || {}, created_at: e.createdAt || stamp, updated_at: stamp, deleted_at: null });
    }
    const localQ = new Set(lib.map((x) => x.id));
    const goneQ = Object.keys(st.q).filter((id) => !localQ.has(id));
    for (const id of goneQ) qRows.push({ owner_id: me.id, id, name: '', config: {}, updated_at: now, deleted_at: now });
    // Upload in small batches (quizzes can contain pictures).
    for (let i = 0; i < qRows.length; i += 5) {
      const batch = qRows.slice(i, i + 5);
      await LL.cloud.upsert('ll_quizzes', batch, 'owner_id,id');
      for (const r of batch) { if (r.deleted_at) delete st.q[r.id]; else st.q[r.id] = r.updated_at; }
      saveState(st);
    }

    const fol = S.folders();
    const fRows = [];
    for (const f of fol) {
      const stamp = f.updatedAt || now;
      if (!f.updatedAt) f.updatedAt = stamp;
      if (st.f[f.id] === stamp) continue;
      fRows.push({ owner_id: me.id, id: f.id, name: String(f.name || ''), parent_id: f.parentId || null, color: f.color || null, updated_at: stamp, deleted_at: null });
    }
    const localF = new Set(fol.map((x) => x.id));
    for (const id of Object.keys(st.f).filter((id) => !localF.has(id))) fRows.push({ owner_id: me.id, id, name: '', updated_at: now, deleted_at: now });
    if (fRows.length) {
      await LL.cloud.upsert('ll_folders', fRows, 'owner_id,id');
      for (const r of fRows) { if (r.deleted_at) delete st.f[r.id]; else st.f[r.id] = r.updated_at; }
    }
    // Save stamps we filled in for older entries that had none.
    S.quietly(() => { S.writeLibrary(lib); S.writeFolders(fol); });

    const sAt = S.settingsAt();
    if (sAt && sAt !== st.settings) {
      const v = S.voice();
      await LL.cloud.upsert('ll_settings', [{ owner_id: me.id, roster: S.roster(), sonidos: S.sonidos(), pin_hash: S.pinHash(), voice_id: v.enabled ? (v.voiceId || null) : 'off', updated_at: sAt }], 'owner_id');
      st.settings = sAt;
    }
    saveState(st);
  }

  /* ---------- Account switching ---------- */
  function localHasData() { return S.readLibrary().length > 0 || S.folders().length > 0; }
  function owner() { return state().owner; }

  /** Forget which rows were uploaded (used when a different teacher signs in or local data is cleared). */
  function reset(ownerId) { saveState({ owner: ownerId || null, q: {}, f: {} }); }

  /** Remove this device's copy of the library (used when another account signs in). */
  function clearLocalLibrary() {
    S.quietly(() => { S.writeLibrary([]); S.writeFolders([]); });
  }

  /** Delete this teacher's cloud data. Rows are emptied and marked deleted (so the
   * other tablets also remove their copies on their next sync); voice files are
   * removed. This device's copy is cleared too, so it isn't uploaded again. */
  async function deleteCloudData() {
    const me = LL.cloud.user();
    if (!me) return;
    const now = new Date().toISOString();
    await LL.cloud.patch('ll_quizzes', 'owner_id=eq.' + me.id, { name: '', config: {}, folder_id: null, deleted_at: now, updated_at: now });
    await LL.cloud.patch('ll_folders', 'owner_id=eq.' + me.id, { name: '', parent_id: null, deleted_at: now, updated_at: now });
    await LL.cloud.upsert('ll_settings', [{ owner_id: me.id, roster: [], sonidos: null, pin_hash: null, voice_id: null, updated_at: now }], 'owner_id');
    clearLocalLibrary();
    S.quietly(() => { S.saveRoster([]); S.savePinHash(null); });
    try {
      const files = await LL.cloud.listFiles('ll-tts', me.id);
      await LL.cloud.removeFiles('ll-tts', (files || []).filter((f) => f.name).map((f) => me.id + '/' + f.name));
    } catch (e) { console.warn('could not remove voice files', e); }
    reset(me.id);
  }

  // Keep tablets up to date: when coming back online, when the page becomes visible, and every 2 minutes.
  window.addEventListener('online', () => run());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') run(); });
  setInterval(() => { if (document.visibilityState === 'visible' && !LL.player?.isOpen?.()) run(); }, 120000);

  LL.sync = { schedule, run, status, onChange, owner, reset, localHasData, clearLocalLibrary, deleteCloudData };
})();

  <script>
/* js/tts.js */
/* ElevenLabs voice. Audio is made once, when the teacher saves a quiz, by the
 * Supabase function "ll-tts" (which holds the secret API key). Children's
 * tablets just download and play the saved file. If anything is missing
 * (offline, not signed in, out of credits), the device voice is used instead. */
window.LL = window.LL || {};
(function () {
  const S = LL.store;
  const cache = new Map(); // storage path -> object URL
  const hasWords = (t) => /\p{L}/u.test(String(t || ''));

  function active() { return LL.cloud.signedIn() && S.voice().enabled; }

  /** Text that should be spoken for a question or an answer, or '' if none. */
  function speechText(item) {
    if (item.audioMode !== 'voice') return '';
    const t = item.readTextEnabled && String(item.readText || '').trim() ? item.readText : item.text;
    return String(t || '').trim();
  }

  /** Is there a saved ElevenLabs file for exactly this text? */
  function ready(item) {
    const t = speechText(item);
    return !!(t && item.tts && item.tts.path && item.tts.text === t);
  }

  async function url(path) {
    if (cache.has(path)) return cache.get(path);
    // Keep files between visits when the browser allows it (Cache Storage).
    let blob = null;
    try {
      if ('caches' in window) {
        const c = await caches.open('ll-tts-v1');
        const hit = await c.match('https://ll-tts.local/' + path);
        if (hit) blob = await hit.blob();
        if (!blob) { blob = await LL.cloud.download('ll-tts', path); c.put('https://ll-tts.local/' + path, new Response(blob, { headers: { 'Content-Type': 'audio/mpeg' } })).catch(() => {}); }
      }
    } catch { blob = null; }
    if (!blob) blob = await LL.cloud.download('ll-tts', path);
    const u = URL.createObjectURL(blob);
    cache.set(path, u);
    return u;
  }

  /** Download ahead of time so playback is instant when a child taps. */
  function prefetch(items) {
    if (!LL.cloud.signedIn()) return;
    for (const it of items) if (it && ready(it)) url(it.tts.path).catch(() => {});
  }

  /** Play the ElevenLabs file; resolves false if it could not (caller uses the device voice). */
  async function play(item) {
    if (!ready(item) || !LL.cloud.signedIn()) return false;
    try {
      LL.ui.playAudio(await url(item.tts.path));
      return true;
    } catch (e) {
      console.warn('voice file unavailable', e);
      return false;
    }
  }

  let warned = false;
  /** Make any missing voice files for a quiz. Mutates the quiz; returns how many were made. */
  async function prepareQuiz(quiz, onProgress) {
    if (!active()) return { made: 0, skipped: 0 };
    warned = false;
    const voiceId = S.voice().voiceId || '';
    const jobs = [];
    for (const q of quiz.config.questions || []) {
      for (const it of [q, ...(q.options || [])]) {
        const t = speechText(it);
        if (!t || !hasWords(t)) continue;
        if (it.tts && it.tts.text === t && (it.tts.voice || '') === voiceId) continue;
        jobs.push({ it, t });
      }
    }
    let made = 0, i = 0;
    for (const job of jobs) {
      onProgress && onProgress(++i, jobs.length);
      let r;
      try { r = await LL.cloud.invoke('ll-tts', { action: 'speak', text: job.t, lang: quiz.config.lang, voiceId }); }
      catch (e) { if (!warned) { warned = true; LL.ui.toast('No se pudo crear la voz ahora (' + e.message + '). Se usará la voz del dispositivo.', 'error'); } break; }
      if (r && r.path) { job.it.tts = { path: r.path, text: job.t, voice: voiceId }; made++; continue; }
      if (r && r.fallback) {
        const why = r.reason === 'no_api_key' ? 'falta la clave de ElevenLabs en Supabase'
          : /elevenlabs_(402|429)/.test(r.reason) ? 'se acabaron los créditos de ElevenLabs de este mes'
          : /elevenlabs_401/.test(r.reason) ? 'la clave de ElevenLabs no es válida'
          : r.reason;
        if (!warned) { warned = true; LL.ui.toast('Voz ElevenLabs no disponible: ' + why + '. Se usará la voz del dispositivo.', 'error'); }
        break;
      }
    }
    return { made, skipped: jobs.length - made };
  }

  async function voices() { return LL.cloud.invoke('ll-tts', { action: 'voices' }); }
  async function usage() { return LL.cloud.invoke('ll-tts', { action: 'usage' }); }

  LL.tts = { active, ready, play, prefetch, prepareQuiz, voices, usage, speechText };
})();

</script>
