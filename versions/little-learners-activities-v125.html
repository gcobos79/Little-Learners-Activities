    // While dragging with a finger, stop the page from scrolling.
    window.addEventListener('touchmove', (e) => { if (d && d.on) e.preventDefault(); }, { passive: false });
    window.addEventListener('pointerup', (e) => { if (d && e.pointerId === d.id) end(true); });
    window.addEventListener('pointercancel', (e) => { if (d && e.pointerId === d.id) end(false); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && d && d.on) end(false); });
    list.addEventListener('contextmenu', (e) => { if (d) e.preventDefault(); });
  }

  /* ---------- One question ---------- */
  function renderQuestion() {
    const box = $('#edQuestion');
    const qs = quiz.config.questions;
    qIndex = Math.max(0, Math.min(qIndex, qs.length - 1));
    const q = qs[qIndex];
    box.replaceChildren();

    const problem = el('div');
    const refreshProblem = () => {
      const msg = S.questionProblem(q);
      problem.className = msg ? 'problem-box' : 'ok-box';
      problem.textContent = msg ? '⚠️ ' + msg : '✓ Pregunta lista';
    };

    // Navigation (go to another question) is kept clearly apart from changing the order.
    const go = (d) => { qIndex = Math.max(0, Math.min(qs.length - 1, qIndex + d)); renderQuestion(); renderQList(); };
    box.append(el('div.q-nav',
      el('button.btn.soft', { type: 'button', disabled: qIndex === 0, onclick: () => go(-1), 'aria-label': 'Ir a la pregunta anterior' }, '‹ Anterior'),
      el('h2', 'Pregunta ' + (qIndex + 1) + ' de ' + qs.length),
      el('button.btn.soft', { type: 'button', disabled: qIndex === qs.length - 1, onclick: () => go(1), 'aria-label': 'Ir a la pregunta siguiente' }, 'Siguiente ›')));
    box.append(el('div.q-tools',
      el('span.small.muted', 'Esta pregunta:'),
      el('button.btn.sm.ghost', { type: 'button', disabled: qs.length >= 50, onclick: duplicateQuestion }, '📄 Duplicar'),
      el('button.btn.sm.ghost', { type: 'button', title: 'Cambia el orden: la pregunta pasa a un lugar antes', disabled: qIndex === 0, onclick: () => moveQuestion(-1) }, '↑ Cambiar de lugar'),
      el('button.btn.sm.ghost', { type: 'button', title: 'Cambia el orden: la pregunta pasa a un lugar después', disabled: qIndex === qs.length - 1, onclick: () => moveQuestion(1) }, '↓ Cambiar de lugar'),
      el('button.btn.sm.danger-ghost', { type: 'button', onclick: deleteQuestion }, '🗑️ Eliminar')));
    box.append(problem);

    const onEdit = () => { refreshProblem(); changed(); };

    // Prompt
    const prompt = el('textarea', { rows: '2', placeholder: 'Ej. ¿Cuál es el perro?' });
    prompt.value = q.text || '';
    prompt.addEventListener('input', () => { q.text = prompt.value; onEdit(); });
    box.append(el('label.field', 'Pregunta', el('span.hint', 'Puede quedar vacía si usas una imagen o un audio.'), prompt));

    // Prompt image
    const imgRow = el('div.media-row');
    const drawImg = () => {
      imgRow.replaceChildren();
      if (q.image) imgRow.append(el('img.thumb', { src: q.image, alt: 'Imagen de la pregunta' }));
      imgRow.append(el('button.btn.sm.ghost', { type: 'button', onclick: async () => {
        const f = await pickFile('image/*'); if (!f) return;
        try { q.image = await store(await imageFileToDataURL(f, 1000, 0.8), 'images'); drawImg(); onEdit(); } catch (e) { toast(e.message, 'error'); }
      } }, q.image ? '🖼️ Cambiar imagen' : '🖼️ Agregar imagen'));
      if (q.image) imgRow.append(el('button.btn.sm.danger-ghost', { type: 'button', onclick: () => { q.image = ''; drawImg(); onEdit(); } }, 'Quitar'));
    };
    drawImg();
    box.append(el('div.field', 'Imagen (opcional)', imgRow));

    // Prompt sound
    box.append(soundEditor(q, 'pregunta', onEdit, [['none', 'Sin sonido'], ['voice', 'Voz automática'], ['file', 'Archivo de audio']], q.audioMode || 'voice'));

    // Answers
    const correctCount = q.options.filter((o) => o.correct).length;
    box.append(el('div', el('h3', 'Respuestas'), el('p.small.muted', 'Toca «✓ Correcta» en la respuesta buena. Puedes marcar hasta 2 (si hay 3 o más respuestas). Llevas ' + correctCount + ' marcada(s).')));
    const answers = el('div.answers');
    q.options.forEach((o, i) => answers.append(answerEditor(q, o, i, onEdit)));
    box.append(answers);
    const addRow = el('div.media-row');
    if (q.options.length < 6) addRow.append(el('button.btn.soft', { type: 'button', onclick: () => { q.options.push(S.newOption()); renderQuestion(); changed(); } }, '＋ Agregar respuesta'));
    addRow.append(el('span.small.muted', q.options.length + ' de 6 respuestas (mínimo 2)'));
    box.append(addRow);

    refreshProblem();
  }

  function soundEditor(item, what, onEdit, modes, current) {
    const wrap = el('div.field', what === 'pregunta' ? 'Sonido de la pregunta' : 'Sonido');
    const detail = el('div.sub');
    const draw = () => {
      detail.replaceChildren();
      const mode = item.audioMode || current;
      detail.hidden = mode === 'none';
      if (mode === 'voice') {
        const alt = el('input', { type: 'checkbox', checked: !!item.readTextEnabled });
        const altText = el('textarea', { rows: '2', placeholder: 'Lo que debe escuchar el estudiante…' });
        altText.value = item.readText || '';
        altText.hidden = !item.readTextEnabled;
        alt.addEventListener('change', () => { item.readTextEnabled = alt.checked; altText.hidden = !alt.checked; onEdit(); });
        altText.addEventListener('input', () => { item.readText = altText.value; onEdit(); });
        detail.append(
          el('label.check', alt, 'Leer en voz alta un texto diferente'),
          altText,
          el('button.btn.sm.ghost', { type: 'button', style: { justifySelf: 'start' }, onclick: () => {
            const t = item.readTextEnabled && item.readText ? item.readText : item.text;
            if (!String(t || '').trim()) { toast('Escribe primero el texto.', 'error'); return; }
            speak(t, quiz.config.lang, quiz.config.voiceGender);
          } }, '🔊 Escuchar'));
      } else if (mode === 'file') {
        const row = el('div.media-row');
        if (item.audio) row.append(el('audio', { controls: true, src: item.audio, preload: 'metadata', style: { maxWidth: '100%' } }));
        row.append(el('button.btn.sm.ghost', { type: 'button', onclick: async () => {
          const f = await pickFile('audio/*'); if (!f) return;
          try { item.audio = await store(await audioFileToDataURL(f), 'audio'); draw(); onEdit(); } catch (e) { toast(e.message, 'error'); }
        } }, item.audio ? '🎵 Cambiar audio' : '🎵 Elegir archivo de audio'));
        if (item.audio) row.append(el('button.btn.sm.danger-ghost', { type: 'button', onclick: () => { stopSound(); item.audio = ''; draw(); onEdit(); } }, 'Quitar'));
        detail.append(row);
      }
    };
    wrap.append(segmented(modes, item.audioMode || current, (v) => { item.audioMode = v; draw(); onEdit(); }), detail);
    draw();
    return wrap;
  }

  function answerEditor(q, o, i, onEdit) {
    const letter = String.fromCharCode(65 + i);
    const card = el('div.answer' + (o.correct ? '.is-correct' : ''));
    const toggle = el('button.correct-toggle', { type: 'button', 'aria-pressed': String(!!o.correct) }, o.correct ? '✓ Correcta' : 'Marcar correcta');
    toggle.addEventListener('click', () => {
      if (!o.correct) {
        const n = q.options.filter((x) => x.correct).length;
        const max = q.options.length === 2 ? 1 : 2;
        if (n >= max) {
          if (max === 1) q.options.forEach((x) => { x.correct = false; });
          else { toast('Puedes marcar como máximo 2 respuestas correctas.', 'error'); return; }
        }
      }
      o.correct = !o.correct;
      renderQuestion(); changed();
    });
    const remove = el('button.icon-btn', { type: 'button', 'aria-label': 'Quitar respuesta ' + letter, title: 'Quitar respuesta', disabled: q.options.length <= 2, onclick: () => { q.options.splice(i, 1); renderQuestion(); changed(); } }, '✕');
    card.append(el('div.answer-head', el('span.answer-letter', { style: { background: LETTER_COLORS[i % 6] } }, letter), toggle, remove));

    const text = el('input', { type: 'text', placeholder: 'Texto o emoji (ej. 🐶)', value: o.text || '', 'aria-label': 'Texto de la respuesta ' + letter });
    text.addEventListener('input', () => { o.text = text.value; onEdit(); });
    card.append(text);

    const imgRow = el('div.media-row');
    const drawImg = () => {
      imgRow.replaceChildren();
      if (o.image) imgRow.append(el('img.thumb', { src: o.image, alt: '' }));
      imgRow.append(el('button.btn.sm.ghost', { type: 'button', onclick: async () => {
        const f = await pickFile('image/*'); if (!f) return;
        try { o.image = await store(await imageFileToDataURL(f, 600, 0.8), 'images'); drawImg(); onEdit(); } catch (e) { toast(e.message, 'error'); }
      } }, o.image ? '🖼️ Cambiar' : '🖼️ Imagen'));
      if (o.image) imgRow.append(el('button.btn.sm.danger-ghost', { type: 'button', onclick: () => { o.image = ''; drawImg(); onEdit(); } }, 'Quitar'));
    };
    drawImg();
    card.append(imgRow);
    card.append(soundEditor(o, 'respuesta', onEdit, [['none', 'Sin sonido'], ['voice', 'Voz'], ['file', 'Archivo']], o.audioMode || 'none'));
    return card;
  }

  /* ---------- Question actions ---------- */
  function addQuestion() {
    const qs = quiz.config.questions;
    if (qs.length >= 50) return;
    // New questions copy the sound setting and answer count of the current one.
    const cur = qs[qIndex];
    const nq = S.newQuestion(cur ? cur.options.length : 4);
    if (cur) nq.audioMode = cur.audioMode || 'voice';
    qs.splice(qIndex + 1, 0, nq);
    qIndex++;
    renderQuestion(); changed();
    const t = $('#edQuestion textarea'); t && t.focus();
  }
  function duplicateQuestion() {
    const qs = quiz.config.questions;
    const copy = S.clone(qs[qIndex]);
    copy.id = S.uid('quiz');
    copy.options.forEach((o) => { o.id = S.uid('quiz'); });
    qs.splice(qIndex + 1, 0, copy);
    qIndex++;
    renderQuestion(); changed();
    toast('Copia creada: ahora estás en la pregunta ' + (qIndex + 1) + '. Cada copia se edita por separado.');
  }
  async function deleteQuestion() {
    const qs = quiz.config.questions;
    if (!(await confirmDialog('¿Eliminar la pregunta ' + (qIndex + 1) + '?', 'Se quitará de este quiz cuando pulses «Guardar».', 'Eliminar', true))) return;
    qs.splice(qIndex, 1);
    if (!qs.length) qs.push(S.newQuestion());
    qIndex = Math.min(qIndex, qs.length - 1);
    renderQuestion(); changed();
  }
  function moveQuestion(d) {
    const qs = quiz.config.questions, j = qIndex + d;
    if (j < 0 || j >= qs.length) return;
    [qs[qIndex], qs[j]] = [qs[j], qs[qIndex]];
    qIndex = j;
    renderQuestion(); changed();
    toast('La pregunta se movió al lugar ' + (j + 1) + '. Para ver otra pregunta usa «Anterior» / «Siguiente».');
  }

  /* ---------- Save / preview / leave ---------- */
  function save() {
    quiz.name = (quiz.name || '').trim();
    quiz.config.mode = 'practice'; // only one mode: a wrong answer always shows the right one
    if (!quiz.name) { toast('Escribe un nombre para el quiz.', 'error'); $('#edName').focus(); return false; }
    // A question that was never touched is simply dropped.
    const blank = (q) => !String(q.text || '').trim() && !q.image && !q.audio && !String(q.readText || '').trim() && q.options.every((o) => !String(o.text || '').trim() && !o.image && !o.audio && !o.correct);
    const qs = quiz.config.questions;
    if (qs.length > 1) quiz.config.questions = qs.filter((q) => !blank(q));
    if (!quiz.config.questions.length) quiz.config.questions = [S.newQuestion()];
    quiz.config.questions.forEach((q) => { q.correctCount = Math.max(1, q.options.filter((o) => o.correct).length); });

    const problems = quiz.config.questions.map((q, i) => ({ i, msg: S.questionProblem(q) })).filter((p) => p.msg);
    if (problems.length && quiz.config.visibility === 'visible') {
      qIndex = problems[0].i;
      renderAll();
      toast('Para que los estudiantes lo vean, completa la pregunta ' + (problems[0].i + 1) + ': ' + problems[0].msg, 'error');
      return false;
    }
    let id = S.saveQuiz(quiz, { quiet: true });
    if (!id) {
      // Browser storage full: drop the draft copy (this quiz is still open here) and try again.
      S.clearDraft();
      S.freeSpace();
      id = S.saveQuiz(quiz, { quiet: true });
    }
    if (!id) {
      if (LL.cloud.signedIn()) { saveViaCloud(); return false; }
      toast('El almacenamiento de este navegador está lleno. Quita algunas imágenes o audios, o entra con tu cuenta para guardarlos en la nube.', 'error');
      return false;
    }
    quiz.id = id;
    snapshot = JSON.stringify(quiz);
    S.clearDraft();
    renderAll();
    if (problems.length) toast('Guardado como «En preparación». Faltan ' + problems.length + ' pregunta(s) por completar.', 'success');
    else toast(quiz.config.visibility === 'visible' ? '✓ Guardado. Los estudiantes ya pueden verlo.' : '✓ Guardado (en preparación).', 'success');
    prepareVoices(id);
    return true;
  }

  /** Storage still full: upload this quiz's pictures/audio first (so the device copy only keeps
   *  short references), then save again. */
  async function saveViaCloud() {
    const st = $('#edState');
    if (st) st.textContent = '☁️ Subiendo imágenes y audios para liberar espacio…';
    try {
      await LL.sync.uploadMedia(quiz);
      S.clearDraft();
      if (save()) toast('✓ Guardado. Las imágenes y audios quedaron en la nube.', 'success');
    } catch (e) {
      toast('No se pudo guardar: ' + LL.auth.friendly(e) + '. No cierres esta página e inténtalo de nuevo.', 'error');
      changed();
    }
  }

  /** Copy ElevenLabs file info from `source` into `target`, matching questions/answers by id and text. */
  function applyTts(target, source) {
    const map = new Map();
    for (const q of source.questions || []) for (const it of [q, ...(q.options || [])]) if (it.tts) map.set(it.id, it.tts);
    for (const q of target.questions || []) for (const it of [q, ...(q.options || [])]) {
      const t = map.get(it.id);
      if (t && LL.tts.speechText(it) === t.text) it.tts = t;
    }
  }

  /** After saving: make natural-voice audio for new or changed text (runs in the background). */
  async function prepareVoices(id) {
    if (!LL.tts || !LL.tts.active()) return;
    const stored = S.getQuiz(id);
    if (!stored) return;
    const work = { ...stored, config: S.clone(stored.config) };
    const st = () => (quiz && quiz.id === id ? $('#edState') : null);
    const r = await LL.tts.prepareQuiz(work, (i, n) => { const s = st(); if (s) s.textContent = '🗣️ Preparando voces naturales… ' + i + ' de ' + n; });
    if (r.made) {
      const latest = S.getQuiz(id);
      if (latest) { applyTts(latest.config, work.config); S.saveQuiz({ id, name: latest.name, folderId: latest.folderId, config: latest.config }); }
      if (quiz && quiz.id === id) { const wasClean = !isDirty(); applyTts(quiz.config, work.config); if (wasClean) snapshot = JSON.stringify(quiz); }
      toast('🗣️ Voz natural lista para ' + r.made + (r.made === 1 ? ' texto.' : ' textos.'), 'success');
    }
    if (quiz && quiz.id === id) changed();
  }

  function preview() {
    LL.player.open({ name: quiz.name || 'Vista previa', config: S.clone(quiz.config) }, { preview: true, startIndex: qIndex, onClose: () => {} });
  }

  async function canLeave() {
    if (!isDirty()) return true;
    const v = await dialog({
      title: '¿Guardar los cambios?',
      body: 'Este quiz tiene cambios sin guardar.',
      actions: [{ label: 'Seguir editando', kind: 'ghost', value: 'stay' }, { label: 'Salir sin guardar', kind: 'danger-ghost', value: 'discard' }, { label: 'Guardar y salir', kind: 'primary', value: 'save' }],
    });
    if (v === 'save') return save();
    if (v === 'discard') { S.clearDraft(); quiz = null; snapshot = ''; return true; }
    return false;
  }

  window.addEventListener('beforeunload', (e) => {
    if (LL.app && LL.app.state.screen === 'editor' && isDirty()) { e.preventDefault(); e.returnValue = ''; }
  });

  LL.editor = { open, canLeave, currentId: () => (quiz ? quiz.id || 'nuevo' : null) };
})();

</script>
  <script>
/* js/teacher.js */
/* Teacher tools: students, backup / sharing, and Sonidos iniciales settings. */
window.LL = window.LL || {};
(function () {
  const { el, $, toast, dialog, confirmDialog, pickFile, download, formatBytes } = LL.ui;
  const S = LL.store;

  /* ---------- Students ---------- */
  function animalPicker(selected, onPick) {
    const grid = el('div.animal-pick');
    for (const a of S.ANIMALS) {
      const b = el('button', { type: 'button', 'aria-pressed': String(a === selected), 'aria-label': a }, a);
      b.addEventListener('click', () => { grid.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); onPick(a); });
      grid.append(b);
    }
    return grid;
  }

  /** Animal (or picture) for a student, used in lists and on the "¿Quién eres?" cards. */
  function avatar(s, cls = 'animal') {
    return s.avatar && LL.media.isImage(s.avatar)
      ? el('img.avatar-img', { src: s.avatar, alt: '' })
      : el('span.' + cls, s.animal || '🐾');
  }

  async function studentDialog(existing) {
    let animal = existing ? existing.animal : S.ANIMALS[Math.floor(Math.random() * S.ANIMALS.length)];
    let pic = existing ? existing.avatar || '' : '';
    const name = el('input', { type: 'text', maxlength: '40', placeholder: 'Nombre', value: existing ? existing.name : '' });
    const picRow = el('div.media-row');
    const drawPic = () => {
      picRow.replaceChildren();
      if (pic) picRow.append(el('img.thumb', { src: pic, alt: 'Foto o dibujo' }));
      picRow.append(el('button.btn.sm.ghost', { type: 'button', onclick: async () => {
        const f = await pickFile('image/*'); if (!f) return;
        try { pic = await LL.ui.imageFileToDataURL(f, 256, 0.8); drawPic(); } catch (e) { toast(e.message, 'error'); }
      } }, pic ? '🖼️ Cambiar' : '🖼️ Elegir foto o dibujo'));
      if (pic) picRow.append(el('button.btn.sm.danger-ghost', { type: 'button', onclick: () => { pic = ''; drawPic(); } }, 'Quitar'));
    };
    drawPic();
    const ok = await dialog({
      title: existing ? 'Editar estudiante' : 'Agregar estudiante',
      body: el('div', { style: { display: 'grid', gap: '14px' } },
        el('label.field', 'Nombre', name),
        el('div.field', 'Animalito', animalPicker(animal, (a) => { animal = a; })),
        el('div.field', 'Foto o dibujo (opcional)', el('span.hint', 'Si eliges una, se muestra en lugar del animalito.'), picRow)),
      actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: existing ? 'Guardar' : 'Agregar', kind: 'primary', value: () => (name.value.trim() ? true : (name.focus(), undefined)) }],
    });
    return ok ? { name: name.value.trim(), animal, avatar: pic } : null;
  }

  let rosterBusy = false;
  /** Run a change to the class list (database when signed in, this device otherwise). */
  async function rosterChange(fnCloud, fnLocal, okMsg) {
    if (rosterBusy) return;
    rosterBusy = true;
    try {
      if (LL.cloud.signedIn()) await fnCloud(); else fnLocal();
      if (okMsg) toast(okMsg, 'success');
    } catch (e) {
      toast('No se pudo guardar: ' + (LL.auth ? LL.auth.friendly(e) : e.message), 'error');
    } finally { rosterBusy = false; renderRoster(); }
  }

  function renderRoster() {
    const page = $('#screen-students-admin');
    const r = S.roster();
    const cloud = LL.cloud.signedIn();
    const list = el('div.roster-list');
    const dupName = (v, exceptIdx) => r.some((x, k) => k !== exceptIdx && x.name.toLocaleLowerCase('es') === v.name.toLocaleLowerCase('es'));
    r.forEach((s, i) => {
      list.append(el('div.roster-row',
        avatar(s), el('span.nm', s.name),
        el('button.icon-btn', { type: 'button', 'aria-label': 'Subir a ' + s.name, disabled: i === 0, onclick: () => {
          const order = r.slice(); [order[i - 1], order[i]] = [order[i], order[i - 1]];
          rosterChange(() => LL.sync.students.reorder(order.map((x) => x.id)), () => S.saveRoster(order));
        } }, '⬆️'),
        el('button.btn.sm.ghost', { type: 'button', onclick: async () => {
          const v = await studentDialog(s); if (!v) return;
          if (dupName(v, i)) { toast('Ya hay un estudiante con ese nombre.', 'error'); return; }
          rosterChange(() => LL.sync.students.update(s.id, v), () => { r[i] = { ...s, ...v }; S.saveRoster(r); }, 'Cambios guardados.');
        } }, '✏️ Editar'),
        el('button.btn.sm.danger-ghost', { type: 'button', onclick: async () => {
          const msg = cloud ? 'Ya no aparecerá en «¿Quién eres?». Sus resultados anteriores se conservan.' : 'Ya no aparecerá en «¿Quién eres?».';
          if (!(await confirmDialog('¿Quitar a ' + s.name + '?', msg, 'Quitar', true))) return;
          rosterChange(() => LL.sync.students.remove(s.id), () => { r.splice(i, 1); S.saveRoster(r); });
        } }, 'Quitar')));
    });
    page.replaceChildren(el('div.tool-page',
      el('div', el('h1', '👧 Estudiantes'), el('p.lead', 'Ellos aparecen en la pantalla «¿Quién eres?».')),
      el('div.panel', { style: { display: 'grid', gap: '12px' } },
        r.length ? list : el('p.muted', 'Todavía no hay estudiantes.'),
        el('div.media-row',
          el('button.btn.primary', { type: 'button', onclick: async () => {
            const v = await studentDialog(null); if (!v) return;
            if (dupName(v, -1)) { toast('Ya hay un estudiante con ese nombre.', 'error'); return; }
            rosterChange(() => LL.sync.students.add(v), () => { r.push(v); S.saveRoster(r); }, v.name + ' agregado.');
          } }, '＋ Agregar estudiante'),
          cloud ? el('button.btn.ghost', { type: 'button', onclick: async () => { try { await LL.sync.refreshStudents(); renderRoster(); toast('Lista actualizada.'); } catch (e) { toast(LL.auth.friendly(e), 'error'); } } }, '🔄 Actualizar lista') : null)),
      el('p.small.muted', cloud
        ? 'La lista se guarda en tu cuenta (tabla «students») y aparece en todas tus tabletas. Usa solo el primer nombre o un apodo.'
        : 'Usa solo el primer nombre o un apodo. Sin cuenta, la lista se guarda solo en este navegador.')));
  }

  /* ---------- Backup ---------- */
  const box = (...kids) => el('div.panel', { style: { display: 'grid', gap: '12px' } }, ...kids);

  function accountPanel() {
    if (!LL.cloud.enabled()) return null;
    if (!LL.cloud.signedIn()) {
      return box(el('h2', '👤 Cuenta'),
        el('p', 'Estás usando Little Learners sin cuenta: todo se guarda solo en este navegador.'),
        el('p.small.muted', 'Con una cuenta, tus quizzes se guardan en la nube y aparecen en todas tus tabletas.'),
        el('button.btn.primary', { type: 'button', style: { justifySelf: 'start' }, onclick: () => { LL.auth.setLocalMode(false); LL.app.goHome(); } }, 'Iniciar sesión'));
    }
    const u = LL.cloud.user() || {};
    const line = el('p.small');
    const draw = (st) => {
      line.textContent = st.busy || st.pending ? '🔄 Guardando en la nube…'
        : st.error === 'offline' ? '📴 Sin internet. Los cambios se subirán al volver la conexión.'
        : st.error ? '⚠️ No se pudo sincronizar: ' + st.error
        : st.lastOk ? '☁️ Todo guardado en la nube · ' + new Date(st.lastOk).toLocaleString('es-US', { dateStyle: 'short', timeStyle: 'short' }) : '☁️ Conectado';
    };
    draw(LL.sync.status());
    const off = LL.sync.onChange((st) => { if (!line.isConnected) { off(); return; } draw(st); });
    return box(el('h2', '👤 Cuenta'),
      el('p', 'Sesión iniciada como ', el('strong', u.email || '')),
      line,
      el('div.media-row',
        el('button.btn.soft', { type: 'button', onclick: async () => { const ok = await LL.sync.run(); toast(ok ? '✓ Sincronizado.' : 'No se pudo sincronizar ahora.', ok ? 'success' : 'error'); } }, '🔄 Sincronizar ahora'),
        el('button.btn.ghost', { type: 'button', onclick: () => LL.auth.signOut() }, 'Cerrar sesión')),
      el('p.small.muted', 'En cada tableta: abre la página, entra una vez con tu cuenta y la tableta queda lista. Los niños solo tocan su animalito.'));
  }

  function pinPanel() {
    const has = !!S.pinHash();
    return box(el('h2', '🔒 PIN del maestro'),
      el('p', has ? 'Hay un PIN. Se pide al mantener presionado «Maestro».' : 'Para tabletas compartidas: además de mantener presionado «Maestro», pide un PIN de números.'),
      el('div.media-row',
        el('button.btn.soft', { type: 'button', onclick: async () => { await LL.auth.setPinFlow(); renderBackup(); } }, has ? 'Cambiar PIN' : 'Crear PIN'),
        has ? el('button.btn.danger-ghost', { type: 'button', onclick: async () => { if (await confirmDialog('¿Quitar el PIN?', 'Cualquiera que mantenga presionado «Maestro» podrá entrar.', 'Quitar PIN', true)) { S.savePinHash(null); renderBackup(); } } }, 'Quitar PIN') : null),
      el('p.small.muted', 'El PIN se guarda cifrado' + (LL.cloud.signedIn() ? ' y se usa en todos tus dispositivos.' : '.')));
  }

  function voicePanel() {
    if (!LL.cloud.signedIn()) return null;
    const v = S.voice();
    const on = el('input', { type: 'checkbox', checked: v.enabled });
    on.addEventListener('change', () => { S.saveVoice({ ...S.voice(), enabled: on.checked }); renderBackup(); });
    const selF = el('select', { 'aria-label': 'Voz de mujer', disabled: true }, new Option('Cargando voces…', v.voiceId || ''));
    const selM = el('select', { 'aria-label': 'Voz de hombre', disabled: true }, new Option('Cargando voces…', v.maleVoiceId || ''));
    const usage = el('div', { style: { display: 'grid', gap: '6px' } });
    const panel = box(el('h2', '🗣️ Voz natural (ElevenLabs)'),
      el('label.switch', on, 'Usar voz natural en los quizzes'),
      el('p.small.muted', 'Al guardar un quiz, cada texto con «Voz automática» se convierte una vez en audio natural con la voz de mujer o de hombre que elegiste en ese quiz. Si no hay internet o se acaban los créditos, se usa la voz del dispositivo.'),
      el('div.voice-pick',
        el('label.field', '👩 Voz de mujer', selF, el('button.btn.sm.ghost', { type: 'button', disabled: !v.enabled, onclick: () => testVoice('female') }, '🔊 Probar')),
        el('label.field', '👨 Voz de hombre', selM, el('button.btn.sm.ghost', { type: 'button', disabled: !v.enabled, onclick: () => testVoice('male') }, '🔊 Probar'))),
      el('div.media-row',
        el('button.btn.soft', { type: 'button', disabled: !v.enabled, onclick: prepareAll }, '🗣️ Preparar voces de todos los quizzes')),
      usage,
      el('p.small.muted', 'Voces creadas con ElevenLabs (elevenlabs.io). Con el plan gratuito: solo uso no comercial y se debe mencionar a ElevenLabs.'));
    if (v.enabled) {
      LL.tts.voices().then((r) => {
        selF.replaceChildren(); selM.replaceChildren();
        if (!r || !r.voices) {
          const msg = r && r.reason === 'no_api_key' ? 'Falta la clave de ElevenLabs en Supabase' : 'No se pudieron cargar las voces';
          selF.append(new Option(msg, '')); selM.append(new Option(msg, '')); return;
        }
        const label = (x) => x.name + (x.accent ? ' · ' + x.accent : '') + (x.age ? ' · ' + x.age : '');
        const fill = (sel, gender, current) => {
          const list = r.voices.filter((x) => x.gender === gender).sort((a, b) => a.name.localeCompare(b.name));
          const others = r.voices.filter((x) => x.gender !== gender).sort((a, b) => a.name.localeCompare(b.name));
          sel.add(new Option('Automática (' + (gender === 'female' ? 'mujer' : 'hombre') + ')', ''));
          list.forEach((x) => sel.add(new Option(label(x), x.id, false, x.id === current)));
          if (others.length) { const g = document.createElement('optgroup'); g.label = 'Otras voces'; others.forEach((x) => g.append(new Option(label(x), x.id, false, x.id === current))); sel.append(g); }
          sel.value = current || '';
          sel.disabled = false;
        };
        fill(selF, 'female', v.voiceId); fill(selM, 'male', v.maleVoiceId);
      }).catch((e) => { selF.replaceChildren(new Option('Sin conexión', '')); selM.replaceChildren(new Option('Sin conexión', '')); console.warn(e); });
      selF.addEventListener('change', () => { S.saveVoice({ ...S.voice(), voiceId: selF.value }); toast('Voz de mujer cambiada. Usa «Preparar voces» para actualizar los quizzes.'); });
      selM.addEventListener('change', () => { S.saveVoice({ ...S.voice(), maleVoiceId: selM.value }); toast('Voz de hombre cambiada. Usa «Preparar voces» para actualizar los quizzes.'); });
      LL.tts.usage().then((u) => {
        if (!u || u.used == null) return;
        const pct = Math.min(100, Math.round((u.used / Math.max(1, u.limit)) * 100));
        usage.replaceChildren(el('div.meter', el('div', { style: { width: pct + '%', background: pct > 85 ? 'var(--bad)' : 'var(--primary)' } })),
          el('p.small.muted', 'Créditos usados este mes: ' + u.used.toLocaleString('es-US') + ' de ' + u.limit.toLocaleString('es-US') + (u.resetsAt ? ' · se renuevan el ' + new Date(u.resetsAt * 1000).toLocaleDateString('es-US') : '')));
      }).catch(() => {});
    }
    return panel;
  }

  async function testVoice(gender) {
    const text = '¡Hola! Vamos a aprender juntos.';
    const voiceId = (gender === 'male' ? S.voice().maleVoiceId : S.voice().voiceId) || '';
    try {
      const r = await LL.cloud.invoke('ll-tts', { action: 'speak', text, voiceId, gender });
      if (r && r.path) { await LL.tts.play({ audioMode: 'voice', text, tts: { path: r.path, text, gender } }, gender); return; }
      toast('Voz natural no disponible (' + (r && r.reason) + '). Se usa la voz del dispositivo.', 'error');
      LL.ui.speak(text, 'es', gender);
    } catch (e) { toast(LL.auth.friendly(e), 'error'); LL.ui.speak(text, 'es', gender); }
  }

  async function prepareAll() {
    const all = S.quizzes();
    let made = 0;
    for (let i = 0; i < all.length; i++) {
      const q = all[i];
      const work = { ...q, config: S.clone(q.config) };
      toast('🗣️ ' + (i + 1) + ' de ' + all.length + ': ' + q.name);
      const r = await LL.tts.prepareQuiz(work);
      if (r.made) { S.saveQuiz({ id: q.id, name: q.name, folderId: q.folderId, config: work.config }); made += r.made; }
      if (r.skipped && !r.made) break;
    }
    toast('Listo: ' + made + ' audio(s) nuevo(s).', 'success');
    renderBackup();
  }

  /* ---------- Settings: account, PIN, voice, backup, delete ---------- */
  function renderBackup() {
    const page = $('#screen-backup');
    const used = S.storageUsed();
    const quota = 5 * 1024 * 1024; // typical localStorage limit
    const pct = Math.min(100, Math.round((used / quota) * 100));
    const nQ = S.quizzes().length, nF = S.folders().length;
    const signed = LL.cloud.signedIn();
    page.replaceChildren(el('div.tool-page',
      el('div', el('h1', '⚙️ Ajustes'), el('p.lead', signed ? 'Tu cuenta, el PIN, la voz y los respaldos.' : 'El PIN, los respaldos y los datos de este dispositivo.')),
      accountPanel(),
      pinPanel(),
      voicePanel(),
      box(el('h2', '📥 Descargar respaldo'),
        el('p', 'Guarda en un archivo todos tus quizzes (' + nQ + '), carpetas (' + nF + ') y estudiantes.'),
        el('button.btn.primary', { type: 'button', style: { justifySelf: 'start' }, onclick: () => {
          toast('Preparando respaldo…');
          LL.media.inlineBackup(S.exportBackup()).then((b) => { download('little-learners-respaldo-' + S.todayChicago() + '.json', JSON.stringify(b)); toast('Respaldo descargado.', 'success'); });
        } }, '📥 Descargar respaldo')),
      box(el('h2', '📤 Importar'),
        el('p', 'Abre un archivo de respaldo, o una carpeta que otro maestro compartió contigo.'),
        el('button.btn.soft', { type: 'button', style: { justifySelf: 'start' }, onclick: importFlow }, '📤 Elegir archivo…'),
        el('p.small.muted', 'Para compartir solo una carpeta: en «Actividades», toca ⋯ en la carpeta → «Compartir».')),
      signed ? null : box(el('h2', '📲 Pasar las actividades a una tableta sin cuenta'),
        el('ol', { style: { margin: 0, paddingLeft: '22px', display: 'grid', gap: '6px', fontWeight: 700 } },
          el('li', 'En tu computadora: «📥 Descargar respaldo».'),
          el('li', 'Copia el archivo a la tableta (Google Drive, correo o memoria USB).'),
          el('li', 'En la tableta: mantén presionado «Maestro» → «Ajustes» → «📤 Elegir archivo».'),
          el('li', 'Elige «Agregar a lo que ya tengo». ¡Listo!'))),
      el('div.panel', { style: { display: 'grid', gap: '8px' } },
        el('h3', 'Espacio usado en este navegador'),
        el('div.meter', el('div', { style: { width: pct + '%', background: pct > 80 ? 'var(--bad)' : 'var(--primary)' } })),
        el('p.small.muted', 'Aproximadamente ' + formatBytes(used) + ' de ~5 MB. Las imágenes y los audios ocupan más espacio; las imágenes nuevas se reducen automáticamente.'),
        el('button.btn.soft', { type: 'button', style: { justifySelf: 'start' }, onclick: freeSpaceFlow }, '🧹 Liberar espacio')),
      el('div.panel', { style: { display: 'grid', gap: '10px', borderColor: '#F3C3C3' } },
        el('h2', '🗑️ Borrar datos'),
        el('p', el('strong', 'Este dispositivo: '), 'borra de este navegador todos los quizzes, carpetas, estudiantes, ajustes y resultados' + (signed ? ', y cierra la sesión. Tu copia en la nube no se toca.' : '. No afecta a otros dispositivos ni a los respaldos descargados.')),
        el('button.btn.danger-ghost', { type: 'button', style: { justifySelf: 'start' }, onclick: deleteAll }, 'Borrar este dispositivo…'),
        signed ? el('p', el('strong', 'La nube: '), 'borra tus quizzes, carpetas, estudiantes y voces guardados en tu cuenta, y también de este dispositivo. Tus otras tabletas los quitarán en su siguiente sincronización.') : null,
        signed ? el('button.btn.danger-ghost', { type: 'button', style: { justifySelf: 'start' }, onclick: deleteCloud }, 'Borrar mis datos de la nube…') : null,
        signed ? el('p.small.muted', 'Para cerrar la cuenta por completo, pídeselo a quien administra esta página.') : null),
      el('p.small', el('button.link-btn', { type: 'button', onclick: () => LL.app.openInfo('privacidad') }, 'Política de privacidad'), ' · ', el('button.link-btn', { type: 'button', onclick: () => LL.app.openInfo('terminos') }, 'Términos de uso'))));
  }

  async function freeSpaceFlow() {
    const ok = await confirmDialog('¿Liberar espacio en este navegador?',
      'Se quitan las versiones antiguas de los quizzes y la copia de respaldo del quiz que se está editando' +
      (LL.cloud.signedIn() ? ', y las imágenes y audios pasan a la nube. ' : '. ') +
      'No se borra ningún quiz. Si tienes un quiz abierto en otra pestaña, no la cierres: después pulsa «Guardar» allí.', 'Liberar espacio');
    if (!ok) return;
    const before = S.storageUsed();
    S.freeSpace({ draft: true });
    if (LL.cloud.signedIn()) { toast('☁️ Pasando imágenes y audios a la nube…'); await LL.sync.run(); }
    const freed = Math.max(0, before - S.storageUsed());
    toast('Listo: se liberaron ' + formatBytes(freed) + '. Ahora usas ' + formatBytes(S.storageUsed()) + '.', 'success');
    renderBackup();
  }

  async function deleteCloud() {
    const typed = el('input', { type: 'text', placeholder: 'BORRAR', autocomplete: 'off', 'aria-label': 'Escribe BORRAR para confirmar' });
    const ok = await dialog({
      title: '¿Borrar tus datos de la nube?',
      body: el('div', { style: { display: 'grid', gap: '10px' } },
        el('p', 'Se borrarán de tu cuenta todos los quizzes, carpetas, estudiantes, ajustes y voces. Tus otras tabletas dejarán de recibirlos. Esto no se puede deshacer.'),
        el('label.field', 'Para confirmar, escribe BORRAR', typed)),
      actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: 'Borrar de la nube', kind: 'danger', value: () => (typed.value.trim().toUpperCase() === 'BORRAR' ? true : (toast('Escribe BORRAR para confirmar.', 'error'), typed.focus(), undefined)) }],
    });
    if (!ok) return;
    try { await LL.sync.deleteCloudData(); toast('Tus datos de la nube se borraron.', 'success'); renderBackup(); }
    catch (e) { toast('No se pudo borrar: ' + LL.auth.friendly(e), 'error'); }
  }

  async function deleteAll() {
    const typed = el('input', { type: 'text', placeholder: 'BORRAR', autocomplete: 'off', 'aria-label': 'Escribe BORRAR para confirmar' });
    const ok = await dialog({
      title: '¿Borrar todo?',
      body: el('div', { style: { display: 'grid', gap: '10px' } },
        el('p', 'Esto no se puede deshacer. Si quieres conservar tus actividades, primero descarga un respaldo.'),
        el('label.field', 'Para confirmar, escribe BORRAR', typed)),
      actions: [
        { label: 'Cancelar', kind: 'ghost', value: false },
        { label: '📥 Descargar respaldo primero', kind: 'soft', value: () => { LL.media.inlineBackup(S.exportBackup()).then((b) => { download('little-learners-respaldo-' + S.todayChicago() + '.json', JSON.stringify(b)); toast('Respaldo descargado.', 'success'); }); } },
        { label: 'Borrar todo', kind: 'danger', value: () => (typed.value.trim().toUpperCase() === 'BORRAR' ? true : (toast('Escribe BORRAR para confirmar.', 'error'), typed.focus(), undefined)) },
      ],
    });
    if (!ok) return;
    S.deleteAllData();
    toast('Se borraron todos los datos de este dispositivo.', 'success');
    LL.app.goHome();
  }

  async function importFlow() {
    const f = await pickFile('application/json,.json');
    if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch { toast('No se pudo leer ese archivo.', 'error'); return; }
    if (!S.validateBackup(data)) { toast('Este archivo no es un respaldo de Little Learners Activities.', 'error'); return; }
    const lib = data.data[S.KEYS.library] || [], fol = data.data[S.KEYS.folders] || [];
    const nQ = lib.filter((x) => x.type === 'quiz').length;
    const isFolder = data.kind === 'folder';
    const actions = [{ label: 'Cancelar', kind: 'ghost', value: null }];
    if (!isFolder) actions.push({ label: 'Reemplazar todo', kind: 'danger-ghost', value: 'replace' });
    actions.push({ label: 'Agregar a lo que ya tengo', kind: 'primary', value: 'merge' });
    const mode = await dialog({
      title: isFolder ? 'Importar carpeta compartida' : 'Importar respaldo',
      body: el('div', { style: { display: 'grid', gap: '8px' } },
        el('p', 'El archivo tiene ' + nQ + ' quiz(zes) y ' + fol.length + ' carpeta(s).'),
        el('p.small.muted', '«Agregar» conserva todo lo que ya tienes. ' + (isFolder ? '' : '«Reemplazar todo» borra lo de este navegador y deja solo lo del archivo.'))),
      actions,
    });
    if (!mode) return;
    if (mode === 'replace' && !(await confirmDialog('¿Reemplazar todo?', 'Se borrarán los quizzes y carpetas de este navegador que no estén en el archivo.', 'Reemplazar', true))) return;
    try {
      const cloudRoster = LL.cloud.signedIn() ? S.roster() : null;
      const r = S.importBackup(data, mode);
      S.mergeDuplicateFolders();
      // Signed in: students from the file are added to the class list in the database.
      if (cloudRoster) {
        const have = new Set(cloudRoster.map((x) => x.name.toLocaleLowerCase('es')));
        S.quietly(() => S.saveRoster(cloudRoster));
        for (const st of data.data[S.KEYS.roster] || []) {
          if (st && st.name && !have.has(String(st.name).toLocaleLowerCase('es'))) { have.add(String(st.name).toLocaleLowerCase('es')); await LL.sync.students.add({ name: String(st.name).slice(0, 40), animal: st.animal, avatar: st.avatar || '' }); }
        }
        LL.sync.run();
      }
      toast('Importado: ' + r.quizzes + ' quiz(zes) y ' + r.folders + ' carpeta(s).', 'success');
      renderBackup();
    } catch (e) { toast(e.message, 'error'); }
  }

  /* ---------- Sonidos iniciales ---------- */
  function syncImages(c, force) {
    const bank = LL.IMAGE_BANK[c.lang];
    const prev = !force && c.fixedImages && c.fixedImagesLang === c.lang ? c.fixedImages : {};
    const out = {};
    for (const letter of c.letters) {
      const options = bank[letter];
      const keep = [];
      for (const it of prev[letter] || []) if (options.some(([e, w]) => e === it[0] && w === it[1]) && !keep.some((k) => k[1] === it[1])) keep.push(it);
      const free = LL.ui.shuffle(options.filter(([, w]) => !keep.some((k) => k[1] === w)));
      out[letter] = [...keep.slice(0, c.per), ...free.slice(0, Math.max(0, c.per - keep.length))];
    }
    c.fixedImages = out;
    c.fixedImagesLang = c.lang;
  }

  function renderSonidos() {
    const page = $('#screen-sonidos-admin');
    const c = S.sonidos();
    if (!c.fixedImages) { syncImages(c); S.saveSonidos(c); }
    const commit = (redrawImages) => { if (redrawImages) syncImages(c); S.saveSonidos(c); renderSonidos(); };

    const show = el('input', { type: 'checkbox', checked: !!c.showToStudents });
    show.addEventListener('change', () => { c.showToStudents = show.checked; commit(false); toast(show.checked ? 'Los estudiantes ya ven «Sonidos iniciales».' : '«Sonidos iniciales» quedó oculto para los estudiantes.'); });

    const seg = (opts, val, fn) => {
      const w = el('div.segmented');
      for (const [v, label] of opts) w.append(el('button', { type: 'button', 'aria-pressed': String(String(v) === String(val)), onclick: () => fn(v) }, label));
      return w;
    };

    const letters = el('div.letters');
    for (const L of 'MPSLF') {
      const cb = el('input', { type: 'checkbox', checked: c.letters.includes(L) });
      cb.addEventListener('change', () => {
        const next = 'MPSLF'.split('').filter((x) => (x === L ? cb.checked : c.letters.includes(x)));
        if (!next.length) { cb.checked = true; toast('Elige al menos una letra.', 'error'); return; }
        c.letters = next; commit(true);
      });
      letters.append(el('label', cb, L));
    }

    const per = el('select', { style: { maxWidth: '140px' } });
    for (const n of [4, 5, 6, 7, 8]) per.append(new Option(String(n), String(n), false, n === c.per));
    per.addEventListener('change', () => { c.per = Number(per.value); commit(true); });

    const groups = el('div.image-groups');
    for (const L of c.letters) {
      const slots = el('div.image-slots');
      (c.fixedImages[L] || []).forEach(([emoji, word], idx) => {
        const sel = el('select', { 'aria-label': 'Letra ' + L + ', imagen ' + (idx + 1) });
        LL.IMAGE_BANK[c.lang][L].forEach(([e, w], k) => sel.add(new Option(e + ' ' + w, String(k), false, e === emoji && w === word)));
        sel.addEventListener('change', () => {
          const pick = LL.IMAGE_BANK[c.lang][L][Number(sel.value)];
          if (c.fixedImages[L].some((it, j) => j !== idx && it[1] === pick[1])) { toast('Esa imagen ya está elegida para esta letra.', 'error'); renderSonidos(); return; }
          c.fixedImages[L][idx] = [...pick]; commit(false);
        });
        slots.append(sel);
      });
      groups.append(el('div', el('h3', 'Letra ' + L), slots));
    }

    page.replaceChildren(el('div.tool-page',
      el('div', el('h1', '🔤 Sonidos iniciales'), el('p.lead', 'La actividad original de arrastrar dibujos a su letra. Los cambios se guardan solos.')),
      el('div.panel', { style: { display: 'grid', gap: '16px' } },
        el('div.field', el('label.switch', show, 'Mostrar a los estudiantes'), el('span.hint', 'Aparece como una tarjeta más en sus actividades.')),
        el('div.field', 'Letras', letters),
        el('div', { style: { display: 'flex', gap: '18px', flexWrap: 'wrap' } },
          el('div.field', 'Idioma', seg([['es', 'Español'], ['en', 'English']], c.lang, (v) => { c.lang = v; commit(true); })),
          el('div.field', 'Velocidad', seg([[28, 'Lenta'], [45, 'Normal'], [70, 'Rápida']], c.speed, (v) => { c.speed = Number(v); commit(false); })),
          el('label.field', 'Imágenes por letra', per)),
        el('button.btn.primary', { type: 'button', style: { justifySelf: 'start' }, onclick: () => LL.app.openSonidos() }, '▶️ Probar')),
      el('div.panel', { style: { display: 'grid', gap: '12px' } },
        el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px', flexWrap: 'wrap' } },
          el('h2', '🖼️ Imágenes'),
          el('button.btn.sm.ghost', { type: 'button', onclick: () => { syncImages(c, true); S.saveSonidos(c); renderSonidos(); } }, '🎲 Otra selección')),
        el('p.small.muted', 'Siempre salen estas mismas imágenes, aunque cambie su orden.'),
        groups)));
  }

  LL.teacher = { renderRoster, renderBackup, renderSonidos, avatar };
})();

</script>
  <script>
/* js/info.js */
/* About · Privacy · Terms · Accessibility · Credits (in Spanish, the app's language).
 * English versions live in the repository: PRIVACY.md and TERMS.md. */
window.LL = window.LL || {};
(function () {
  const { el, $ } = LL.ui;

  const SECTIONS = [
    ['acerca', 'Acerca de'], ['privacidad', 'Privacidad'], ['terminos', 'Términos de uso'],
    ['accesibilidad', 'Accesibilidad'], ['creditos', 'Créditos'],
  ];

  function render(focusId) {
    const c = LL.config;
    const page = $('#screen-info');
    const ul = (...items) => el('ul', items.map((t) => el('li', t)));
    const sec = (id, title, ...body) => el('section.panel.info-section', { id: 'info-' + id, tabindex: '-1', 'aria-labelledby': 'info-h-' + id }, el('h2', { id: 'info-h-' + id }, title), ...body);

        ul('Botones grandes para dedos pequeños y funciona con pantalla táctil, mouse o teclado (Tab, Enter, Escape).',

        contactLine),

      sec('creditos', 'Créditos y licencias',
        ul('Voces naturales creadas con ElevenLabs (elevenlabs.io), en su plan gratuito y para uso no comercial.',
          'Los emojis se muestran con los emojis propios de cada dispositivo (Apple, Google, Microsoft, etc.); la página no incluye archivos de emojis.',
          'El texto usa las fuentes que ya tiene el dispositivo; no se descargan fuentes.',

    if (focusId) setTimeout(() => { const t = $('#info-' + focusId); if (t) { t.scrollIntoView({ block: 'start' }); t.focus({ preventScroll: true }); } }, 30);

  <script>
/* js/auth.js */
/* Teacher sign-in, set-password (invitation / reset links), first sign-in on a
 * device, and the teacher PIN used on shared classroom tablets. */
window.LL = window.LL || {};
(function () {
  const { el, $, toast, dialog, confirmDialog } = LL.ui;
  const S = LL.store;
  const LOCAL_MODE = 'll-v122-local-mode';

  const localMode = () => { try { return localStorage.getItem(LOCAL_MODE) === '1'; } catch { return false; } };
  const setLocalMode = (on) => { try { if (on) localStorage.setItem(LOCAL_MODE, '1'); else localStorage.removeItem(LOCAL_MODE); } catch { /* ignore */ } };

  /** Should the app ask the teacher to sign in before anything else? */
  function needsLogin() { return LL.cloud.enabled() && !LL.cloud.signedIn() && !localMode(); }

  function friendly(e) {
    const m = String(e && e.message || e || '');
    if (e && e.code === 'offline') return 'No hay conexión a internet. Revisa el Wi-Fi e inténtalo de nuevo.';
    if (/invalid login credentials|invalid_grant|invalid_credentials/i.test(m)) return 'El correo o la contraseña no son correctos.';
    if (/email not confirmed/i.test(m)) return 'Primero confirma tu correo con el enlace que te enviamos.';
    if (/rate limit|too many/i.test(m)) return 'Demasiados intentos. Espera un momento y vuelve a intentarlo.';
    if (/should be different/i.test(m)) return 'La nueva contraseña debe ser diferente a la anterior.';
    if (/weak|at least/i.test(m)) return 'La contraseña es muy débil. Usa al menos 8 caracteres.';
    return m || 'Algo salió mal. Inténtalo de nuevo.';
  }

  /* ---------- Sign-in screen ---------- */
  function renderLogin(message) {
    const page = $('#screen-login');
    const email = el('input', { type: 'email', autocomplete: 'username', placeholder: 'tu@escuela.org', required: true, 'aria-label': 'Correo electrónico' });
    const pass = el('input', { type: 'password', autocomplete: 'current-password', placeholder: 'Contraseña', required: true, 'aria-label': 'Contraseña' });
    const err = el('p.problem-box', { hidden: true, role: 'alert' });
    const btn = el('button.btn.primary.big', { type: 'submit' }, 'Entrar');
    const form = el('form.login-form', { novalidate: true },
      el('label.field', 'Correo electrónico', email),
      el('label.field', 'Contraseña', pass),
      err, btn);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      if (!email.value.trim() || !pass.value) { err.textContent = 'Escribe tu correo y tu contraseña.'; err.hidden = false; return; }
      btn.disabled = true; btn.textContent = 'Entrando…';
      try {
        await LL.cloud.signIn(email.value.trim(), pass.value);
        await afterSignIn();
      } catch (ex) {
        err.textContent = friendly(ex); err.hidden = false;
      } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
    });
    page.replaceChildren(el('div.login-wrap',
      el('div.login-card.panel',
        el('div.login-logo', { 'aria-hidden': 'true' }, '✨'),
        el('h1', 'Little Learners'),
        el('p.lead', 'Entra con tu cuenta de maestro.'),
        message ? el('p.ok-box', message) : null,
        form,
        el('button.link-btn', { type: 'button', onclick: () => resetDialog(email.value) }, '¿Olvidaste tu contraseña?'),
        el('p.small.muted', 'Las cuentas son por invitación. Si necesitas una, pídela a quien administra esta página.')),
      el('div.login-alt',
        el('button.btn.ghost', { type: 'button', onclick: () => { setLocalMode(true); LL.app.go('students'); } }, 'Usar sin cuenta, solo en este dispositivo'),
        el('p.small.muted', 'Sin cuenta, las actividades se guardan solo en este navegador.')),
      el('footer.site-footer',
        el('button', { type: 'button', onclick: () => LL.app.openInfo('privacidad') }, 'Privacidad'), el('span', { 'aria-hidden': 'true' }, '·'),
        el('button', { type: 'button', onclick: () => LL.app.openInfo('terminos') }, 'Términos'))));
    setTimeout(() => email.focus(), 50);
  }

  async function resetDialog(prefill) {
    const email = el('input', { type: 'email', autocomplete: 'username', value: prefill || '', placeholder: 'tu@escuela.org' });
    const ok = await dialog({
      title: 'Cambiar contraseña',
      body: el('div', { style: { display: 'grid', gap: '10px' } }, el('p', 'Te enviaremos un correo con un enlace para crear una contraseña nueva.'), el('label.field', 'Correo electrónico', email)),
      actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: 'Enviar enlace', kind: 'primary', value: () => (email.value.trim() ? true : (email.focus(), undefined)) }],
    });
    if (!ok) return;
    try { await LL.cloud.sendPasswordReset(email.value.trim()); toast('Listo. Revisa tu correo (y la carpeta de spam).', 'success'); }
    catch (e) { toast(friendly(e), 'error'); }
  }

  /* ---------- New password (from invitation or reset email) ---------- */
  function renderSetPassword(kind) {
    const page = $('#screen-set-password');
    const p1 = el('input', { type: 'password', autocomplete: 'new-password', minlength: '8', placeholder: 'Mínimo 8 caracteres' });
    const p2 = el('input', { type: 'password', autocomplete: 'new-password', minlength: '8', placeholder: 'Repite la contraseña' });
    const err = el('p.problem-box', { hidden: true, role: 'alert' });
    const btn = el('button.btn.primary.big', { type: 'submit' }, 'Guardar contraseña');
    const form = el('form.login-form', { novalidate: true }, el('label.field', 'Contraseña nueva', p1), el('label.field', 'Repite la contraseña', p2), err, btn);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      if (p1.value.length < 8) { err.textContent = 'Usa al menos 8 caracteres.'; err.hidden = false; return; }
      if (p1.value !== p2.value) { err.textContent = 'Las contraseñas no coinciden.'; err.hidden = false; return; }
      btn.disabled = true;
      try {
        await LL.cloud.setPassword(p1.value);
        toast('Contraseña guardada.', 'success');
        await afterSignIn();
      } catch (ex) { err.textContent = friendly(ex); err.hidden = false; }
      finally { btn.disabled = false; }
    });
    const u = LL.cloud.user();
    page.replaceChildren(el('div.login-wrap', el('div.login-card.panel',
      el('div.login-logo', { 'aria-hidden': 'true' }, '🔑'),
      el('h1', kind === 'invite' ? '¡Bienvenido!' : 'Contraseña nueva'),
      el('p.lead', kind === 'invite' ? 'Crea una contraseña para tu cuenta de maestro.' : 'Escribe tu contraseña nueva.'),
      u && u.email ? el('p.muted', u.email) : null,
      form)));
    setTimeout(() => p1.focus(), 50);
  }

  /* ---------- First sign-in on this device ---------- */
  async function afterSignIn() {
    setLocalMode(false);
    const me = LL.cloud.user();
    const prev = LL.sync.owner();
    if (me && prev && prev !== me.id) {
      // Another teacher's activities are on this device: remove them before syncing.
      const ok = await confirmDialog('Este dispositivo tiene actividades de otra cuenta',
        'Para proteger su privacidad, se quitarán de este dispositivo (esa cuenta las conserva en la nube). Después se descargarán las tuyas.', 'Continuar');
      if (!ok) { await LL.cloud.signOut(); renderLogin(); LL.app.go('login'); return; }
      LL.sync.clearLocalLibrary();
      S.quietly(() => { S.saveRoster([]); S.savePinHash(null); });
      try { localStorage.removeItem(S.KEYS.settingsAt); } catch { /* ignore */ }
      LL.sync.reset(me.id);
    } else if (me && !prev) {
      if (LL.sync.localHasData()) {
        const nQ = S.quizzes().length, nF = S.folders().length;
        const ok = await dialog({
          title: '¿Subir tus actividades a tu cuenta?',
          body: 'En este dispositivo hay ' + nQ + ' quiz(zes) y ' + nF + ' carpeta(s). Se guardarán en tu cuenta para que aparezcan en tus otros dispositivos y tabletas.',
          actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: 'Subir a mi cuenta', kind: 'primary', value: true }],
        });
        if (!ok) { await LL.cloud.signOut(); renderLogin(); LL.app.go('login'); return; }
      }
      LL.sync.reset(me.id);
    }
    LL.app.go('students');
    toast('Sesión iniciada' + (me && me.email ? ': ' + me.email : '') + '. Sincronizando…');
    LL.sync.run().then((ok) => { if (ok) toast('✓ Actividades sincronizadas.', 'success'); });
  }

  async function signOut() {
    if (!(await confirmDialog('¿Cerrar sesión en este dispositivo?', 'Las actividades se quedan en este dispositivo, pero ya no se actualizarán hasta que vuelvas a entrar.', 'Cerrar sesión'))) return;
    await LL.sync.run().catch(() => {});
    await LL.cloud.signOut();
    toast('Sesión cerrada.');
    LL.app.goHome();
  }

  /* ---------- Teacher PIN ---------- */
  async function hashPin(pin) {
    const text = 'little-learners-pin|' + pin;
    try {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return 'sha256:' + [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
      }
    } catch { /* fall through */ }
    let h = 0x811c9dc5; // FNV-1a fallback for browsers without Web Crypto
    for (const ch of text) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
    return 'fnv:' + h.toString(16);
  }

  function pinPad(title, subtitle, extraActions = []) {
    return new Promise((resolve) => {
      let value = '';
      const dots = el('div.pin-dots', { 'aria-live': 'polite' });
      const draw = () => { dots.replaceChildren(...Array.from({ length: Math.max(4, value.length) }, (_, i) => el('span' + (i < value.length ? '.on' : '')))); dots.setAttribute('aria-label', value.length + ' dígitos'); };
      draw();
      const pad = el('div.pin-pad');
      const add = (d) => { if (value.length < 8) { value += d; draw(); } };
      for (const d of ['1', '2', '3', '4', '5', '6', '7', '8', '9']) pad.append(el('button', { type: 'button', onclick: () => add(d) }, d));
      pad.append(el('button', { type: 'button', 'aria-label': 'Borrar', onclick: () => { value = value.slice(0, -1); draw(); } }, '⌫'));
      pad.append(el('button', { type: 'button', onclick: () => add('0') }, '0'));
      pad.append(el('button.ok', { type: 'button', 'aria-label': 'Aceptar', onclick: () => finish() }, '✓'));
      const onKey = (e) => {
        if (/^[0-9]$/.test(e.key)) { add(e.key); e.preventDefault(); }
        else if (e.key === 'Backspace') { value = value.slice(0, -1); draw(); e.preventDefault(); }
        else if (e.key === 'Enter') { finish(); e.preventDefault(); }
      };
      document.addEventListener('keydown', onKey, true);
      let done;
      const p = dialog({ title, body: el('div.pin-box', subtitle ? el('p.muted', subtitle) : null, dots, pad), actions: [...extraActions, { label: 'Cancelar', kind: 'ghost', value: false }] });
      function finish() { done = value; document.querySelector('.modal-back')?.click(); }
      p.then((v) => { document.removeEventListener('keydown', onKey, true); resolve(v === 'forgot' ? 'forgot' : (done || null)); });
    });
  }

  let fails = 0, lockedUntil = 0;
  /** Ask for the PIN (if one is set). Resolves true when the teacher may enter.
   *  opts.title: heading of the PIN pad. opts.notice: show a wrong PIN in a box with «Aceptar». */
  async function checkPin(opts = {}) {
    const saved = S.pinHash();
    if (!saved) return true;
    const tell = async (title, text) => {
      if (opts.notice) await dialog({ title, body: el('p', text), actions: [{ label: 'Aceptar', kind: 'primary', value: true }] });
      else toast(text, 'error');
    };
    if (Date.now() < lockedUntil) { await tell('⏳ Espera un momento', 'Demasiados intentos. Espera ' + Math.ceil((lockedUntil - Date.now()) / 1000) + ' segundos.'); return false; }
    const me = LL.cloud.user();
    const pin = await pinPad(opts.title || '🔒 PIN del maestro', opts.hint || null, me ? [{ label: '¿Olvidaste el PIN?', kind: 'ghost', value: 'forgot' }] : []);
    if (pin == null) return false;
    if (pin === 'forgot') return forgotPin(me);
    if ((await hashPin(pin)) === saved) { fails = 0; return true; }
    fails++;
    if (fails >= 5) { lockedUntil = Date.now() + 30000; fails = 0; }
    await tell('❌ PIN incorrecto', 'El PIN no es correcto.');
    return false;
  }

  /** Entering the account password also opens the teacher area (and lets you change the PIN there). */
  async function forgotPin(me) {
    const pass = el('input', { type: 'password', autocomplete: 'current-password', placeholder: 'Contraseña' });
    const ok = await dialog({
      title: 'Entrar con tu contraseña',
      body: el('div', { style: { display: 'grid', gap: '10px' } }, el('p', 'Escribe la contraseña de ' + me.email + '. Luego puedes cambiar el PIN en «Ajustes».'), el('label.field', 'Contraseña', pass)),
      actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: 'Entrar', kind: 'primary', value: () => (pass.value ? true : (pass.focus(), undefined)) }],
    });
    if (!ok) return false;
    try { await LL.cloud.signIn(me.email, pass.value); return true; }
    catch (e) { toast(friendly(e), 'error'); return false; }
  }

  async function setPinFlow() {
    const a = await pinPad('Nuevo PIN', 'Elige de 4 a 8 números.');
    if (a == null) return;
    if (a.length < 4) { toast('El PIN debe tener al menos 4 números.', 'error'); return; }
    const b = await pinPad('Repite el PIN', null);
    if (b == null) return;
    if (a !== b) { toast('Los PIN no coinciden.', 'error'); return; }
    S.savePinHash(await hashPin(a));
    toast('PIN guardado' + (LL.cloud.signedIn() ? '. Se usará en todos tus dispositivos.' : '.'), 'success');
  }

  LL.auth = { needsLogin, localMode, setLocalMode, renderLogin, renderSetPassword, afterSignIn, signOut, checkPin, setPinFlow, friendly };
})();
