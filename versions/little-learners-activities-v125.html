  }

  function run() {
    if (!LL.cloud.signedIn()) return Promise.resolve(false);
    if (running) { again = true; return running; }
    running = (async () => {
      const st = state();
      try {
        if (!LL.cloud.user()) await LL.cloud.refresh();
        st.owner = (LL.cloud.user() || {}).id || st.owner;
        let changed = 0;
        if (!st.migrated) changed += await migrateLegacy(st);
        changed += await pull(st);
        // Folders with the same name in the same place (e.g. old + new copies) become one.
        const merged = S.mergeDuplicateFolders();
        if (merged) { changed += merged; clearTimeout(timer); timer = null; }
        await push(st);
        if (LL.results) await LL.results.flush().catch(() => 0); // results waiting on this device
        st.migrated = true;
        st.lastOk = new Date().toISOString();
        st.error = null;
        saveState(st);
        if (changed) document.dispatchEvent(new CustomEvent('ll-synced', { detail: { changed } }));
        return true;
      } catch (e) {
        st.error = e.code === 'offline' ? 'offline' : (e.message || 'error');
        saveState(st);
        console.warn('sync failed', e);
        if (e.status === 401 && !LL.cloud.signedIn()) document.dispatchEvent(new Event('ll-signed-out'));
        return false;
      }
    })().finally(() => {
      running = null;
      emit();
      if (again) { again = false; run(); }
    });
    emit();
    return running;
  }

  /* ---------- Database rows <-> the app's quiz format ---------- */
  const ref = (p) => LL.media.toRef(p);
  const path = (r) => LL.media.toPath(r) || null;

  function rowToEntry(r) {
    const questions = (r.quiz_questions || []).slice().sort((a, b) => a.position - b.position).map((q) => {
      const options = (q.quiz_options || []).slice().sort((a, b) => a.position - b.position).map((o) => {
        const opt = { id: o.id, text: o.text || '', image: ref(o.image_path), audioMode: o.audio_mode, audio: ref(o.audio_path), readTextEnabled: !!o.read_text_enabled, readText: o.read_text || '', correct: !!o.is_correct };
        if (o.tts) opt.tts = o.tts;
        return opt;
      });
      const item = { id: q.id, text: q.prompt || '', emoji: q.emoji || '', image: ref(q.image_path), audioMode: q.audio_mode, audio: ref(q.audio_path), readTextEnabled: !!q.read_text_enabled, readText: q.read_text || '', correctCount: Math.max(1, options.filter((o) => o.correct).length), options };
      if (q.tts) item.tts = q.tts;
      return item;
    });
    return {
      id: r.id, familyId: r.id, type: 'quiz', name: r.name, version: 1, folderId: r.folder_id || null,
      createdAt: iso(r.created_at), updatedAt: iso(r.updated_at),
      config: { lang: r.language, voiceGender: r.voice_gender === 'male' ? 'male' : 'female', mode: 'practice', questionOrder: r.question_order, answerOrder: r.answer_order, visibility: r.visible ? 'visible' : 'hidden', coverImage: ref(r.cover_path), questions },
    };
  }

  /** Upload any pictures/audio still stored inside the quiz. Returns true if something changed. */
  async function uploadMedia(entry) {
    let changed = false;
    const up = async (obj, key, folder) => {
      const v = obj[key];
      if (typeof v === 'string' && v.startsWith('data:')) { obj[key] = await LL.media.upload(v, folder); changed = changed || obj[key] !== v; }
    };
    const c = entry.config || {};
    await up(c, 'coverImage', 'covers');
    for (const q of c.questions || []) {
      await up(q, 'image', 'images'); await up(q, 'audio', 'audio');
      for (const o of q.options || []) { await up(o, 'image', 'images'); await up(o, 'audio', 'audio'); }
    }
    return changed;
  }

  function entryToPayload(entry, folderIds) {
    const c = entry.config || {};
    const seenQ = new Set();
    const questions = [], options = [];
    (c.questions || []).forEach((q, qi) => {
      if (!q.id || seenQ.has(q.id)) q.id = newId('q');
      seenQ.add(q.id);
      questions.push({ id: q.id, position: qi, prompt: q.text || '', emoji: q.emoji || '', image_path: path(q.image), audio_mode: q.audioMode || 'voice', audio_path: path(q.audio), read_text_enabled: !!q.readTextEnabled, read_text: q.readText || '', tts: q.tts || null });
      const seenO = new Set();
      (q.options || []).forEach((o, oi) => {
        if (!o.id || seenO.has(o.id)) o.id = newId('o');
        seenO.add(o.id);
        options.push({ question_id: q.id, id: o.id, position: oi, text: o.text || '', image_path: path(o.image), audio_mode: o.audioMode || 'none', audio_path: path(o.audio), read_text_enabled: !!o.readTextEnabled, read_text: o.readText || '', tts: o.tts || null, is_correct: !!o.correct });
      });
    });
    return {
      p_quiz: { id: entry.id, folder_id: entry.folderId && folderIds.has(entry.folderId) ? entry.folderId : null, name: String(entry.name || '').slice(0, 200), language: c.lang, voice_gender: c.voiceGender === 'male' ? 'male' : 'female', mode: 'practice', question_order: c.questionOrder, answer_order: c.answerOrder, visible: c.visibility === 'visible', cover_path: path(c.coverImage), created_at: entry.createdAt || entry.updatedAt, updated_at: entry.updatedAt },
      p_questions: questions,
      p_options: options,
    };
  }

  /* ---------- Download ---------- */
  async function pull(st) {
    let changed = 0;

    // Quizzes with their questions and answers
    for (let page = 0; page < 20; page++) {
      const rows = await LL.cloud.select('quizzes', 'select=*,quiz_questions(*,quiz_options(*))&server_updated_at=gt.' + encodeURIComponent(st.pulledQ) + '&order=server_updated_at.asc&limit=100');
      if (!rows || !rows.length) break;
      const lib = S.readLibrary();
      for (const r of rows) {
        const i = lib.findIndex((x) => x.id === r.id);
        if (r.deleted_at) {
          if (i >= 0 && ts(lib[i].updatedAt) <= ts(r.deleted_at)) { lib.splice(i, 1); changed++; }
          delete st.q[r.id];
        } else if (i < 0 && st.q[r.id] && ts(r.updated_at) <= ts(st.q[r.id])) {
          // Deleted on this device and not changed elsewhere since: the deletion will be uploaded.
        } else if (i < 0 || ts(r.updated_at) > ts(lib[i].updatedAt)) {
          const entry = rowToEntry(r);
          if (i >= 0) lib[i] = entry; else lib.push(entry);
          st.q[r.id] = entry.updatedAt;
          changed++;
        }
        st.pulledQ = r.server_updated_at;
      }
      S.quietly(() => S.writeLibrary(lib));
      saveState(st);
      if (rows.length < 100) break;
    }

    // Folders
    const fs = await LL.cloud.select('folders', 'select=id,name,parent_id,color,updated_at,deleted_at,server_updated_at&server_updated_at=gt.' + encodeURIComponent(st.pulledF) + '&order=server_updated_at.asc&limit=1000');
    if (fs && fs.length) {
      const all = S.folders();
      for (const r of fs) {
        const i = all.findIndex((x) => x.id === r.id);
        if (r.deleted_at) {
          if (i >= 0 && ts(all[i].updatedAt) <= ts(r.deleted_at)) { all.splice(i, 1); changed++; }
          delete st.f[r.id];
        } else if (i < 0 && st.f[r.id] && ts(r.updated_at) <= ts(st.f[r.id])) {
          // Deleted on this device; the deletion will be uploaded.
        } else if (i < 0 || ts(r.updated_at) > ts(all[i].updatedAt)) {
          const f = { id: r.id, name: r.name, parentId: r.parent_id || null, color: r.color, updatedAt: iso(r.updated_at) };
          if (i >= 0) all[i] = f; else all.push(f);
          st.f[r.id] = f.updatedAt;
          changed++;
        }
        st.pulledF = r.server_updated_at;
      }
      S.quietly(() => S.writeFolders(all));
    }

    // Students (small list: always read it whole)
    changed += await refreshStudents();

    // Settings (PIN, voice, Sonidos iniciales)
    const ss = await LL.cloud.select('ll_settings', 'select=sonidos,pin_hash,voice_id,male_voice_id,updated_at,server_updated_at&server_updated_at=gt.' + encodeURIComponent(st.pulledS));
    if (ss && ss.length) {
      const r = ss[0];
      if (ts(r.updated_at) > ts(S.settingsAt())) {
        S.quietly(() => {
          if (r.sonidos && typeof r.sonidos === 'object') S.saveSonidos(r.sonidos);
          S.savePinHash(r.pin_hash || null);
          const v = S.voice();
          if (r.voice_id === 'off') S.saveVoice({ ...v, enabled: false, maleVoiceId: r.male_voice_id || '' });
          else S.saveVoice({ ...v, enabled: true, voiceId: r.voice_id || '', maleVoiceId: r.male_voice_id || '' });
          localStorage.setItem(S.KEYS.settingsAt, JSON.stringify(iso(r.updated_at)));
        });
        st.settings = iso(r.updated_at);
        changed++;
      }
      st.pulledS = r.server_updated_at;
    }
    saveState(st);
    return changed;
  }

  /* ---------- Students ---------- */
  function randomAnimal(taken) {
    const free = ANIMALS.filter((a) => !taken.has(a));
    const list = free.length ? free : ANIMALS;
    return list[Math.floor(Math.random() * list.length)];
  }

  /** Read the class list from the database into the device copy. Returns 1 if it changed. */
  async function refreshStudents() {
    const rows = await LL.cloud.select('students', 'select=id,name,animal,avatar_path,sort_order&active=eq.true&order=sort_order.asc.nullslast,name.asc');
    if (!Array.isArray(rows)) return 0;
    const taken = new Set(rows.map((r) => r.animal).filter(Boolean));
    for (const r of rows) {
      if (!r.animal) { // new student added somewhere else without an icon
        r.animal = randomAnimal(taken); taken.add(r.animal);
        LL.cloud.patch('students', 'id=eq.' + r.id, { animal: r.animal }).catch(() => {});
      }
    }
    const roster = rows.map((r) => ({ id: r.id, name: r.name, animal: r.animal, avatar: ref(r.avatar_path) }));
    const before = JSON.stringify(S.roster());
    if (before === JSON.stringify(roster)) return 0;
    S.quietly(() => S.saveRoster(roster));
    return 1;
  }

  const students = {
    async add({ name, animal, avatar }) {
      const list = S.roster();
      const img = avatar && avatar.startsWith('data:') ? await LL.media.upload(avatar, 'students') : avatar;
      const sort = list.length;
      await LL.cloud.insert('students', [{ name, animal: animal || randomAnimal(new Set(list.map((s) => s.animal))), avatar_path: path(img), sort_order: sort, active: true }]);
      await refreshStudents();
    },
    async update(id, { name, animal, avatar }) {
      const img = avatar && avatar.startsWith('data:') ? await LL.media.upload(avatar, 'students') : avatar;
      await LL.cloud.patch('students', 'id=eq.' + id, { name, animal, avatar_path: path(img) });
      await refreshStudents();
    },
    /** Students are never deleted (their past results stay); they are marked inactive. */
    async remove(id) {
      await LL.cloud.patch('students', 'id=eq.' + id, { active: false });
      await refreshStudents();
    },
    /** Save the current order of the list. */
    async reorder(ids) {
      for (let i = 0; i < ids.length; i++) await LL.cloud.patch('students', 'id=eq.' + ids[i], { sort_order: i });
      await refreshStudents();
    },
  };

  /* ---------- Upload ---------- */
  async function push(st) {
    const me = LL.cloud.user();
    if (!me) return;
    const now = new Date().toISOString();

    // Folders first, so quizzes can point to them.
    const fol = S.folders();
    const folderIds = new Set(fol.map((f) => f.id));
    const fRows = [];
    for (const f of fol) {
      const stamp = f.updatedAt || now;
      if (!f.updatedAt) f.updatedAt = stamp;
      if (st.f[f.id] === stamp) continue;
      fRows.push({ id: f.id, teacher_id: me.id, name: String(f.name || '').slice(0, 120), parent_id: f.parentId && folderIds.has(f.parentId) ? f.parentId : null, color: f.color || null, updated_at: stamp, deleted_at: null });
    }
    for (const id of Object.keys(st.f).filter((id) => !folderIds.has(id))) fRows.push({ id, teacher_id: me.id, name: '', updated_at: now, deleted_at: now });
    if (fRows.length) {
      await LL.cloud.upsert('folders', fRows, 'id');
      for (const r of fRows) { if (r.deleted_at) delete st.f[r.id]; else st.f[r.id] = r.updated_at; }
      saveState(st);
    }
    S.quietly(() => S.writeFolders(fol));

    // Quizzes: only the newest version of each one (older V121 versions stay on the device).
    const latest = S.quizzes();
    const latestIds = new Set(latest.map((q) => q.id));
    for (const q of latest) {
      const stamp = q.updatedAt || q.createdAt || now;
      if (st.q[q.id] === stamp) continue;
      const lib = S.readLibrary();
      const entry = lib.find((x) => x.id === q.id);
      if (!entry) continue;
      if (!entry.updatedAt) entry.updatedAt = stamp;
      if (!entry.folderId && q.folderId) entry.folderId = q.folderId;
      await uploadMedia(entry);
      const payload = entryToPayload(entry, folderIds);
      await LL.cloud.rpc('save_quiz', payload);
      st.q[entry.id] = entry.updatedAt;
      saveState(st);
      // Keep the device copy pointing at the uploaded files (and any repaired ids).
      S.quietly(() => { const l2 = S.readLibrary(); const k = l2.findIndex((x) => x.id === entry.id); if (k >= 0 && l2[k].updatedAt === entry.updatedAt) { l2[k] = entry; S.writeLibrary(l2); } });
    }
    const gone = Object.keys(st.q).filter((id) => !latestIds.has(id));
    for (const id of gone) {
      await LL.cloud.patch('quizzes', 'id=eq.' + encodeURIComponent(id), { deleted_at: now, updated_at: now });
      delete st.q[id];
      saveState(st);
    }

    // Settings
    const sAt = S.settingsAt();
    if (sAt && sAt !== st.settings) {
      const v = S.voice();
      await LL.cloud.upsert('ll_settings', [{ owner_id: me.id, sonidos: S.sonidos(), pin_hash: S.pinHash(), voice_id: v.enabled ? (v.voiceId || null) : 'off', male_voice_id: v.maleVoiceId || null, updated_at: sAt }], 'owner_id');
      st.settings = sAt;
    }
    saveState(st);
  }

  /* ---------- One-time move from the V122 cloud tables (ll_quizzes / ll_folders) ---------- */
  async function migrateLegacy(st) {
    st.q = {}; st.f = {};
    st.pulledQ = EPOCH; st.pulledF = EPOCH;
    const already = await LL.cloud.select('quizzes', 'select=id&limit=1');
    if (already && already.length) return 0; // another device already moved everything
    let changed = 0;
    let rows = [];
    try { rows = await LL.cloud.select('ll_quizzes', 'select=id,family_id,type,name,version,folder_id,config,created_at,updated_at&deleted_at=is.null&type=eq.quiz&limit=1000'); } catch { rows = []; }
    if (rows && rows.length) {
      const lib = S.readLibrary();
      for (const r of rows) {
        const i = lib.findIndex((x) => x.id === r.id);
        if (i < 0 || ts(r.updated_at) > ts(lib[i].updatedAt)) {
          const e = { id: r.id, familyId: r.family_id || r.id, type: 'quiz', name: r.name, version: r.version, folderId: r.folder_id || null, config: r.config || {}, createdAt: iso(r.created_at), updatedAt: iso(r.updated_at) };
          if (i >= 0) lib[i] = e; else lib.push(e);
          changed++;
        }
      }
      S.quietly(() => S.writeLibrary(lib));
    }
    let fr = [];
    try { fr = await LL.cloud.select('ll_folders', 'select=id,name,parent_id,color,updated_at&deleted_at=is.null&limit=1000'); } catch { fr = []; }
    if (fr && fr.length) {
      const all = S.folders();
      for (const r of fr) {
        const i = all.findIndex((x) => x.id === r.id);
        if (i < 0 || ts(r.updated_at) > ts(all[i].updatedAt)) {
          const f = { id: r.id, name: r.name, parentId: r.parent_id || null, color: r.color, updatedAt: iso(r.updated_at) };
          if (i >= 0) all[i] = f; else all.push(f);
          changed++;
        }
      }
      S.quietly(() => S.writeFolders(all));
    }
    saveState(st);
    return changed;
  }

  /* ---------- Account switching ---------- */
  function localHasData() { return S.readLibrary().length > 0 || S.folders().length > 0; }
  function owner() { return state().owner; }

  /** Forget which rows were uploaded (used when a different teacher signs in). */
  function reset(ownerId) { saveState({ owner: ownerId || null, migrated: false, q: {}, f: {} }); try { localStorage.removeItem(OLD_STATE_KEY); } catch { /* ignore */ } }

  /** Remove this device's copy of the library (used when another account signs in). */
  function clearLocalLibrary() {
    S.quietly(() => { S.writeLibrary([]); S.writeFolders([]); });
  }

  /** Delete this teacher's activities from the cloud and from this device. Students
   *  are kept (they hold past results); the PIN and voice settings are cleared. */
  async function deleteCloudData() {
    const me = LL.cloud.user();
    if (!me) return;
    const now = new Date().toISOString();
    await LL.cloud.patch('quizzes', 'teacher_id=eq.' + me.id, { deleted_at: now, updated_at: now });
    await LL.cloud.remove('quiz_questions', 'teacher_id=eq.' + me.id);
    await LL.cloud.patch('folders', 'teacher_id=eq.' + me.id, { name: '', parent_id: null, deleted_at: now, updated_at: now });
    await LL.cloud.patch('ll_quizzes', 'owner_id=eq.' + me.id, { name: '', config: {}, folder_id: null, deleted_at: now, updated_at: now }).catch(() => {});
    await LL.cloud.patch('ll_folders', 'owner_id=eq.' + me.id, { name: '', parent_id: null, deleted_at: now, updated_at: now }).catch(() => {});
    await LL.cloud.upsert('ll_settings', [{ owner_id: me.id, roster: [], sonidos: null, pin_hash: null, voice_id: null, updated_at: now }], 'owner_id');
    clearLocalLibrary();
    S.quietly(() => S.savePinHash(null));
    for (const bucket of ['quiz-media', 'll-tts']) {
      try {
        for (const folder of bucket === 'quiz-media' ? ['covers', 'images', 'audio'] : ['']) {
          const prefix = me.id + (folder ? '/' + folder : '');
          const files = await LL.cloud.listFiles(bucket, prefix);
          await LL.cloud.removeFiles(bucket, (files || []).filter((f) => f.name && f.id !== null).map((f) => prefix + '/' + f.name));
        }
      } catch (e) { console.warn('could not remove files', bucket, e); }
    }
    const st = state(); st.q = {}; st.f = {}; st.migrated = true; saveState(st);
  }

  // Keep tablets up to date: when coming back online, when the page becomes visible, and every 2 minutes.
  window.addEventListener('online', () => run());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') run(); });
  setInterval(() => { if (document.visibilityState === 'visible' && !LL.player?.isOpen?.()) run(); }, 120000);

  LL.sync = { uploadMedia, schedule, run, status, onChange, owner, reset, localHasData, clearLocalLibrary, deleteCloudData, students, refreshStudents };
})();

</script>
  <script>
/* js/tts.js */
/* ElevenLabs voice. Audio is made once, when the teacher saves a quiz, by the
 * Supabase function "ll-tts" (which holds the secret API key). Children's
 * tablets just download and play the saved file. If anything is missing
 * (offline, not signed in, out of credits), the device voice is used instead. */
window.LL = window.LL || {};
(function () {
  const S = LL.store;
  const cache = new Map(); // storage path -> object URL
  const hasWords = (t) => /\p{L}/u.test(String(t || ''));

  function active() { return LL.cloud.signedIn() && S.voice().enabled; }

  /** Text that should be spoken for a question or an answer, or '' if none. */
  function speechText(item) {
    if (item.audioMode !== 'voice') return '';
    const t = item.readTextEnabled && String(item.readText || '').trim() ? item.readText : item.text;
    return String(t || '').trim();
  }

  /** Is there a saved ElevenLabs file for exactly this text? */
  function ready(item, gender) {
    const t = speechText(item);
    // An audio made with the other type of voice (before the teacher switched) is not used.
    return !!(t && item.tts && item.tts.path && item.tts.text === t && (!gender || (item.tts.gender || 'female') === gender));
  }

  async function url(path) {
    if (cache.has(path)) return cache.get(path);
    // Keep files between visits when the browser allows it (Cache Storage).
    let blob = null;
    try {
      if ('caches' in window) {
        const c = await caches.open('ll-tts-v1');
        const hit = await c.match('https://ll-tts.local/' + path);
        if (hit) blob = await hit.blob();
        if (!blob) { blob = await LL.cloud.download('ll-tts', path); c.put('https://ll-tts.local/' + path, new Response(blob, { headers: { 'Content-Type': 'audio/mpeg' } })).catch(() => {}); }
      }
    } catch { blob = null; }
    if (!blob) blob = await LL.cloud.download('ll-tts', path);
    const u = URL.createObjectURL(blob);
    cache.set(path, u);
    return u;
  }

  /** Download ahead of time so playback is instant when a child taps. */
  function prefetch(items, gender) {
    if (!LL.cloud.signedIn()) return;
    for (const it of items) if (it && ready(it, gender)) url(it.tts.path).catch(() => {});
  }

  /** Play the ElevenLabs file; resolves false if it could not (caller uses the device voice). */
  async function play(item, gender) {
    if (!ready(item, gender) || !LL.cloud.signedIn()) return false;
    try {
      LL.ui.playAudio(await url(item.tts.path));
      return true;
    } catch (e) {
      console.warn('voice file unavailable', e);
      return false;
    }
  }

  let warned = false;
  /** Make any missing voice files for a quiz. Mutates the quiz; returns how many were made. */
  async function prepareQuiz(quiz, onProgress) {
    if (!active()) return { made: 0, skipped: 0 };
    warned = false;
    const gender = quiz.config.voiceGender === 'male' ? 'male' : 'female';
    const voiceId = (gender === 'male' ? S.voice().maleVoiceId : S.voice().voiceId) || '';
    const jobs = [];
    for (const q of quiz.config.questions || []) {
      for (const it of [q, ...(q.options || [])]) {
        const t = speechText(it);
        if (!t || !hasWords(t)) continue;
        if (it.tts && it.tts.text === t && (it.tts.voice || '') === voiceId && (it.tts.gender || 'female') === gender) continue;
        jobs.push({ it, t });
      }
    }
    let made = 0, i = 0;
    for (const job of jobs) {
      onProgress && onProgress(++i, jobs.length);
      let r;
      try { r = await LL.cloud.invoke('ll-tts', { action: 'speak', text: job.t, lang: quiz.config.lang, voiceId, gender }); }
      catch (e) { if (!warned) { warned = true; LL.ui.toast('No se pudo crear la voz ahora (' + e.message + '). Se usará la voz del dispositivo.', 'error'); } break; }
      if (r && r.path) { job.it.tts = { path: r.path, text: job.t, voice: voiceId, gender }; made++; continue; }
      if (r && r.fallback) {
        const why = r.reason === 'no_api_key' ? 'falta la clave de ElevenLabs en Supabase'
          : /elevenlabs_(402|429)/.test(r.reason) ? 'se acabaron los créditos de ElevenLabs de este mes'
          : /elevenlabs_401/.test(r.reason) ? 'la clave de ElevenLabs no es válida'
          : r.reason;
        if (!warned) { warned = true; LL.ui.toast('Voz ElevenLabs no disponible: ' + why + '. Se usará la voz del dispositivo.', 'error'); }
        break;
      }
    }
    return { made, skipped: jobs.length - made };
  }

  <script>
/* js/player.js */
/* Quiz player. Same answer rules and timing as V121:
 *  - Correct: magic sound, the answer blinks green, next question after 2 s.
 *  - Wrong: buzzer, blinks red, then the correct answer blinks green, next after 2 s more.
 * (V124: the "Evaluación" mode was removed; every quiz works this way.)
 */
window.LL = window.LL || {};
(function () {
  const { el, $, toast, speak, playAudio, stopSound, feedbackTone, shuffle, confetti } = LL.ui;
  const PASTELS = ['#F8DDE3', '#FBE4D0', '#FFF1BD', '#DDF2D7', '#D8F0EC', '#DCE8FC'];

  let quiz = null, questions = [], index = 0, opts = {}, timer = null, run = 0, answered = false, selected = new Set();
  // What the child answered in this attempt (first answer of each question), for the results.
  let attempt = null, shownAt = 0;
  const newAttempt = () => { attempt = { startedAt: new Date().toISOString(), answers: [] }; };

  const root = () => $('#player');
  const body = () => $('#playerBody');

  function open(entry, options = {}) {
    quiz = entry;
    opts = options;
    questions = LL.store.clone(entry.config?.questions || []);
    if (entry.config?.questionOrder === 'random' && !options.preview) questions = shuffle(questions);
    index = Math.max(0, Math.min(options.startIndex || 0, questions.length - 1));
    newAttempt();
    root().hidden = false;
    root().classList.toggle('is-preview', !!options.preview);
    // Show who is playing, so the teacher can check at a glance that each child is on their own name.
    const who = LL.app.state.student, chip = $('#playerStudent');
    chip.hidden = !who || !!options.preview;
    chip.replaceChildren();
    if (who && !options.preview) chip.append(LL.teacher.avatar(who), el('span', who.name));
    chip.setAttribute('aria-label', who ? 'Estudiante: ' + who.name : '');
    document.body.style.overflow = 'hidden';
    render();
    document.dispatchEvent(new CustomEvent('ll-player-open', { detail: { quizId: entry.id || null, preview: !!options.preview } }));
  }

  /** fromHistory: closed by the browser's Back button (the page history already moved). */
  function close(how) {
    if (root().hidden) return;
    clearTimer();
    stopSound();
    root().hidden = true;
    document.body.style.overflow = '';
    const cb = opts.onClose;
    const id = quiz && quiz.id;
    quiz = null;
    cb && cb();
    document.dispatchEvent(new CustomEvent('ll-player-close', { detail: { quizId: id, fromHistory: !!(how && how.fromHistory) } }));
  }

  function clearTimer() { if (timer) clearTimeout(timer); timer = null; run++; }

  function promptSpeech(q) { return q.readTextEnabled && q.readText ? q.readText : q.text; }
  function hasPromptSound(q) {
    return (q.audioMode === 'file' && q.audio) || (q.audioMode === 'voice' && String(promptSpeech(q) || '').trim());
  }
  /** Natural ElevenLabs voice when it was prepared, otherwise the device voice. */
  async function sayItem(item, fallbackText) {
    const gender = (quiz && quiz.config?.voiceGender) || 'female';
    if (LL.tts && (await LL.tts.play(item, gender))) return;
    speak(fallbackText, quiz && quiz.config?.lang, gender);
  }
  function playPrompt(q) {
    if (q.audioMode === 'file' && q.audio) playAudio(q.audio);
    else if (q.audioMode === 'voice') sayItem(q, promptSpeech(q));
  }

  function renderProgress() {
    const p = $('#playerProgress');
    p.replaceChildren();
    if (opts.preview) p.append(el('span.preview-banner', 'Vista previa del maestro'));
    if (questions.length <= 20) {
      questions.forEach((_, i) => p.append(el('span.dot' + (i < index ? '.done' : i === index ? '.now' : ''))));
    } else {
      p.append(el('span.progress-text', `${index + 1} / ${questions.length}`));
    }
  }

  function render() {
    clearTimer();
    stopSound();
    answered = false;
    selected = new Set();
    const q = questions[index];
    const b = body();
    b.replaceChildren();
    if (!q) {
      renderProgress();
      b.append(el('div.finish', el('div.stars', '🤔'), el('h1', 'Esta actividad todavía no tiene preguntas.')));
      $('#playerSpeak').disabled = true;
      return;
    }
    renderProgress();
    shownAt = Date.now();

    // Question
    const hasImg = LL.media.isImage(q.image);
    const qa = el('div.question.enter' + (hasImg ? '.has-image' : ''));
    if (q.text) qa.append(el('div.question-text', q.text));
    if (hasImg) {
      const img = el('img.question-image', { src: q.image, alt: 'Imagen de la pregunta' });
      // Tapping the picture also reads the question (same as the 🔊 button).
      if (hasPromptSound(q)) {
        Object.assign(img, { tabIndex: 0, title: 'Toca para escuchar' });
        img.setAttribute('role', 'button');
        img.setAttribute('aria-label', 'Escuchar la pregunta');
        img.classList.add('tap-speak');
        const say = () => {
          playPrompt(q);
          img.classList.remove('pop'); void img.offsetWidth; img.classList.add('pop');
        };
        img.addEventListener('click', say);
        img.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); say(); } });
      }
      qa.append(img);
    }
    if (!q.text && !hasImg && q.emoji) qa.append(el('div.question-text', q.emoji));
    b.append(qa);

    const speakBtn = $('#playerSpeak');
    speakBtn.disabled = !hasPromptSound(q);
    speakBtn.onclick = () => playPrompt(q);

    // Answers
    let list = (q.options || []).map((o, i) => ({ ...o, _i: i }));
    if (quiz.config?.answerOrder === 'random') list = shuffle(list);
    const n = list.length;
    const grid = el('div.options.enter');
    if (n === 5) grid.classList.add('five');
    if (n === 2) grid.classList.add('two');
    grid.style.setProperty('--cols', String(n <= 4 ? n : 3));
    grid.style.setProperty('--rows', String(n <= 4 ? 1 : 2));
    grid.style.setProperty('--rows-portrait', String(Math.ceil(n / 2)));
    const correctNeeded = Math.max(1, q.options.filter((o) => o.correct).length || Number(q.correctCount) || 1);

    list.forEach((o, i) => {
      const img = LL.media.isImage(o.image);
      const btn = el('button.option' + (img ? '.has-image' : ''), { type: 'button', dataset: { index: String(o._i) }, 'aria-label': o.text || 'Respuesta ' + (i + 1) });
      btn.style.setProperty('--pastel', PASTELS[i % PASTELS.length]);
      btn.style.setProperty('--i', String(i));
      if (img) btn.append(el('img', { src: o.image, alt: o.text || '' }));
      if (o.text) btn.append(el('span.label', o.text));
      if ((o.audioMode === 'file' && o.audio) || (o.audioMode === 'voice' && (o.text || o.readText))) {
        const s = el('span.icon-btn.answer-sound', { role: 'button', tabindex: '0', 'aria-label': 'Escuchar esta respuesta' }, '🔊');
        const play = (e) => {
          e.preventDefault(); e.stopPropagation();
          if (answered) return;
          if (o.audioMode === 'file' && o.audio) playAudio(o.audio);
          else sayItem(o, o.readTextEnabled && o.readText ? o.readText : o.text);
        };
        s.addEventListener('click', play);
        s.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') play(e); });
        btn.append(s);
      }
      btn.addEventListener('click', () => choose(o._i, btn, q, grid, correctNeeded));
      grid.append(btn);
    });
    b.append(grid);
    setTimeout(() => { qa.classList.remove('enter'); grid.classList.remove('enter'); }, 120 + n * 70 + 450);
    requestAnimationFrame(() => { fitLabels(grid); requestAnimationFrame(() => fitLabels(grid)); });

    if (LL.tts) LL.tts.prefetch([q, ...(q.options || [])], quiz.config?.voiceGender || 'female');
    // Read the question aloud automatically (needs a tap first, which the child just did).
    const myRun = run;
    timer = setTimeout(() => { if (myRun === run && !root().hidden) playPrompt(q); }, 250);
  }

  /** Shrink only the answer texts that don't fit their box. */
  function fitLabels(grid) {
    grid.querySelectorAll('.option .label').forEach((tx) => {
      tx.style.fontSize = '';
      const box = tx.parentElement;
      let size = parseFloat(getComputedStyle(tx).fontSize) || 32;
      let guard = 0;
      while (size > 12 && guard++ < 120 && (tx.scrollWidth > box.clientWidth - 8 || box.scrollHeight > box.clientHeight + 1)) {
        size -= 2; tx.style.fontSize = size + 'px';
      }
    });
  }

  function choose(i, btn, q, grid, correctNeeded) {
    if (answered) return;
    if (selected.has(i)) return;
    selected.add(i);
    btn.classList.add('selected');
    if (selected.size < correctNeeded) return;

    answered = true;
    clearTimer();
    stopSound();
    const myRun = run;
    const buttons = [...grid.querySelectorAll('.option')];
    buttons.forEach((b) => { b.disabled = true; });
    const chosen = buttons.filter((b) => selected.has(Number(b.dataset.index)));
    const correctIdx = q.options.map((o, k) => (o.correct ? k : -1)).filter((k) => k >= 0);
    const isCorrect = selected.size === correctIdx.length && [...selected].every((k) => q.options[k] && q.options[k].correct);
    if (attempt && !attempt.answers.some((a) => a.question_id === q.id)) {
      const picked = [...selected].map((k) => q.options[k]).filter(Boolean);
      const original = (quiz.config?.questions || []).findIndex((x) => x.id === q.id);
      attempt.answers.push({
        position: original >= 0 ? original : index, question_id: q.id,
        prompt: String(q.text || q.readText || q.emoji || '').slice(0, 300),
        chosen_option_ids: picked.map((o) => o.id), chosen_text: picked.map((o) => o.text || '🖼️').join(', ').slice(0, 200),
        correct: isCorrect, response_ms: Date.now() - shownAt,
      });
    }
    const flash = (b, good) => { b.classList.remove('selected'); b.classList.add(good ? 'flash-correct' : 'flash-incorrect'); };

    if (isCorrect) {
      feedbackTone(true);
      chosen.forEach((b) => flash(b, true));
      const r = chosen[0].getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2);
      next(2000, myRun);
      return;
    }
    feedbackTone(false);
    chosen.forEach((b) => flash(b, !!q.options[Number(b.dataset.index)].correct));
    timer = setTimeout(() => {
      if (myRun !== run || root().hidden) return;
      buttons.filter((b) => q.options[Number(b.dataset.index)].correct).forEach((b) => { b.classList.remove('flash-correct', 'flash-incorrect'); void b.offsetWidth; flash(b, true); });
      next(2000, myRun);
    }, 2000);
  }

  function next(ms, myRun) {
    timer = setTimeout(() => {
      if (myRun !== run || root().hidden) return;
      if (index < questions.length - 1) { index++; render(); } else finish();
    }, ms);
  }

  function finish() {
    clearTimer();
    index = questions.length;
    renderProgress();
    $('#playerSpeak').disabled = true;
    feedbackTone(true);
    setTimeout(() => confetti(null, innerHeight * 0.35, 40), 150);
    const who = LL.app.state.student;
    // Save the result (one per student, quiz and month; the newest replaces older ones).
    if (!opts.preview && who && quiz.id && attempt && LL.results) {
      LL.results.record({ quiz, student: who, answers: attempt.answers, total: questions.length, startedAt: attempt.startedAt, finishedAt: new Date().toISOString() });
    }
    const showBoard = !opts.preview && who && quiz.id && LL.results;
    const board = showBoard ? el('div.board', { 'aria-live': 'polite' }, el('p.muted', 'Cargando los resultados de hoy…')) : null;
    body().replaceChildren(el('div.finish' + (showBoard ? '.with-board' : ''),
      el('div.stars', '⭐🌟⭐'),
      el('h1', who ? `¡Muy bien, ${who.name}!` : '¡Muy bien!'),
      el('p.lead', 'Terminaste «' + quiz.name + '».'),
      board,
      el('div.finish-buttons',
        el('button.btn.ghost.big', { type: 'button', onclick: () => { index = 0; newAttempt(); render(); } }, '🔁 Otra vez'),
        // Students: «Salir» goes back to «¿Quién eres?» so the next child can pick their animal.
        opts.preview
          ? el('button.btn.primary.big', { type: 'button', onclick: () => close() }, 'Cerrar vista previa')
          : el('button.btn.primary.big', { type: 'button', onclick: () => LL.app.goHome() }, '👋 Salir')),
    ));
    if (showBoard) fillBoard(board, quiz, who);
  }

  /** Today's results of this quiz for the whole class: best first, then who is still pending. */
  async function fillBoard(board, q, who) {
    let data;
    try { data = await LL.results.dayBoard(q); } catch { data = null; }
    if (!board.isConnected) return;
    if (!data) { board.replaceChildren(el('p.muted', 'No se pudieron cargar los resultados de hoy.')); return; }
    const me = (r) => (who.id != null ? r.student_id === who.id || r.id === who.id : (r.student_name || r.name) === who.name);
    const list = el('ol.board-list');
    const clock = LL.results.clock;
    for (const r of data.rows) {
      list.append(el('li' + (me(r) ? '.me' : ''),
        el('span.b-place', r.place <= 3 ? ['🥇', '🥈', '🥉'][r.place - 1] : String(r.place)),
        LL.teacher.avatar({ animal: r.student_animal, avatar: r.student_avatar }),
        el('span.b-name', r.student_name),
        el('span.b-score', r.score + ' / ' + r.total),
        el('span.b-time', { 'aria-label': 'Tiempo ' + clock(r.duration_seconds) }, clock(r.duration_seconds))));
    }
    for (const s of data.missing) {
      list.append(el('li.pending' + (me(s) ? '.me' : ''),
        el('span.b-place', '·'),
        LL.teacher.avatar(s),
        el('span.b-name', s.name),
        el('span.b-score.b-pending', '⏳ Pendiente'),
        el('span.b-time')));
    }
    const head = el('div.board-head', { 'aria-hidden': 'true' },
      el('span', 'Puesto'), el('span'), el('span', 'Nombre'), el('span', 'Puntos'), el('span', 'Tiempo'));
    board.replaceChildren(el('h2', '🏆 Resultados de hoy'), head, list);
    const mine = list.querySelector('li.me');
    if (mine) setTimeout(() => mine.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 300);
  }

  // Wire fixed controls once.
  document.addEventListener('DOMContentLoaded', () => {
    // Exit: students must hold the button for 3 seconds (a ring fills up), so a stray tap
    // doesn't end the activity. In the teacher's preview a normal click is enough.
    const exitBtn = $('#playerExit');
    const HOLD_MS = 3000;
    let holdTimer = null, held = false;
    const studentMode = () => !opts.preview;
    const hint = () => {
      exitBtn.classList.remove('nudge'); void exitBtn.offsetWidth; exitBtn.classList.add('nudge');
      toast('Para salir, deja el dedo sobre ↩️ hasta que se llene el círculo.');
    };
    const stopHold = (showHint) => {
      if (!holdTimer) return;
      clearTimeout(holdTimer); holdTimer = null;
      exitBtn.classList.remove('holding');
      if (showHint) hint();
    };
    exitBtn.addEventListener('pointerdown', (e) => {
      if (!studentMode() || e.button > 0) return;
      e.preventDefault();
      held = false;
      exitBtn.classList.add('holding');
      holdTimer = setTimeout(() => {
        holdTimer = null; held = true; exitBtn.classList.remove('holding');
        // When the finger lifts, the browser "taps" whatever is now under it (e.g. the logo). Ignore that tap.
        const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
        document.addEventListener('click', swallow, true);
        const release = () => setTimeout(() => document.removeEventListener('click', swallow, true), 300);
        window.addEventListener('pointerup', release, { once: true });
        setTimeout(() => document.removeEventListener('click', swallow, true), 8000); // safety net
        close();
      }, HOLD_MS);
    });
    exitBtn.addEventListener('pointerup', () => stopHold(true));
    exitBtn.addEventListener('pointerleave', () => stopHold(true));
    exitBtn.addEventListener('pointercancel', () => stopHold(false));
    exitBtn.addEventListener('contextmenu', (e) => e.preventDefault());
    exitBtn.addEventListener('click', (e) => {
      if (!studentMode()) { close(); return; }
      e.preventDefault();
      // Keyboard (Enter/Space) or a click that didn't come from a hold: just explain.
      if (!held && e.detail === 0) hint();
      held = false;
    });
    document.addEventListener('keydown', (e) => {
      if (root().hidden) return;
      if (e.key === 'Escape') { if (opts.preview) close(); return; } // students exit only by holding ↩️
      if (!opts.preview) return; // arrow-key navigation is for the teacher's preview only
      if (['ArrowRight', 'ArrowDown'].includes(e.key) && index < questions.length - 1) { e.preventDefault(); index++; render(); }
      if (['ArrowLeft', 'ArrowUp'].includes(e.key) && index > 0) { e.preventDefault(); index--; render(); }
    });
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { const g = $('#playerBody .options'); if (g && !root().hidden) fitLabels(g); }, 120);
    });
  });

  LL.player = { open, close, isOpen: () => !root().hidden, quizId: () => (quiz && quiz.id) || null };
})();

</script>
  <script>
/* js/results.js */
/* Quiz results (V124).
 *
 * Rule from the teacher: ONE result per student, per quiz, per month. When a
 * child does the same quiz again in the same month, the newest attempt replaces
 * the older one (both the total and the question-by-question detail).
 *
 * A finished quiz is first stored on the device (so nothing is lost without
 * internet) and then uploaded with save_quiz_result(), which keeps only the
 * newest attempt of each month. The teacher sees a ranking per quiz and month. */
window.LL = window.LL || {};
(function () {
  const { el, $, toast, dialog } = LL.ui;
  const S = LL.store;
  const KEY = 'll-v124-results';
  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  /** 'YYYY-MM-01' of a date, in the school's time zone (Chicago). */
  function monthOf(d = new Date()) {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit' }).formatToParts(d).map((x) => [x.type, x.value]));
    return `${p.year}-${p.month}-01`;
  }
  const shiftMonth = (m, d) => { const [y, mo] = m.split('-').map(Number); const t = new Date(Date.UTC(y, mo - 1 + d, 1)); return t.toISOString().slice(0, 8) + '01'; };
  const monthLabel = (m) => { const [y, mo] = m.split('-').map(Number); return MONTHS[mo - 1] + ' ' + y; };

  function readAll() { return S.readJSON(KEY, {}) || {}; }
  function writeAll(x) { try { localStorage.setItem(KEY, JSON.stringify(x)); } catch (e) { console.warn('results not saved', e); } }
  const keyOf = (r) => (r.student_id != null ? 'id:' + r.student_id : 'n:' + String(r.student_name).toLowerCase()) + '|' + r.quiz_id + '|' + r.month;

  /** Called by the player when a child finishes a quiz. */
  function record({ quiz, student, answers, total, startedAt, finishedAt }) {
    const score = answers.filter((a) => a.correct).length;
    const r = {
      student_id: typeof student.id === 'number' || /^\d+$/.test(String(student.id || '')) ? Number(student.id) : null,
      student_name: student.name, student_animal: student.animal || '', student_avatar: student.avatar || '',
      quiz_id: quiz.id, quiz_name: quiz.name, month: monthOf(new Date(finishedAt)),
      score, total, started_at: startedAt, finished_at: finishedAt,
      duration_seconds: Math.max(0, Math.round((Date.parse(finishedAt) - Date.parse(startedAt)) / 1000)),
      answers: answers.slice().sort((a, b) => a.position - b.position), uploaded: false,
    };
    const all = readAll();
    const k = keyOf(r);
    if (all[k] && Date.parse(all[k].finished_at) > Date.parse(r.finished_at)) return;
    all[k] = r;
    writeAll(all);
    flush();
  }

  let flushing = null;
  /** Upload results that are waiting on this device. */
  function flush() {
    if (!LL.cloud.signedIn()) return Promise.resolve(0);
    if (flushing) return flushing;
    flushing = (async () => {
      const all = readAll();
      let sent = 0;
      for (const [k, r] of Object.entries(all)) {
        if (r.uploaded || r.student_id == null) continue;
        try {
          await LL.cloud.rpc('save_quiz_result', {
            p_result: { student_id: r.student_id, quiz_id: r.quiz_id, month: r.month, score: r.score, total: r.total, started_at: r.started_at, finished_at: r.finished_at, duration_seconds: r.duration_seconds },
            p_answers: r.answers,
          });
          delete all[k]; // safely in the database now
          sent++;
        } catch (e) {
          if (e.code === 'offline' || e.status === 0) break; // try again when back online
          // e.g. the quiz isn't uploaded yet: keep it and try on the next sync
          console.warn('result upload postponed', e.message);
        }
      }
      writeAll(all);
      return sent;
    })().finally(() => { flushing = null; });
    return flushing;
  }
  window.addEventListener('online', () => flush());

  /* ---------- Teacher view ---------- */
  /** 'YYYY-MM-DD' of a date in the school's time zone. */
  function dayOf(d = new Date()) {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date(d)).map((x) => [x.type, x.value]));
    return `${p.year}-${p.month}-${p.day}`;

  const VIEW_KEY = 'll-v124-results-view';

  /** Best score first; with the same score, the one who finished faster goes first.

  function rank(rows) {
    rows.sort((a, b) => (b.score / Math.max(1, b.total)) - (a.score / Math.max(1, a.total)) || b.score - a.score || (a.duration_seconds ?? 1e9) - (b.duration_seconds ?? 1e9) || a.student_name.localeCompare(b.student_name, 'es'));

  async function render() {

    } else {
      const avg = Math.round(rows.reduce((s, r) => s + r.score / Math.max(1, r.total), 0) / rows.length * 100);
      panel.append(el('p.small.muted', rows.length + (rows.length === 1 ? ' estudiante' : ' estudiantes') + ' · promedio de la clase: ' + avg + ' %'));

        el('div.rt-row.rt-head', { role: 'row' }, el('span', { role: 'columnheader' }, 'Puesto'), el('span', { role: 'columnheader' }, 'Estudiante'), el('span', { role: 'columnheader' }, 'Puntaje'), el('span.rt-date', { role: 'columnheader' }, 'Fecha'), el('span', { role: 'columnheader' }, 'Tiempo')));

  /* ---------- Drag an activity onto a folder (teacher only) ----------

  function popMenu(e, items) {

      const off = (ev) => { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('pointerdown', off); } };

  function folderOptions(excludeId) {

    const isInside = (id) => { let p = id; while (p) { if (p === excludeId) return true; p = (all.find((x) => x.id === p) || {}).parentId; } return false; };
    all.filter((f) => !excludeId || !isInside(f.id))

      .forEach(({ f, label }) => sel.append(new Option('📁 ' + label, f.id)));

  async function moveDialog(t) {
    const sel = folderOptions();

    const ok = await dialog({ title: 'Mover «' + t.name + '»', body: el('label.field', 'Carpeta de destino', sel), actions: [{ label: 'Cancelar', kind: 'ghost', value: false }, { label: 'Mover', kind: 'primary', value: true }] });

  async function moveFolderDialog(f) {

  async function editFolder(f) {
    const isNew = !f;
    let color = f ? f.color : S.FOLDER_COLORS[0][1];
    const name = el('input', { type: 'text', maxlength: '90', placeholder: 'Ej. Español', value: f ? f.name : '' });

    });
    if (!ok) return;

    if (S.folderNameTaken(name.value, parent, f && f.id)) { toast('Ya hay una carpeta llamada «' + name.value.trim() + '» aquí. Usa otro nombre.', 'error'); return; }

  }

  document.addEventListener('DOMContentLoaded', () => {
    $('#newFolderBtn').addEventListener('click', () => editFolder(null));
    $('#newQuizBtn').addEventListener('click', () => LL.editor.open(null, currentFolder));

  LL.library = { render, setFolder, setFolderQuiet, resetToRoot, play, current: () => currentFolder };

  async function open(id, folderId) {

    } else {
      quiz = S.newQuiz(folderId);
    }

    qIndex = 0;

    const draft = S.readDraft();
    if (draft && draft.quizId === (id || 'new') && draft.quiz && JSON.stringify(draft.quiz) !== snapshot) {
      const when = draft.at ? new Date(draft.at).toLocaleString('es-US') : '';
      if (await confirmDialog('¿Recuperar cambios sin guardar?', 'Encontramos cambios de este quiz que no se guardaron' + (when ? ' (' + when + ')' : '') + '. ¿Quieres recuperarlos?', 'Recuperar')) {

  function changed() {

  function renderAll() {

      voiceNote));

    function begin() {

        const sr = side && side.scrollHeight > side.clientHeight ? side.getBoundingClientRect() : null;

      if (touch && onGrip) { e.preventDefault(); begin(); }

    });

      if (!d || e.pointerId !== d.id) return;
      d.x = e.clientX; d.y = e.clientY;
      if (!d.on) {
